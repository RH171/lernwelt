<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winkel-Werkstatt</title>
<!--
  Helenas Mathe-Spiel (14.09.2026). LehrplanPLUS Gymnasium Mathematik 7:
  "Winkel und Winkelsummen" - Neben-, Scheitel-, Stufen- und Wechselwinkel,
  Winkelsumme im Dreieck.

  Drei Werkstaetten:
   - Schätzen: Wie gross ist der Winkel? Gefuehl fuer Grad-Groessen.
   - Einstellen: Einen Schenkel mit dem Finger auf 125° drehen - ohne Anzeige.
   - Berechnen: fehlende Winkel an Geradenkreuzungen, Parallelen, im Dreieck.

  Zahlen werden ueber ein eigenes Tastenfeld eingegeben: Auf Helenas Handy
  (360 x 643) wuerde die Systemtastatur die halbe Zeichnung verdecken.
  Kein Zeitdruck; bewertet wird nur als Rueckschau.
-->
<link rel="stylesheet" href="/beruehrung.css">
<style>
  :root{
    --bg:#0e1320; --bg2:#0b0f18; --surface:#171d2e; --surface2:#1f2740; --line:#2a3350;
    --ink:#eef2fb; --muted:#8a92a8; --brand:#34d399; --brand2:#10b981; --ok:#49d6bd; --no:#ff7a6b; --gold:#ffce5c; --blau:#60a5fa;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --round:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);color:var(--ink);min-height:100vh;
    background:radial-gradient(900px 500px at 85% -10%,rgba(52,211,153,.13),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2));
    background-attachment:fixed;-webkit-font-smoothing:antialiased;padding:14px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .wrap{max-width:560px;margin:0 auto}
  .verborgen{display:none!important}
  header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;
    padding:10px 14px;font:800 14px/1 var(--round);color:var(--ink);text-decoration:none;min-height:44px}
  h1{font:800 20px/1.1 var(--round);margin:0;flex:1}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
  .start h2{font:800 24px/1.2 var(--round);margin:0 0 6px}
  .start p{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 12px}
  .deck{display:block;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:16px;
    padding:14px 16px;margin-top:10px;color:var(--ink);cursor:pointer;min-height:64px}
  .deck b{font:800 16px/1.3 var(--round);display:block}
  .deck span{color:var(--muted);font-size:13.5px}
  .deck .stand{float:right;color:var(--ok);font:800 13px/1.3 var(--round)}

  .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:700;margin-bottom:8px}
  .fortschritt{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:0 0 10px}
  .fortschritt i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0;transition:width .3s}
  .frage{font:800 18px/1.35 var(--round);margin:0 0 8px}
  .zeichnung{background:#0b1222;border:1px solid var(--line);border-radius:18px;overflow:hidden}
  svg.fig{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;max-height:40vh}
  .eingabe{display:flex;align-items:center;gap:10px;margin-top:10px}
  .anzeige{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:14px;min-height:54px;display:flex;align-items:center;justify-content:center;
    font:800 28px/1 var(--round);letter-spacing:.02em}
  .anzeige.leer{color:var(--muted);font-size:17px}
  .tasten{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
  .taste{background:var(--surface2);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:800 21px/1 var(--round);min-height:48px;cursor:pointer}
  .taste:active{transform:scale(.96)}
  .taste.ok{background:linear-gradient(150deg,var(--brand),var(--brand2));border:none;color:#06281d;grid-column:4;grid-row:1 / span 3}
  .taste.null{grid-column:span 2}
  .taste[disabled]{opacity:.45}
  .btn{flex:1;border:none;border-radius:16px;background:linear-gradient(150deg,var(--brand),var(--brand2));color:#06281d;font:800 17px/1 var(--round);padding:15px;cursor:pointer;min-height:54px}
  .reihe{display:flex;gap:10px;margin-top:10px}
  .erkl{margin-top:10px;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.55}
  .erkl .kopf{font:800 16px/1.3 var(--round);margin-bottom:4px}
  .erkl .kopf.gut{color:var(--ok)} .erkl .kopf.mittel{color:var(--gold)} .erkl .kopf.falsch{color:var(--no)}
  .ende{text-align:center}
  .ende .gross{font:800 54px/1 var(--round);background:linear-gradient(150deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .ende h2{font:800 22px/1.2 var(--round);margin:8px 0}
  .ende p{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 12px}
  .btn2{display:block;width:100%;margin-top:10px;background:var(--surface2);border:1px solid var(--line);border-radius:16px;color:var(--ink);
    font:800 16px/1 var(--round);padding:15px;cursor:pointer;min-height:52px;text-decoration:none;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="chip" href="spiele.html">‹ Spiele</a>
    <h1>Winkel-Werkstatt</h1>
  </header>

  <section class="panel start" id="sicht-start">
    <h2>Drei Werkstätten</h2>
    <p>Erst ein Gefühl für Grad bekommen, dann Winkel einstellen, dann fehlende Winkel ausrechnen.</p>
    <div id="decks"></div>
  </section>

  <section class="verborgen" id="sicht-spiel">
    <div class="meta"><span id="modusname"></span><span id="zaehler"></span></div>
    <div class="fortschritt"><i id="balken"></i></div>
    <p class="frage" id="frage"></p>
    <div class="zeichnung"><svg class="fig" id="fig" viewBox="0 0 360 260"></svg></div>
    <div id="bedienung"></div>
    <div id="erkl"></div>
  </section>

  <section class="panel ende verborgen" id="sicht-ende">
    <div class="gross" id="ende-zahl"></div>
    <h2 id="ende-titel"></h2>
    <p id="ende-text"></p>
    <button class="btn" id="nochmal" style="width:100%">Nochmal</button>
    <button class="btn2" id="andere">Andere Werkstatt</button>
    <a class="btn2" href="spiele.html">Zurück zu den Spielen</a>
  </section>
</div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var NS = "http://www.w3.org/2000/svg";
  var MODI = {
    schaetzen:  { name: "Schätzen",   kurz: "Wie groß ist der Winkel? Auf 10° genau ist ein Volltreffer." },
    einstellen: { name: "Einstellen", kurz: "Dreh den Schenkel auf den verlangten Winkel – ohne Anzeige." },
    berechnen:  { name: "Berechnen",  kurz: "Neben-, Scheitel-, Stufen-, Wechselwinkel und die Winkelsumme im Dreieck." }
  };
  var RUNDE = 8;

  var SPEICHER = "helena-winkel";
  function lesen(){ try { return JSON.parse(localStorage.getItem(SPEICHER) || "{}") || {}; } catch(e){ return {}; } }
  function schreiben(d){ try { localStorage.setItem(SPEICHER, JSON.stringify(d)); } catch(e){} }

  function zufall(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
  function wahl(f){ return f[Math.floor(Math.random() * f.length)]; }

  function decksMalen(){
    var d = lesen();
    $("decks").innerHTML = Object.keys(MODI).map(function(k){
      var st = d[k] ? '<span class="stand">' + d[k].best + '/' + RUNDE + '</span>' : "";
      return '<button class="deck" data-k="' + k + '">' + st + '<b>' + MODI[k].name + '</b><span>' + MODI[k].kurz + '</span></button>';
    }).join("");
    Array.prototype.forEach.call($("decks").children, function(b){ b.addEventListener("click", function(){ starten(b.getAttribute("data-k")); }); });
  }
  decksMalen();

  /* ---------- Zeichnen ---------- */
  function el(n, a, p){ var e = document.createElementNS(NS, n); for (var k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
  function pt(cx, cy, r, w){ var b = w * Math.PI / 180; return [cx + r * Math.cos(b), cy - r * Math.sin(b)]; }
  function strahl(g, cx, cy, w, r, farbe, dick){ var p = pt(cx, cy, r, w); return el("line", { x1: cx, y1: cy, x2: p[0], y2: p[1], stroke: farbe || "#eef2fb", "stroke-width": dick || 3, "stroke-linecap": "round" }, g); }
  // Bogen von w0 gegen den Uhrzeigersinn um "gross" Grad
  function bogen(g, cx, cy, w0, gross, r, farbe, text){
    var a = pt(cx, cy, r, w0), b = pt(cx, cy, r, w0 + gross);
    var gb = gross > 180 ? 1 : 0;
    if (Math.abs(gross - 90) < 0.01 && !text){
      var p1 = pt(cx, cy, 18, w0), p2 = pt(cx, cy, 18 * Math.SQRT2, w0 + 45), p3 = pt(cx, cy, 18, w0 + 90);
      el("path", { d: "M" + p1 + " L" + p2 + " L" + p3, fill: "none", stroke: farbe, "stroke-width": 2.5 }, g);
    } else {
      el("path", { d: "M" + cx + "," + cy + " L" + a[0] + "," + a[1] + " A" + r + "," + r + " 0 " + gb + " 0 " + b[0] + "," + b[1] + " Z",
                   fill: farbe, "fill-opacity": .18, stroke: farbe, "stroke-width": 2.5 }, g);
    }
    if (text){
      var m = pt(cx, cy, r + 20, w0 + gross / 2);
      var t = el("text", { x: m[0], y: m[1], fill: farbe, "font-size": 17, "font-weight": 800, "text-anchor": "middle", "dominant-baseline": "central",
                           "font-family": "ui-rounded,-apple-system,system-ui,sans-serif" }, g);
      t.textContent = text;
    }
  }
  function winkelart(w){
    if (w < 90) return "spitzer Winkel (unter 90°)";
    if (w === 90) return "rechter Winkel (genau 90°)";
    if (w < 180) return "stumpfer Winkel (zwischen 90° und 180°)";
    if (w === 180) return "gestreckter Winkel (genau 180°)";
    return "überstumpfer Winkel (über 180°)";
  }

  /* ---------- Aufgaben ---------- */
  function aufgabeBauen(modus, nr){
    if (modus === "schaetzen"){
      var w = nr < 2 ? zufall(3, 17) * 5 : nr < 6 ? zufall(19, 34) * 5 : zufall(37, 66) * 5;   // erst unter 180, dann auch ueberstumpf
      return { modus: modus, w: w, dreh: zufall(0, 359) };
    }
    if (modus === "einstellen"){
      return { modus: modus, w: wahl([30, 45, 60, 75, 90, 110, 120, 135, 150, 160, 200, 225, 270, 300]), dreh: zufall(0, 359) };
    }
    var art = ["neben", "scheitel", "dreieck", "stufen", "wechsel", "nachbar", "dreieck", "neben"][nr % 8];
    if (art === "dreieck"){ var a = zufall(6, 17) * 5, b = zufall(6, Math.min(20, 32 - a / 5)) * 5; return { modus: modus, art: art, a: a, b: b, loesung: 180 - a - b }; }
    var alpha = zufall(7, 32) * 5; if (alpha === 90) alpha = 95;
    var loes = (art === "neben" || art === "nachbar") ? 180 - alpha : alpha;
    return { modus: modus, art: art, a: alpha, loesung: loes, dreh: zufall(-20, 20) };
  }

  var modus = "schaetzen", liste = [], pos = 0, punkte = 0, eingabe = "", fertig = false, freierWinkel = 0;

  function zeige(n){ ["start", "spiel", "ende"].forEach(function(x){ $("sicht-" + x).classList.toggle("verborgen", x !== n); }); window.scrollTo(0, 0); }

  function starten(m){
    modus = m; liste = []; for (var i = 0; i < RUNDE; i++) liste.push(aufgabeBauen(m, i));
    if (m === "berechnen") liste.sort(function(){ return Math.random() - .5; });
    pos = 0; punkte = 0;
    $("modusname").textContent = MODI[m].name;
    zeige("spiel"); aufgabeZeigen();
  }

  function tastenfeld(){
    var h = '<div class="eingabe"><div class="anzeige leer" id="anzeige">Grad eintippen</div></div><div class="tasten">';
    // OK steht rechts oben und reicht ueber drei Zeilen. Die Ecke rechts unten bleibt
    // frei: Dort sitzt der Meldeknopf aus lernstand.js und haette die Taste verdeckt.
    ["7", "8", "9", "OK", "4", "5", "6", "1", "2", "3", "⌫", "0"].forEach(function(t){
      if (t === "OK") h += '<button class="taste ok" data-t="OK">OK</button>';
      else if (t === "0") h += '<button class="taste null" data-t="0">0</button>';
      else h += '<button class="taste" data-t="' + t + '">' + t + '</button>';
    });
    return h + '</div>';
  }
  function tastenAn(beiOk){
    eingabe = "";
    Array.prototype.forEach.call(document.querySelectorAll(".taste"), function(b){
      b.addEventListener("click", function(){
        if (fertig) return;
        var t = b.getAttribute("data-t");
        if (t === "⌫") eingabe = eingabe.slice(0, -1);
        else if (t === "OK"){ if (eingabe) beiOk(+eingabe); return; }
        else if (eingabe.length < 3) eingabe = (eingabe + t).replace(/^0+(?=\d)/, "");
        var a = $("anzeige");
        a.textContent = eingabe ? eingabe + "°" : "Grad eintippen";
        a.classList.toggle("leer", !eingabe);
      });
    });
  }

  function aufgabeZeigen(){
    var x = liste[pos], svg = $("fig");
    fertig = false; svg.innerHTML = ""; $("erkl").innerHTML = "";
    $("zaehler").textContent = (pos + 1) + " / " + liste.length;
    $("balken").style.width = (pos / liste.length * 100) + "%";
    var cx = 180, cy = 130;
    if (x.modus === "schaetzen"){
      $("frage").textContent = "Wie groß ist der markierte Winkel?";
      var g = el("g", {}, svg);
      bogen(g, cx, cy, x.dreh, x.w, 40, "#60a5fa");
      strahl(g, cx, cy, x.dreh, 115); strahl(g, cx, cy, x.dreh + x.w, 115);
      el("circle", { cx: cx, cy: cy, r: 4, fill: "#eef2fb" }, g);
      $("bedienung").innerHTML = tastenfeld();
      tastenAn(schaetzenPruefen);
    } else if (x.modus === "einstellen"){
      $("frage").innerHTML = "Dreh den grünen Schenkel auf <b style='color:var(--brand)'>" + x.w + "°</b>";
      freierWinkel = (x.w + 120) % 360; if (Math.abs(freierWinkel - x.w) < 40) freierWinkel = (freierWinkel + 90) % 360;
      einstellenMalen();
      $("bedienung").innerHTML = '<div class="reihe"><button class="btn" id="fertig">Eingestellt</button></div>';
      $("fertig").addEventListener("click", einstellenPruefen);
      ziehenAn();
    } else {
      berechnenMalen(x);
      $("bedienung").innerHTML = tastenfeld();
      tastenAn(berechnenPruefen);
    }
  }

  /* ---------- Schaetzen ---------- */
  function schaetzenPruefen(zahl){
    fertig = true;
    var x = liste[pos], d = Math.abs(zahl - x.w);
    var stufe = d <= 10 ? "gut" : d <= 25 ? "mittel" : "falsch";
    if (stufe === "gut") punkte++;
    try { window.lernstand && window.lernstand.antwort(stufe === "gut", "winkel schaetzen", zahl + "°", x.w + "°"); } catch(e){}
    var svg = $("fig"), cx = 180, cy = 130, g = el("g", {}, svg);
    // Deine Schaetzung als gestrichelter Schenkel dazu
    var p = pt(cx, cy, 125, x.dreh + zahl);
    el("line", { x1: cx, y1: cy, x2: p[0], y2: p[1], stroke: "#ffce5c", "stroke-width": 2.5, "stroke-dasharray": "6 6" }, g);
    var m = pt(cx, cy, 70, x.dreh + x.w / 2);
    var t = el("text", { x: m[0], y: m[1], fill: "#60a5fa", "font-size": 20, "font-weight": 800, "text-anchor": "middle", "dominant-baseline": "central", "font-family": "ui-rounded,system-ui" }, g);
    t.textContent = x.w + "°";
    $("erkl").innerHTML = '<div class="erkl"><div class="kopf ' + stufe + '">' +
      (stufe === "gut" ? "Volltreffer – " : stufe === "mittel" ? "Nah dran – " : "Daneben – ") + "es sind " + x.w + "°, du hattest " + zahl + "°</div>" +
      "Das ist ein " + winkelart(x.w) + "." + (x.w > 180 ? " Tipp: Ein überstumpfer Winkel ist 360° minus der kleine Winkel auf der anderen Seite – hier 360° − " + (360 - x.w) + "°." :
      stufe !== "gut" ? " Tipp: Vergleich mit 90° (Ecke eines Blatts) und 45° (halbe Ecke)." : "") +
      '</div><div class="reihe"><button class="btn" id="weiter">Weiter</button></div>';
    $("bedienung").innerHTML = "";
    $("weiter").addEventListener("click", weiter);
  }

  /* ---------- Einstellen ---------- */
  function einstellenMalen(){
    var x = liste[pos], svg = $("fig"), cx = 180, cy = 130;
    svg.innerHTML = "";
    var g = el("g", {}, svg);
    var gross = ((freierWinkel % 360) + 360) % 360;
    bogen(g, cx, cy, x.dreh, gross, 36, "#34d399");
    strahl(g, cx, cy, x.dreh, 120);
    var p = pt(cx, cy, 120, x.dreh + gross);
    el("line", { x1: cx, y1: cy, x2: p[0], y2: p[1], stroke: "#34d399", "stroke-width": 5, "stroke-linecap": "round" }, g);
    el("circle", { cx: p[0], cy: p[1], r: 13, fill: "#34d399" }, g);
    el("circle", { cx: p[0], cy: p[1], r: 30, fill: "rgba(0,0,0,0)" }, g);
    el("circle", { cx: cx, cy: cy, r: 4, fill: "#eef2fb" }, g);
  }
  var ziehenGebunden = false;
  function ziehenAn(){
    if (ziehenGebunden) return; ziehenGebunden = true;
    var svg = $("fig"), aktiv = false;
    function w(ev){
      var r = svg.getBoundingClientRect(), x = liste[pos];
      var px = (ev.clientX - r.left) / r.width * 360 - 180, py = 130 - (ev.clientY - r.top) / r.height * 260;
      var abs = Math.atan2(py, px) * 180 / Math.PI;
      return ((Math.round(abs - x.dreh)) % 360 + 360) % 360;
    }
    svg.addEventListener("pointerdown", function(ev){ if (fertig || liste[pos].modus !== "einstellen") return; aktiv = true; try { svg.setPointerCapture(ev.pointerId); } catch(_){} freierWinkel = w(ev); einstellenMalen(); ev.preventDefault(); });
    svg.addEventListener("pointermove", function(ev){ if (!aktiv || fertig) return; freierWinkel = w(ev); einstellenMalen(); });
    svg.addEventListener("pointerup", function(){ aktiv = false; });
    svg.addEventListener("pointercancel", function(){ aktiv = false; });
  }
  function einstellenPruefen(){
    fertig = true;
    var x = liste[pos], ist = ((freierWinkel % 360) + 360) % 360, d = Math.abs(ist - x.w);
    d = Math.min(d, 360 - d);
    var stufe = d <= 5 ? "gut" : d <= 15 ? "mittel" : "falsch";
    if (stufe === "gut") punkte++;
    try { window.lernstand && window.lernstand.antwort(stufe === "gut", "winkel zeichnen", ist + "°", x.w + "°"); } catch(e){}
    var svg = $("fig"), g = el("g", {}, svg), cx = 180, cy = 130;
    var p = pt(cx, cy, 128, x.dreh + x.w);
    el("line", { x1: cx, y1: cy, x2: p[0], y2: p[1], stroke: "#ffce5c", "stroke-width": 2.5, "stroke-dasharray": "6 6" }, g);
    var q = pt(cx, cy, 142, x.dreh + x.w);
    var t = el("text", { x: q[0], y: q[1], fill: "#ffce5c", "font-size": 15, "font-weight": 800, "text-anchor": "middle", "dominant-baseline": "central", "font-family": "ui-rounded,system-ui" }, g);
    t.textContent = x.w + "°";
    $("erkl").innerHTML = '<div class="erkl"><div class="kopf ' + stufe + '">' +
      (stufe === "gut" ? "Präzise! " : stufe === "mittel" ? "Knapp – " : "Nochmal üben – ") + "du hast " + ist + "° eingestellt, verlangt waren " + x.w + "°</div>" +
      "Gelb gestrichelt siehst du, wo " + x.w + "° liegen. " + (x.w > 180 ? "Überstumpf: erst 180° (gerade Linie), dann noch " + (x.w - 180) + "° weiter." : "Hilfe: 90° ist die Ecke, 180° die gerade Linie.") +
      '</div><div class="reihe"><button class="btn" id="weiter">Weiter</button></div>';
    $("bedienung").innerHTML = "";
    $("weiter").addEventListener("click", weiter);
  }

  /* ---------- Berechnen ---------- */
  var NAMEN = {
    neben: ["Nebenwinkel", "Nebenwinkel ergänzen sich zu 180°, weil sie zusammen eine gerade Linie bilden."],
    scheitel: ["Scheitelwinkel", "Scheitelwinkel liegen sich gegenüber und sind gleich groß."],
    stufen: ["Stufenwinkel", "An geschnittenen Parallelen sind Stufenwinkel (F-Figur) gleich groß."],
    wechsel: ["Wechselwinkel", "An geschnittenen Parallelen sind Wechselwinkel (Z-Figur) gleich groß."],
    nachbar: ["Nachbarwinkel", "An geschnittenen Parallelen ergänzen sich Nachbarwinkel (E-Winkel, C-Figur) zu 180°."],
    dreieck: ["Winkelsumme im Dreieck", "Die drei Innenwinkel eines Dreiecks ergeben zusammen immer 180°."]
  };

  function berechnenMalen(x){
    var svg = $("fig"), g = el("g", {}, svg);
    var gelb = "#ffce5c", blau = "#60a5fa";
    if (x.art === "dreieck"){
      $("frage").textContent = "Wie groß ist der Winkel γ im Dreieck?";
      // Ecken aus den Winkeln bauen: A links, B rechts, C oben
      var A = [50, 220], B = [310, 220], L = 260;
      var ta = Math.tan(x.a * Math.PI / 180), tb = Math.tan(x.b * Math.PI / 180);
      var cxp = L * tb / (ta + tb), cyp = cxp * ta;
      var s = Math.min(1, 190 / cyp);                 // flache Dreiecke passen, spitze werden gestaucht
      var C = [A[0] + cxp, A[1] - cyp * s];
      if (s < 1){ /* nur optisch gestaucht - die Zahlen bleiben die Wahrheit */ }
      el("polygon", { points: [A, B, C].map(String).join(" "), fill: "rgba(96,165,250,.08)", stroke: "#eef2fb", "stroke-width": 3, "stroke-linejoin": "round" }, g);
      var winkelA = Math.atan2(A[1] - C[1], C[0] - A[0]) * 180 / Math.PI, winkelB = Math.atan2(B[1] - C[1], C[0] - B[0]) * 180 / Math.PI;
      bogen(g, A[0], A[1], 0, winkelA, 30, blau, "α = " + x.a + "°");
      bogen(g, B[0], B[1], winkelB, 180 - winkelB, 30, blau, "β = " + x.b + "°");
      var r1 = Math.atan2(C[1] - A[1], A[0] - C[0]) * 180 / Math.PI, r2 = Math.atan2(C[1] - B[1], B[0] - C[0]) * 180 / Math.PI;
      var start = ((r2 % 360) + 360) % 360, ende = ((r1 % 360) + 360) % 360, spann = ((ende - start) + 360) % 360;
      bogen(g, C[0], C[1], start, spann, 26, gelb, "γ = ?");
      return;
    }
    var cx = 180, cy = 130, d = x.dreh;
    if (x.art === "neben" || x.art === "scheitel"){
      $("frage").textContent = "Wie groß ist der Winkel β?";
      strahl(g, cx, cy, d, 160); strahl(g, cx, cy, d + 180, 160);
      strahl(g, cx, cy, d + x.a, 130); strahl(g, cx, cy, d + x.a + 180, 130);
      bogen(g, cx, cy, d, x.a, 34, blau, "α = " + x.a + "°");
      if (x.art === "neben") bogen(g, cx, cy, d + x.a, 180 - x.a, 26, gelb, "β = ?");
      else bogen(g, cx, cy, d + 180, x.a, 34, gelb, "β = ?");
      el("circle", { cx: cx, cy: cy, r: 4, fill: "#eef2fb" }, g);
      return;
    }
    // Parallelen mit Querlinie
    $("frage").textContent = "Die beiden Geraden sind parallel. Wie groß ist β?";
    var y1 = 80, y2 = 190, neig = x.a;                 // Winkel der Querlinie gegen die Parallelen
    el("line", { x1: 10, y1: y1, x2: 350, y2: y1, stroke: "#eef2fb", "stroke-width": 3 }, g);
    el("line", { x1: 10, y1: y2, x2: 350, y2: y2, stroke: "#eef2fb", "stroke-width": 3 }, g);
    var dx = (y2 - y1) / Math.tan(neig * Math.PI / 180);
    var P = [180 - dx / 2, y2], Q = [180 + dx / 2, y1];
    var e1 = pt(P[0], P[1], 260, neig), e0 = pt(P[0], P[1], -80, neig);
    el("line", { x1: e0[0], y1: e0[1], x2: e1[0], y2: e1[1], stroke: "#eef2fb", "stroke-width": 3 }, g);
    ["▸", "▸"].forEach(function(z, i){ var tt = el("text", { x: 330, y: i ? y2 - 8 : y1 - 8, fill: "#8a92a8", "font-size": 14 }, g); tt.textContent = "∥"; });
    // alpha oben an der oberen Parallele. Bei Nachbarwinkeln liegen beide ZWISCHEN den
    // Parallelen auf derselben Seite der Querlinie (E-Figur) - sonst waere es kein Nachbarwinkel.
    if (x.art === "nachbar") bogen(g, Q[0], Q[1], 180, neig, 26, blau, "α = " + x.a + "°");
    else bogen(g, Q[0], Q[1], 0, neig, 26, blau, "α = " + x.a + "°");
    if (x.art === "stufen") bogen(g, P[0], P[1], 0, neig, 26, gelb, "β = ?");
    if (x.art === "wechsel") bogen(g, P[0], P[1], 180, neig, 26, gelb, "β = ?");        // unten links: Z-Figur
    if (x.art === "nachbar") bogen(g, P[0], P[1], neig, 180 - neig, 22, gelb, "β = ?"); // oben links an der unteren Parallele
  }

  function berechnenPruefen(zahl){
    fertig = true;
    var x = liste[pos], stimmt = zahl === x.loesung;
    if (stimmt) punkte++;
    try { window.lernstand && window.lernstand.antwort(stimmt, NAMEN[x.art][0].toLowerCase(), zahl + "°", x.loesung + "°"); } catch(e){}
    var rechnung = x.art === "dreieck" ? "γ = 180° − " + x.a + "° − " + x.b + "° = " + x.loesung + "°"
      : (x.art === "neben" || x.art === "nachbar") ? "β = 180° − " + x.a + "° = " + x.loesung + "°" : "β = α = " + x.loesung + "°";
    var tipp = "";
    if (!stimmt && x.art !== "dreieck" && (zahl === 180 - x.a || zahl === x.a)) tipp = "<br>Du hast „gleich groß“ und „ergänzt sich zu 180°“ verwechselt – schau, welche Figur es ist.";
    if (!stimmt && x.art === "dreieck" && zahl === 360 - x.a - x.b) tipp = "<br>360° ist die Summe im Viereck – im Dreieck sind es 180°.";
    $("erkl").innerHTML = '<div class="erkl"><div class="kopf ' + (stimmt ? "gut" : "falsch") + '">' + (stimmt ? "✓ Richtig: " : "✗ Es sind ") + x.loesung + "°</div>" +
      "<b>" + NAMEN[x.art][0] + ":</b> " + NAMEN[x.art][1] + "<br>" + rechnung + tipp +
      '</div><div class="reihe"><button class="btn" id="weiter">Weiter</button></div>';
    $("bedienung").innerHTML = "";
    $("weiter").addEventListener("click", weiter);
  }

  function weiter(){
    pos++;
    if (pos < liste.length){ aufgabeZeigen(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    var d = lesen(); var alt = d[modus] || {};
    d[modus] = { best: Math.max(alt.best || 0, punkte), runden: (alt.runden || 0) + 1 }; schreiben(d);
    $("ende-zahl").textContent = punkte + "/" + RUNDE;
    $("ende-titel").textContent = modus === "berechnen" ? "richtig berechnet" : modus === "schaetzen" ? "Volltreffer (auf 10° genau)" : "präzise eingestellt (auf 5° genau)";
    $("ende-text").textContent = punkte === RUNDE ? "Alles getroffen – stark." : "Mit jeder Runde wird das Gefühl für Winkel genauer.";
    zeige("ende"); decksMalen();
  }

  $("nochmal").addEventListener("click", function(){ starten(modus); });
  $("andere").addEventListener("click", function(){ zeige("start"); });

  window.__winkel = { starten: starten, aufgabeBauen: aufgabeBauen, zustand: function(){ return { pos: pos, liste: liste, freierWinkel: freierWinkel }; },
    tippe: function(z){ String(z).split("").concat(["OK"]).forEach(function(t){ var b = document.querySelector('.taste[data-t="' + t + '"]'); if (b) b.click(); }); },
    stelle: function(w){ freierWinkel = w; einstellenMalen(); }, fertig: function(){ var b = $("fertig"); if (b) b.click(); }, weiter: function(){ var w = $("weiter"); if (w) w.click(); } };
})();
</script>
