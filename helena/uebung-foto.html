<!--
  Helena am 05.10.2026 (Meldung uhpehqypar): "Nein, ich meine in der lernwelt
  nicht hier übungsaufgaben, irgendwie, wo ich einen knopf auch habe oder
  irgendeinen keine Ahnung, wo ich draufklicken kann, dann ein foto machen
  kann und mir du mir dazu übungen stellst" - und danach: "Alle zusammen am
  ende. Und soll auswählbar sein wie viele fragen".

  Angefangen hatte es mit ihrem Französisch-Blatt (vouloir, pouvoir, savoir):
  Sie hatte gefragt "Kannst du mir dazu bitte übungsaufgaben stellen" und die
  Aufgaben im Meldungs-Faden bekommen - also im Chat, nicht in ihrer Welt.
  Hier ist der Knopf dafür.

  WARUM NICHT DAS LERNQUIZ: Das fragt aus dem SCHULHEFT ab - erst ablegen,
  Fach wählen, Blatt wählen, und jede Antwort wird sofort kontrolliert. Das
  ist der lange Weg und bleibt, wie er ist. Das hier ist der kurze daneben:
  Blatt vor sich, Foto, Aufgaben. Nichts wird abgelegt, nichts sortiert.

  ÜBEN, NICHT LÖSEN (Dennys Regel vom 16.09.2026): Der Server nimmt keine
  Aufgabe vom Blatt und verrät keine Lösung davon - er stellt eigene,
  ähnliche Aufgaben zum selben Stoff.

  Der Ablauf steht in /foto-uebung.js, EINMAL für alle drei Kinder.
-->
