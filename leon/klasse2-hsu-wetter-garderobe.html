<head>

<title>Was zieht Leon an?</title>
<!--
  Leons zweites HSU-Spiel zum Anfassen (14.09.2026).

  Leon geht zum Training - aber draussen ist mal Hitze, mal Regen, mal Schnee.
  Er zieht seine Figur selbst an: antippen heisst anziehen, nochmal antippen
  heisst ausziehen. Dann "Los zum Training!" - und die Rueckmeldung sagt
  genau, was fehlt oder was zu viel ist, mit dem Grund.

  Lehrplan HSU 1/2: Jahreszeiten, Wetter, Koerper und Gesundheit. Es gibt
  nicht die EINE richtige Kombination - erlaubt ist, was zum Wetter passt.
  Falsch ist nur, was nicht passt (Handschuhe bei 30 Grad), und fehlen darf
  nur, was man wirklich braucht.
-->

<style>

       padding:12px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}

  .verborgen{display:none!important}

    border:1px solid var(--line);border-radius:999px;padding:12px 16px;font-weight:600;font-size:15px;min-height:44px}
  h1{font-family:var(--rund);font-size:22px;margin:0;flex:1}
  .karte{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;
    box-shadow:0 1px 2px rgba(20,22,40,.05),0 12px 30px rgba(20,22,40,.08)}
  .start{text-align:center;max-width:720px;margin:0 auto;padding:22px}
  .start h2{font-family:var(--rund);font-size:26px;margin:4px 0 6px}

  .los:active{transform:scale(.98)}
  .rueckblick{margin-top:14px;color:var(--leon-dunkel);font-weight:700;font-size:15px}

  .buehne{display:grid;grid-template-columns:1fr;gap:12px}
  @media (orientation:landscape) and (min-width:760px){ .buehne{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);align-items:start} }
  .oben{display:flex;gap:12px;align-items:stretch}
  .wetter{flex:1;border-radius:18px;padding:12px;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:4px;min-height:120px;position:relative;overflow:hidden}
  .wetter .symbol{font-size:54px;line-height:1}
  .wetter .grad{font:800 32px/1 var(--rund)}
  .wetter .text{font-weight:700;font-size:16px;line-height:1.3}
  .figurbox{width:42%;min-width:150px;background:linear-gradient(180deg,#f8fafc,#eef2f7);border-radius:18px;display:flex;align-items:flex-end;justify-content:center;padding:6px}
  svg.figur{width:100%;max-height:270px;height:auto}
  @media (orientation:landscape) and (min-width:760px){
    .oben{flex-direction:column}
    .figurbox{width:100%}
    svg.figur{max-height:calc(100vh - 330px);min-height:200px}
  }
  .schrank h3{font:700 16px/1.2 var(--rund);margin:0 0 8px;color:var(--muted)}
  .teile{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .teil{border:2px solid var(--line);background:#fff;border-radius:14px;min-height:78px;cursor:pointer;padding:6px 4px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 13px/1.15 var(--font);color:var(--ink);text-align:center}
  .teil .e{font-size:28px;line-height:1;white-space:nowrap}
  .teil.an{border-color:var(--leon);background:#ecfdf3;box-shadow:inset 0 0 0 2px var(--leon)}
  .teil.an::after{content:"✓ an";font-size:11px;color:var(--leon-dunkel)}
  .teil:active{transform:scale(.96)}
  .reihe{display:flex;gap:10px;margin-top:12px}
  .knopf{flex:1;border:none;border-radius:16px;background:var(--leon);color:#fff;font:700 19px/1 var(--rund);padding:16px;cursor:pointer;min-height:56px}
  .knopf.grau{flex:0 0 56px;background:#f2f4f7;color:var(--ink);padding:0;font-size:24px}
  .rueck{margin-top:12px;border-radius:16px;padding:12px 14px;font-size:17px;line-height:1.5}
  .rueck.gut{background:#ecfdf3} .rueck.schlecht{background:#fff4ed}
  .rueck ul{margin:6px 0 0;padding-left:20px}
  .rueck b{font-family:var(--rund)}
  .fortschritt{display:flex;gap:6px;align-items:center;color:var(--muted);font-weight:700;margin-top:10px}
  .fortschritt i{width:14px;height:14px;border-radius:50%;background:#d0d5dd;display:block}
  .fortschritt i.g{background:var(--gut)} .fortschritt i.t{background:#fdb022} .fortschritt i.n{outline:3px solid var(--leon);outline-offset:1px}
  .ende{text-align:center;max-width:720px;margin:0 auto;padding:22px}
  .ende .gross{font-size:60px}
  .ende h2{font-family:var(--rund);font-size:28px;margin:6px 0}
  .ende p{color:var(--muted);font-size:17px;line-height:1.5;margin:6px 0 16px}
  .knopf2{display:block;width:100%;margin-top:10px;border:none;border-radius:16px;background:#f2f4f7;color:var(--ink);
    font:700 18px/1 var(--rund);padding:16px;cursor:pointer;min-height:54px;text-decoration:none;text-align:center}
  canvas.konfetti{position:fixed;inset:0;pointer-events:none;z-index:50}
</style>

<div class="huelle">
  <header>
    <a class="zurueck" href="/leon/">‹ Zurück</a>
    <h1>Was zieht Leon an?</h1>
  </header>

  <section class="karte start" id="sicht-start">
    <div style="font-size:56px">☀️🌧️❄️</div>
    <h2>Gleich ist Training!</h2>
    <p>Schau aus dem Fenster: Wie ist das Wetter? Tipp an, was Leon anziehen soll. Nochmal tippen zieht es wieder aus.</p>
    <button class="los" id="los">Zum Kleiderschrank</button>
    <div class="rueckblick verborgen" id="rueckblick"></div>
  </section>

  <section class="verborgen" id="sicht-spiel">
    <div class="buehne">
      <div class="oben">
        <div class="wetter" id="wetter"></div>
        <div class="figurbox"><svg class="figur" id="figur" viewBox="0 -44 200 344" aria-label="Leon"></svg></div>
      </div>
      <div class="karte schrank">
        <h3>Kleiderschrank</h3>
        <div class="teile" id="teile"></div>
        <div class="reihe">
          <button class="knopf grau" id="hoeren" aria-label="Vorlesen">🔊</button>
          <button class="knopf" id="pruefen">Los zum Training!</button>
        </div>
        <div id="rueck"></div>
        <div class="fortschritt" id="fortschritt"></div>
      </div>
    </div>
  </section>

  <section class="karte ende verborgen" id="sicht-ende">
    <div class="gross">🧥🏅</div>
    <h2>Immer passend angezogen!</h2>
    <p id="ende-text"></p>
    <button class="los" id="nochmal">Nochmal</button>
    <a class="knopf2" href="/leon/">Zurück zu Leons Lernwelt</a>
  </section>
</div>
<canvas class="konfetti" id="konfetti"></canvas>

<script>

  function rueckblickMalen(){ var d = lesen(); if (d.angezogen){ $("rueckblick").textContent = "🧥 Schon " + d.angezogen + "-mal passend angezogen."; $("rueckblick").classList.remove("verborgen"); } }

  function sprich(t){

    try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.lang = "de-DE"; u.rate = .92;

                            el("line", { x1: 100, y1: 102, x2: 100, y2: 198, stroke: KONTUR, "stroke-width": 2 }, s); }
    // Haende
    if (h("handschuhe")) { el("circle", { cx: 52, cy: 192, r: 13, fill: "#dc2626", stroke: KONTUR, "stroke-width": 2.5 }, s); el("circle", { cx: 148, cy: 192, r: 13, fill: "#dc2626", stroke: KONTUR, "stroke-width": 2.5 }, s); }
    else { el("circle", { cx: 55, cy: 186, r: 10, fill: HAUT, stroke: KONTUR, "stroke-width": 2.5 }, s); el("circle", { cx: 145, cy: 186, r: 10, fill: HAUT, stroke: KONTUR, "stroke-width": 2.5 }, s); }
    // Fuesse
    var schuh = h("sandalen") ? ["#a16207", 8] : h("turnschuhe") ? ["#ffffff", 14] : h("gummistiefel") ? ["#eab308", 34] : h("winterstiefel") ? ["#78350f", 30] : null;
    [[70, 262], [104, 262]].forEach(function(p){
      if (!schuh){ el("ellipse", { cx: p[0] + 13, cy: p[1] + 12, rx: 15, ry: 8, fill: HAUT, stroke: KONTUR, "stroke-width": 2.5 }, s); return; }
      el("rect", { x: p[0] - 4, y: p[1] + 14 - schuh[1], width: 34, height: schuh[1] + 6, rx: 6, fill: schuh[0], stroke: KONTUR, "stroke-width": 2.5 }, s);
    });
    // Hals, Kopf
    el("rect", { x: 91, y: 84, width: 18, height: 20, fill: HAUT, stroke: KONTUR, "stroke-width": 2.5 }, s);
    if (h("schal")) { el("rect", { x: 80, y: 88, width: 42, height: 16, rx: 7, fill: "#f59e0b", stroke: KONTUR, "stroke-width": 2.5 }, s); el("rect", { x: 106, y: 96, width: 12, height: 40, rx: 5, fill: "#f59e0b", stroke: KONTUR, "stroke-width": 2.5 }, s); }
    el("circle", { cx: 100, cy: 58, r: 30, fill: HAUT, stroke: KONTUR, "stroke-width": 3 }, s);
    el("path", { d: "M72 50 Q100 18 128 50 Q112 38 100 40 Q86 38 72 50 Z", fill: "#7c4a1e", stroke: KONTUR, "stroke-width": 2 }, s);
    if (h("sonnenbrille")) { el("rect", { x: 80, y: 52, width: 18, height: 12, rx: 4, fill: "#111827" }, s); el("rect", { x: 102, y: 52, width: 18, height: 12, rx: 4, fill: "#111827" }, s); el("line", { x1: 98, y1: 57, x2: 102, y2: 57, stroke: "#111827", "stroke-width": 3 }, s); }
    else { el("circle", { cx: 89, cy: 58, r: 3.5, fill: KONTUR }, s); el("circle", { cx: 111, cy: 58, r: 3.5, fill: KONTUR }, s); }
    el("path", { d: "M90 72 Q100 80 110 72", fill: "none", stroke: KONTUR, "stroke-width": 3, "stroke-linecap": "round" }, s);
    if (h("kappe"))  { el("path", { d: "M70 44 Q100 10 130 44 Z", fill: "#16a34a", stroke: KONTUR, "stroke-width": 2.5 }, s); el("rect", { x: 118, y: 38, width: 30, height: 8, rx: 4, fill: "#15803d", stroke: KONTUR, "stroke-width": 2 }, s); }
    if (h("muetze")) { el("path", { d: "M68 50 Q100 0 132 50 Z", fill: "#dc2626", stroke: KONTUR, "stroke-width": 2.5 }, s); el("rect", { x: 66, y: 44, width: 68, height: 12, rx: 6, fill: "#fff", stroke: KONTUR, "stroke-width": 2 }, s); el("circle", { cx: 100, cy: 14, r: 9, fill: "#fff", stroke: KONTUR, "stroke-width": 2 }, s); }
    if (h("sonnencreme")) { el("rect", { x: 160, y: 236, width: 18, height: 36, rx: 5, fill: "#fb923c", stroke: KONTUR, "stroke-width": 2 }, s); el("rect", { x: 164, y: 228, width: 10, height: 10, fill: "#fff", stroke: KONTUR, "stroke-width": 2 }, s); }
  }

  /* ---------- Ablauf ---------- */
  var liste = [], pos = 0, an = [], versuch = 0, ergebnis = [], sauber = 0;

  function zeige(n){ ["start", "spiel", "ende"].forEach(function(x){ $("sicht-" + x).classList.toggle("verborgen", x !== n); }); window.scrollTo(0, 0); }
  function mische(f){ for (var i = f.length - 1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t=f[i]; f[i]=f[j]; f[j]=t; } return f; }

  function starten(){
    liste = mische(WETTER.slice()); pos = 0; sauber = 0; ergebnis = liste.map(function(){ return ""; });
    zeige("spiel"); lage();
  }

  function fortschrittMalen(){
    $("fortschritt").innerHTML = ergebnis.map(function(e, i){ return '<i class="' + e + (i === pos ? " n" : "") + '"></i>'; }).join("") +
      '<span style="margin-left:6px">' + (pos + 1) + ' von ' + liste.length + '</span>';
  }

  function lage(){
    var w = liste[pos];
    an = []; versuch = 0;
    var box = $("wetter");
    box.style.background = w.farbe;
    box.innerHTML = '<span class="symbol">' + w.symbol + '</span><span class="grad">' + (w.grad < 0 ? "−" + Math.abs(w.grad) : w.grad) + ' °C</span><span class="text">' + w.text + '</span>';
    var t = $("teile"); t.innerHTML = "";
    Object.keys(TEILE).forEach(function(id){
      var b = document.createElement("button");
      b.className = "teil"; b.setAttribute("data-id", id);
      var name = (id === "sandalen" && w.name === "Freibad im Sommer") ? "Badelatschen" : TEILE[id].name;
      b.innerHTML = '<span class="e">' + TEILE[id].e + '</span>' + name;
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", function(){ umziehen(id); });
      t.appendChild(b);
    });
    $("rueck").innerHTML = "";
    $("pruefen").disabled = false;
    figurMalen(an); fortschrittMalen();
    sprich(w.name + ". " + w.text.replace("−", "minus ") + ". Was zieht Leon an?");
  }

  function umziehen(id){
    var i = an.indexOf(id);
    if (i >= 0) an.splice(i, 1);
    else {
      // Auf demselben Platz kann nur eines sitzen - das alte kommt aus
      an = an.filter(function(x){ return TEILE[x].platz !== TEILE[id].platz; });
      an.push(id);
    }
    Array.prototype.forEach.call($("teile").children, function(b){
      var drin = an.indexOf(b.getAttribute("data-id")) >= 0;
      b.classList.toggle("an", drin); b.setAttribute("aria-pressed", drin ? "true" : "false");
    });
    figurMalen(an);
    if ($("rueck").innerHTML) $("rueck").innerHTML = "";
  }

  function pruefen(){
    var w = liste[pos];
    var zuViel = an.filter(function(id){ return w.falsch[id]; });
    var fehlt = w.brauchtEins.filter(function(gruppe){ return !gruppe.some(function(id){ return an.indexOf(id) >= 0; }); });
    var stimmt = !zuViel.length && !fehlt.length;
    if (stimmt){
      var erster = versuch === 0;
      try { window.lernstand && window.lernstand.antwort(erster, "kleidung und wetter", "", w.name); } catch(e){}
      if (erster) { sauber++; ergebnis[pos] = "g"; } else ergebnis[pos] = "t";
      $("pruefen").disabled = true;
      $("rueck").innerHTML = '<div class="rueck gut"><b>Perfekt angezogen!</b> So kann Leon bei ' + w.text.replace(/ –.*/, "") + ' trainieren.<br>' +
        'Das Wetter passt zur Jahreszeit <b>' + w.jahreszeit + '</b>.</div>' +
        '<div class="reihe"><button class="knopf" id="weiter">' + (pos < liste.length - 1 ? "Nächstes Wetter ›" : "Fertig ›") + '</button></div>';
      $("weiter").addEventListener("click", weiter);
      sprich("Perfekt angezogen!");
      fortschrittMalen(); konfetti(false);
      return;
    }
    if (versuch === 0){ try { window.lernstand && window.lernstand.antwort(false, "kleidung und wetter", zuViel.concat(fehlt.map(function(g){ return "ohne " + g[0]; })).join(","), w.name); } catch(e){} }
    versuch++;
    var punkte = zuViel.map(function(id){ return "<li>" + w.falsch[id] + "</li>"; })
      .concat(fehlt.map(function(g){ return "<li>" + (w.gruende[g[0]] || ("Es fehlt noch: " + TEILE[g[0]].name + ".")) + "</li>"; }));
    $("rueck").innerHTML = '<div class="rueck schlecht"><b>Fast! Schau nochmal:</b><ul>' + punkte.join("") + '</ul></div>';
    sprich("Fast! " + $("rueck").innerText.replace("Fast! Schau nochmal:", ""));
    try { $("rueck").scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch(e){}
  }

  function weiter(){
    pos++;
    if (pos < liste.length){ lage(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    var d = lesen(); d.angezogen = (d.angezogen || 0) + liste.length; d.runden = (d.runden || 0) + 1; schreiben(d);
    $("ende-text").textContent = sauber === liste.length ? "Bei jedem Wetter gleich beim ersten Mal richtig – du weißt genau, was man bei Hitze, Regen und Schnee braucht."
      : "Beim ersten Mal passte es " + sauber + "-mal, und am Ende war Leon immer richtig angezogen. Genau so lernt man es.";
    zeige("ende"); rueckblickMalen(); konfetti(true);
  }

  $("pruefen").addEventListener("click", pruefen);
  $("hoeren").addEventListener("click", function(){ var w = liste[pos]; if (w) sprich(w.name + ". " + w.text.replace("−", "minus ") + ". Was zieht Leon an?"); });
  $("los").addEventListener("click", starten);
  $("nochmal").addEventListener("click", starten);

  var fl = $("konfetti"), st = fl.getContext("2d"), stuecke = [], laeuft = false;
  function konfetti(g){
    fl.width = innerWidth; fl.height = innerHeight;
    for (var i = 0; i < (g ? 120 : 30); i++) stuecke.push({ x: Math.random()*fl.width, y: -20 - Math.random()*100, b: 6+Math.random()*6, h: 8+Math.random()*8,
      v: 2.4+Math.random()*3, d: Math.random()*6, t: (Math.random()-.5)*.3, f: ["#10b981","#16a34a","#ffffff","#f79009","#3b82f6"][i%5] });
    if (!laeuft){ laeuft = true; requestAnimationFrame(male); }
  }
  function male(){
    st.clearRect(0, 0, fl.width, fl.height);
    stuecke = stuecke.filter(function(s){ return s.y < fl.height + 30; });
    stuecke.forEach(function(s){ s.y += s.v; s.d += s.t; st.save(); st.translate(s.x, s.y); st.rotate(s.d); st.fillStyle = s.f; st.fillRect(-s.b/2, -s.h/2, s.b, s.h); st.restore(); });
    if (stuecke.length) requestAnimationFrame(male); else { laeuft = false; st.clearRect(0, 0, fl.width, fl.height); }
  }

  window.__garderobe = { TEILE: TEILE, WETTER: WETTER, starten: starten, zieheAn: function(ids){ ids.forEach(umziehen); }, pruefe: pruefen,
    zustand: function(){ return { pos: pos, lage: liste[pos] && liste[pos].name, an: an.slice() }; }, weiter: function(){ var w = $("weiter"); if (w) w.click(); } };
})();
</script>
<script src="/lernstand.js" defer></script>
</body>
