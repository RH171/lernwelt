<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Der-die-das-Kabine</title>
<!--
  Leons zweites Deutsch-Spiel zum Anfassen (14.09.2026).

  Vor dem Spiel muessen alle in die richtige Kabine: Die Namenwoerter kommen
  als Spieler auf den Gang, und Leon schickt jeden in "der", "die" oder "das".
  Am Ende stehen die drei Kabinen voll - eine Rueckschau, welche Woerter
  zusammengehoeren.

  Die Artikel lernt ein Kind in der 2. Klasse vor allem durch Hoeren und
  Sprechen ("der Tor? das Tor?"). Deshalb gibt es beim ersten Fehlgriff keine
  Loesung, sondern die Einladung, es laut auszuprobieren - und die
  Vorlesestimme spricht alle drei Varianten vor.
-->
<link rel="stylesheet" href="/beruehrung.css?v=8a84e32c">
<script src="/spiel-dunkel.js?v=43f8226f" data-flaeche=".huelle" data-schluessel="leon-theme" data-standard="light"></script>
<style>
  :root{
    --bg:#eef6f0; --card:#fff; --ink:#15171f; --muted:#667085; --line:#e3e7ee;
    --leon:#10b981; --leon-dunkel:#067647; --gut:#12b76a;
    --der:#2563eb; --die:#e11d48; --das:#16a34a;
    --rund:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);min-height:100vh;
       padding:12px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .huelle{max-width:900px;margin:0 auto}
  .verborgen{display:none!important}
  header{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
  .zurueck{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);background:#fff;
    border:1px solid var(--line);border-radius:999px;padding:12px 16px;font-weight:600;font-size:15px;min-height:44px}
  h1{font-family:var(--rund);font-size:22px;margin:0;flex:1}
  .zaehler{font:700 16px/1 var(--rund);background:#fff;border:1px solid var(--line);border-radius:999px;padding:12px 14px}
  .karte{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;
    box-shadow:0 1px 2px rgba(20,22,40,.05),0 12px 30px rgba(20,22,40,.08)}
  .start{text-align:center;max-width:720px;margin:0 auto}
  .start h2{font-family:var(--rund);font-size:26px;margin:4px 0 6px}
  .start p{color:var(--muted);margin:0 0 18px;font-size:16px;line-height:1.5}
  .los{display:block;width:100%;border:none;border-radius:16px;background:var(--leon);color:#fff;font:700 20px/1 var(--rund);padding:18px;cursor:pointer;min-height:58px}
  .rueckblick{margin-top:14px;color:var(--leon-dunkel);font-weight:700;font-size:15px}

  /* Der Gang: hier steht der Spieler, der gerade dran ist */
  .gang{position:relative;background:linear-gradient(180deg,#e7ecf3,#d7dee8);border-radius:22px;padding:14px;
    display:flex;align-items:center;justify-content:center;gap:16px;min-height:170px;overflow:hidden}
  .spieler{display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .45s cubic-bezier(.3,.8,.3,1),opacity .45s}
  .spieler .bild{font-size:clamp(64px,11vw,92px);line-height:1}
  .spieler .wort{font:800 clamp(30px,5vw,40px)/1 var(--rund);background:#fff;border-radius:14px;padding:6px 16px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
  .spieler.wackelt{animation:wackeln .4s}
  @keyframes wackeln{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(6px)}}
  .hoeren{position:absolute;right:12px;top:12px;width:54px;height:54px;border-radius:50%;border:none;background:#fff;font-size:24px;cursor:pointer}
  .hinweis{min-height:26px;text-align:center;color:#93370d;font-weight:700;font-size:16px;margin:8px 0 2px}

  /* Die drei Kabinen */
  .kabinen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
  .kabine{border:none;border-radius:20px;color:#fff;cursor:pointer;padding:10px 6px 12px;min-height:150px;
    display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.18);position:relative}
  .kabine:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
  .kabine .tuer{font:800 clamp(30px,5.4vw,42px)/1 var(--rund);background:rgba(255,255,255,.18);border-radius:12px;padding:10px 0;width:88%}
  .kabine .drin{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:22px;line-height:1.1;min-height:26px;max-width:100%}
  .kabine.der{background:var(--der)} .kabine.die{background:var(--die)} .kabine.das{background:var(--das)}
  .kabine.jubel{animation:jubel .5s}
  @keyframes jubel{40%{transform:scale(1.06)}}
  .kabine[disabled]{cursor:default}

  .unten{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  .punkte{display:flex;gap:5px;flex-wrap:wrap}
  .punkte i{width:12px;height:12px;border-radius:50%;background:#d0d5dd;display:block}
  .punkte i.g{background:var(--gut)} .punkte i.t{background:#fdb022} .punkte i.n{outline:3px solid var(--leon);outline-offset:1px}
  .nachspiel{background:#fff7e6;color:#93370d;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}

  .ende{text-align:center;max-width:780px;margin:0 auto}
  .ende .gross{font-size:56px}
  .ende h2{font-family:var(--rund);font-size:28px;margin:6px 0}
  .ende p{color:var(--muted);font-size:17px;line-height:1.5;margin:6px 0 14px}
  .rueckschau{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px;text-align:left}
  .rueckschau div{border-radius:14px;padding:10px;color:#fff;font-size:15px;line-height:1.6}
  .rueckschau b{font-family:var(--rund);font-size:20px;display:block}
  .knopf2{display:block;width:100%;margin-top:10px;border:none;border-radius:16px;background:#f2f4f7;color:var(--ink);
    font:700 18px/1 var(--rund);padding:16px;cursor:pointer;min-height:54px;text-decoration:none;text-align:center}
  @media (max-width:520px){ .rueckschau{grid-template-columns:1fr} .kabine{min-height:120px} }
  @media (max-height:700px) and (orientation:landscape){ .gang{min-height:140px} .kabine{min-height:120px} }
  canvas.konfetti{position:fixed;inset:0;pointer-events:none;z-index:50}
</style>
</head>
<body>
<div class="huelle">
  <header>
    <a class="zurueck" href="/leon/#anfassen">‹ Leons Spiele</a>
    <h1>Der-die-das-Kabine</h1>
    <div class="zaehler verborgen" id="zaehler"></div>
  </header>

  <section class="karte start" id="sicht-start">
    <div style="font-size:56px">🚪🚪🚪</div>
    <h2>Ab in die Kabine!</h2>
    <p>Gleich ist Anpfiff. Jedes Namenwort muss in seine Kabine: <b style="color:var(--der)">der</b>, <b style="color:var(--die)">die</b> oder <b style="color:var(--das)">das</b>. Sag es leise mit – dann hörst du, was passt.</p>
    <button class="los" id="los">Tür auf!</button>
    <div class="rueckblick verborgen" id="rueckblick"></div>
  </section>

  <section class="verborgen" id="sicht-spiel">
    <div class="gang" id="gang">
      <div class="spieler" id="spieler"><span class="bild" id="bild"></span><span class="wort" id="wort"></span></div>
      <button class="hoeren" id="hoeren" aria-label="Anhören">🔊</button>
    </div>
    <div class="hinweis" id="hinweis"></div>
    <div class="kabinen">
      <button class="kabine der" data-a="der"><span class="tuer">der</span><span class="drin" id="drin-der"></span></button>
      <button class="kabine die" data-a="die"><span class="tuer">die</span><span class="drin" id="drin-die"></span></button>
      <button class="kabine das" data-a="das"><span class="tuer">das</span><span class="drin" id="drin-das"></span></button>
    </div>
    <div class="unten">
      <div class="punkte" id="punkte"></div>
      <span class="nachspiel verborgen" id="nachspiel"></span>
    </div>
  </section>

  <section class="karte ende verborgen" id="sicht-ende">
    <div class="gross">🏆</div>
    <h2 id="ende-titel"></h2>
    <p id="ende-text"></p>
    <div class="rueckschau" id="rueckschau"></div>
    <button class="los" id="nochmal">Neue Mannschaft</button>
    <a class="knopf2" href="/leon/#anfassen">Zurück zu Leons Spielen</a>
  </section>
</div>
<canvas class="konfetti" id="konfetti"></canvas>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };

  // Nur Woerter mit eindeutigem Artikel, die ein Zweitklaesser kennt, und
  // Emojis, die auch aeltere iPads zeigen.
  var WOERTER = [
    ["⚽","Ball","der"], ["🥅","Tor","das"], ["🏆","Pokal","der"], ["👕","Trikot","das"], ["👟","Schuh","der"],
    ["☀️","Sonne","die"], ["🌙","Mond","der"], ["🚗","Auto","das"], ["🚌","Bus","der"], ["🌷","Blume","die"],
    ["🌳","Baum","der"], ["🏠","Haus","das"], ["🐱","Katze","die"], ["🐶","Hund","der"], ["🐴","Pferd","das"],
    ["🐭","Maus","die"], ["🍎","Apfel","der"], ["🍌","Banane","die"], ["🍞","Brot","das"], ["🧀","Käse","der"],
    ["🍅","Tomate","die"], ["🍦","Eis","das"], ["⭐","Stern","der"], ["❤️","Herz","das"], ["✏️","Stift","der"],
    ["📖","Buch","das"], ["✂️","Schere","die"], ["🐟","Fisch","der"], ["🦆","Ente","die"], ["🐷","Schwein","das"],
    ["🐰","Hase","der"], ["🐮","Kuh","die"], ["🐑","Schaf","das"], ["🦁","Löwe","der"], ["👓","Brille","die"],
    ["🚲","Fahrrad","das"], ["🚆","Zug","der"], ["🚀","Rakete","die"], ["⛵","Boot","das"], ["☕","Tasse","die"],
    ["🍰","Kuchen","der"], ["🍕","Pizza","die"], ["☂️","Schirm","der"], ["☁️","Wolke","die"], ["🛏️","Bett","das"],
    ["🚪","Tür","die"], ["🔑","Schlüssel","der"], ["🔔","Glocke","die"], ["🎁","Geschenk","das"], ["🐸","Frosch","der"],
    ["🥕","Karotte","die"], ["🥚","Ei","das"], ["🦒","Giraffe","die"], ["🍓","Erdbeere","die"], ["🌈","Regenbogen","der"]
  ];
  var RUNDE = 12;

  var SPEICHER = "leon-artikel";
  function lesen(){ try { return JSON.parse(localStorage.getItem(SPEICHER) || "{}") || {}; } catch(e){ return {}; } }
  function schreiben(d){ try { localStorage.setItem(SPEICHER, JSON.stringify(d)); } catch(e){} }
  function rueckblickMalen(){
    var d = lesen();
    if (d.woerter){ $("rueckblick").textContent = "🚪 Schon " + d.woerter + " Spieler in die richtige Kabine geschickt."; $("rueckblick").classList.remove("verborgen"); }
  }
  rueckblickMalen();

  var kannSprechen = typeof window.speechSynthesis !== "undefined" && typeof window.SpeechSynthesisUtterance !== "undefined";
  function sprich(t, tempo){
    if (!kannSprechen || document.hidden) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t); u.lang = "de-DE"; u.rate = tempo || .88;
      var st = (speechSynthesis.getVoices() || []).filter(function(v){ return /^de/i.test(v.lang); })[0];
      if (st) u.voice = st;
      speechSynthesis.speak(u);
    } catch(e){}
  }
  if (!kannSprechen) $("hoeren").classList.add("verborgen");
  document.addEventListener("visibilitychange", function(){ if (document.hidden && kannSprechen) try { speechSynthesis.cancel(); } catch(e){} });

  function mische(f){ for (var i = f.length - 1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t=f[i]; f[i]=f[j]; f[j]=t; } return f; }

  var liste = [], pos = 0, fehler = 0, sauber = 0, aufgeholt = 0, verpasst = [], nachspielzeit = false, ergebnis = [], gesperrt = false, runde = [];

  function zeige(n){
    ["start", "spiel", "ende"].forEach(function(x){ $("sicht-" + x).classList.toggle("verborgen", x !== n); });
    $("zaehler").classList.toggle("verborgen", n !== "spiel");
    window.scrollTo(0, 0);
  }

  function starten(){
    // Alle drei Artikel sollen vorkommen, nicht zufaellig nur "der"
    var nach = { der: [], die: [], das: [] };
    mische(WOERTER.slice()).forEach(function(w){ nach[w[2]].push(w); });
    liste = mische(nach.der.slice(0, 4).concat(nach.die.slice(0, 4), nach.das.slice(0, 4)));
    runde = liste.slice();
    pos = 0; sauber = 0; aufgeholt = 0; verpasst = []; nachspielzeit = false;
    ergebnis = liste.map(function(){ return ""; });
    ["der", "die", "das"].forEach(function(a){ $("drin-" + a).textContent = ""; });
    $("nachspiel").classList.add("verborgen");
    zeige("spiel");
    naechster();
  }

  function punkteMalen(){
    $("punkte").innerHTML = (nachspielzeit ? [] : ergebnis).map(function(e, i){ return '<i class="' + e + (i === pos ? " n" : "") + '"></i>'; }).join("");
    $("zaehler").textContent = "🚪 " + (sauber + aufgeholt);
  }

  function naechster(){
    var w = liste[pos];
    fehler = 0; gesperrt = false;
    var sp = $("spieler");
    sp.style.transition = "none"; sp.style.transform = "translateX(120%)"; sp.style.opacity = "0";
    void sp.offsetWidth;
    sp.style.transition = ""; sp.style.transform = ""; sp.style.opacity = "1";
    $("bild").textContent = w[0];
    $("wort").textContent = w[1];
    $("hinweis").textContent = "";
    punkteMalen();
    setTimeout(function(){ sprich(w[1]); }, 300);
  }

  function tippen(k){
    if (gesperrt) return;
    var w = liste[pos], a = k.getAttribute("data-a");
    if (a === w[2]){
      gesperrt = true;
      var stimmt = fehler === 0;
      try { window.lernstand && window.lernstand.antwort(stimmt, "artikel", stimmt ? "" : "daneben", w[2] + " " + w[1]); } catch(e){}
      if (nachspielzeit){ if (stimmt) aufgeholt++; }
      else { ergebnis[pos] = stimmt ? "g" : "t"; if (stimmt) sauber++; else verpasst.push(w); }
      // Der Spieler laeuft in seine Kabine
      var sp = $("spieler"), kr = k.getBoundingClientRect(), sr = sp.getBoundingClientRect();
      sp.style.transform = "translate(" + (kr.left + kr.width / 2 - sr.left - sr.width / 2) + "px," + (kr.top + 30 - sr.top - sr.height / 2) + "px) scale(.3)";
      sp.style.opacity = "0";
      k.classList.remove("jubel"); void k.offsetWidth; k.classList.add("jubel");
      $("hinweis").textContent = stimmt ? "" : "Jetzt stimmt's: " + w[2] + " " + w[1] + "!";
      if (!nachspielzeit || stimmt){
        var drin = $("drin-" + w[2]);
        if (drin.textContent.indexOf(w[0]) < 0 || nachspielzeit) drin.textContent += w[0];
      }
      sprich(w[2] + " " + w[1]);
      punkteMalen();
      if (stimmt) konfetti(false);
      setTimeout(weiter, stimmt ? 950 : 1600);
    } else {
      fehler++;
      var sp2 = $("spieler"); sp2.classList.remove("wackelt"); void sp2.offsetWidth; sp2.classList.add("wackelt");
      if (fehler === 1){
        $("hinweis").textContent = "Sag es laut: der " + w[1] + "? die " + w[1] + "? das " + w[1] + "?";
        sprich("der " + w[1] + "? die " + w[1] + "? das " + w[1] + "?", .8);
      } else {
        $("hinweis").textContent = "Es heißt: " + w[2] + " " + w[1] + ". Tipp auf „" + w[2] + "“.";
        sprich("Es heißt " + w[2] + " " + w[1]);
        var ziel = document.querySelector('.kabine[data-a="' + w[2] + '"]');
        ziel.classList.remove("jubel"); void ziel.offsetWidth; ziel.classList.add("jubel");
      }
    }
  }

  function weiter(){
    pos++;
    if (pos < liste.length){ naechster(); return; }
    if (!nachspielzeit && verpasst.length){
      nachspielzeit = true; liste = mische(verpasst.slice()); pos = 0;
      $("nachspiel").textContent = "⏱️ Nachspielzeit · " + (liste.length === 1 ? "ein Wort" : liste.length + " Wörter") + " nochmal";
      $("nachspiel").classList.remove("verborgen");
      naechster(); return;
    }
    ende();
  }

  function ende(){
    var d = lesen(); d.woerter = (d.woerter || 0) + RUNDE; d.runden = (d.runden || 0) + 1; schreiben(d);
    $("ende-titel").textContent = "Alle " + RUNDE + " sind in der Kabine!";
    $("ende-text").textContent = sauber === RUNDE ? "Jeder Spieler sofort in der richtigen Tür – stark gehört!"
      : "Beim ersten Mal richtig: " + sauber + ". " + (aufgeholt ? "In der Nachspielzeit noch " + aufgeholt + " dazu. " : "") + "So sieht die Mannschaft aus:";
    var farben = { der: "var(--der)", die: "var(--die)", das: "var(--das)" };
    $("rueckschau").innerHTML = ["der", "die", "das"].map(function(a){
      return '<div style="background:' + farben[a] + '"><b>' + a + '</b>' +
        runde.filter(function(w){ return w[2] === a; }).map(function(w){ return w[0] + " " + w[1]; }).join("<br>") + '</div>';
    }).join("");
    zeige("ende"); rueckblickMalen(); konfetti(true);
  }

  Array.prototype.forEach.call(document.querySelectorAll(".kabine"), function(k){ k.addEventListener("click", function(){ tippen(k); }); });
  $("hoeren").addEventListener("click", function(){ var w = liste[pos]; if (w) sprich(w[1]); });
  $("los").addEventListener("click", starten);
  $("nochmal").addEventListener("click", starten);

  var fl = $("konfetti"), st = fl.getContext("2d"), stuecke = [], laeuft = false;
  function konfetti(g){
    fl.width = innerWidth; fl.height = innerHeight;
    for (var i = 0; i < (g ? 120 : 26); i++) stuecke.push({ x: Math.random()*fl.width, y: -20 - Math.random()*100, b: 6+Math.random()*6, h: 8+Math.random()*8,
      v: 2.4+Math.random()*3, d: Math.random()*6, t: (Math.random()-.5)*.3, f: ["#2563eb","#e11d48","#16a34a","#ffffff","#f79009"][i%5] });
    if (!laeuft){ laeuft = true; requestAnimationFrame(male); }
  }
  function male(){
    st.clearRect(0, 0, fl.width, fl.height);
    stuecke = stuecke.filter(function(s){ return s.y < fl.height + 30; });
    stuecke.forEach(function(s){ s.y += s.v; s.d += s.t; st.save(); st.translate(s.x, s.y); st.rotate(s.d); st.fillStyle = s.f; st.fillRect(-s.b/2, -s.h/2, s.b, s.h); st.restore(); });
    if (stuecke.length) requestAnimationFrame(male); else { laeuft = false; st.clearRect(0, 0, fl.width, fl.height); }
  }

  window.__kabine = { WOERTER: WOERTER, starten: starten, zustand: function(){ return { pos: pos, liste: liste, nachspielzeit: nachspielzeit }; },
    tippe: function(a){ var k = document.querySelector('.kabine[data-a="' + a + '"]'); if (k) tippen(k); } };
})();
</script>
<script src="/spiel-navi.js?v=815914e4" defer></script>
<script src="/lernstand.js?v=282ba79a" defer></script>
</body>
</html>
