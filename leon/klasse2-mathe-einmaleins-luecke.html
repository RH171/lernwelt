<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wo fehlt die Zahl?</title>
<!--
  Pauls Wunsch vom 01.10.2026 (über Denny): "die Tabelle ausgefüllt, und immer fehlt eine Zahl -
  lerne daraus, wo Paul Schwierigkeiten hat". Motor /einmaleins/tabelle.js, modus "einzeln";
  derselbe Speicher wie die Einmaleins-Tabelle, beide lernen voneinander.
-->
<script>(function(){try{ if(localStorage.getItem("leon-theme")==="dark") document.documentElement.setAttribute("data-theme","dark"); }catch(e){}})();</script>
<link rel="stylesheet" href="/thema.css?v=e8d09026">
<link rel="stylesheet" href="/beruehrung.css?v=8a84e32c">
<link rel="stylesheet" href="/einmaleins/tabelle.css?v=d05234a9">
<script src="/farbschalter.js?v=383ccf75"></script>
</head>
<body>
<header>
  <a class="knopf" href="./">← Zurück</a>
  <h1>Wo fehlt die Zahl?</h1>
</header>

<section id="start" class="karte">
  <h2>🔎 Wo fehlt die Zahl?</h2>
  <p>Die Tabelle ist voll, nur eine Zahl fehlt. Ich merke mir, was dir schwerfällt und was lange dauert, und frage das öfter.</p>
  <p id="baustellen" class="verborgen"></p>
  <div id="stufen"></div>
  <button id="wackel-start" class="knopf verborgen"></button>
</section>

<section id="spiel" class="verborgen">
  <div id="tafel" aria-label="Einmaleins-Tabelle"></div>
  <div id="seite">
    <div class="oben"><span id="frage"></span><span id="zaehler"></span></div>
    <div id="tipp" class="tipp" aria-live="polite"></div>
    <div id="tasten">
      <button data-taste="1">1</button><button data-taste="2">2</button><button data-taste="3">3</button>
      <button data-taste="4">4</button><button data-taste="5">5</button><button data-taste="6">6</button>
      <button data-taste="7">7</button><button data-taste="8">8</button><button data-taste="9">9</button>
      <button data-taste="weg" aria-label="Löschen">⌫</button><button data-taste="0">0</button>
      <button data-taste="ok" class="ok next">Prüfen</button>
    </div>
    <button class="knopf zurueck">Andere Rundenlänge</button>
  </div>
</section>

<section id="ende" class="karte verborgen">
  <h2>🎉 Geschafft!</h2>
  <p id="ende-zahl"></p>
  <p id="ende-zeit"></p>
  <p id="ende-wack"></p>
  <div class="zeile-knoepfe">
    <button id="nochmal" class="knopf primaer weiter">Noch eine Runde</button>
    <button id="nur-wackler" class="knopf">Nur die Wackler</button>
    <button class="knopf zurueck">Andere Länge</button>
  </div>
</section>

<script>window.EINMALEINS = { kind: "leon", speicher: "leon-einmaleins", modus: "einzeln", lueckenReihen: [1, 2, 5, 10], vorlesen: true,
  stufen: [ { n: 5, name: "5 Aufgaben", sub: "kurz" }, { n: 10, name: "10 Aufgaben", sub: "normal" }, { n: 15, name: "15 Aufgaben", sub: "lang" } ] };</script>
<script src="/einmaleins/tabelle.js?v=557789c5" defer></script>
<script src="/lernstand.js?v=417a4ab9" defer></script>
</body>
</html>
