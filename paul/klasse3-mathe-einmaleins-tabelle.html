<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Einmaleins-Tabelle</title>
<!--
  Pauls Wunsch vom 01.10.2026 (über Denny, mit Foto seines Blatts "Das kleine 1 x 1"):
  die Tabelle mit Lücken zum Selbst-Ausfüllen, und einmal ganz leer, Zeile und Spalte
  von 1 bis 10. Motor und Aussehen liegen geteilt in /einmaleins/ (auch bei Leon).
  Liegt als "klasse3-" im Ordner, weil games.json nur diese Dateien findet; die
  Klasse steht in paul/index.html unter OVERRIDES.
-->
<script>(function(){try{ if(localStorage.getItem("hub-theme")!=="light") document.documentElement.setAttribute("data-theme","dark"); }catch(e){ document.documentElement.setAttribute("data-theme","dark"); }})();</script>
<link rel="stylesheet" href="/thema.css?v=e8d09026">
<link rel="stylesheet" href="/beruehrung.css?v=8a84e32c">
<link rel="stylesheet" href="/einmaleins/tabelle.css?v=4c5e47f9">
</head>
<body>
<header>
  <a class="knopf" href="./">← Zurück</a>
  <h1>Einmaleins-Tabelle</h1>
</header>

<section id="start" class="karte">
  <h2>✖️ Das kleine Einmaleins</h2>
  <p>Wie bei deinem Blatt: Ich lasse Lücken, du füllst sie. Was noch wackelt, kommt beim nächsten Mal öfter dran.</p>
  <div id="stufen"></div>
  <button id="wackel-start" class="knopf verborgen"></button>
</section>

<section id="spiel" class="verborgen">
  <div id="tafel" aria-label="Einmaleins-Tabelle"></div>
  <div id="seite">
    <div class="oben"><span id="frage"></span><span id="zaehler"></span></div>
    <div id="tipp" class="tipp" aria-live="polite"></div>
    <div id="tasten">
      <button data-taste="1">1</button><button data-taste="2">2</button><button data-taste="3">3</button>
      <button data-taste="4">4</button><button data-taste="5">5</button><button data-taste="6">6</button>
      <button data-taste="7">7</button><button data-taste="8">8</button><button data-taste="9">9</button>
      <button data-taste="weg" aria-label="Löschen">⌫</button><button data-taste="0">0</button>
      <button data-taste="ok" class="ok next">Prüfen</button>
    </div>
    <button class="knopf zurueck">Andere Lücken wählen</button>
  </div>
</section>

<section id="ende" class="karte verborgen">
  <h2>🎉 Alle Lücken gefüllt!</h2>
  <p id="ende-zahl"></p>
  <p id="ende-zeit"></p>
  <p id="ende-wack"></p>
  <div class="zeile-knoepfe">
    <button id="nochmal" class="knopf primaer weiter">Neue Lücken</button>
    <button id="nur-wackler" class="knopf">Nur die Wackler</button>
    <button class="knopf zurueck">Andere Stufe</button>
  </div>
</section>

<script>window.EINMALEINS = { kind: "paul", speicher: "paul-einmaleins" };</script>
<script src="/einmaleins/tabelle.js?v=557789c5" defer></script>
<script src="/lernstand.js?v=417a4ab9" defer></script>
</body>
</html>
