<script>
(function(){
  "use strict";
  var MONATE = ["Januar","Februar","März","April","Mai","Juni","Juli",
                "August","September","Oktober","November","Dezember"];
  var TAGE = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
  var NAMEN = {mathe:"Mathe", deutsch:"Deutsch", hsu:"HSU", englisch:"Englisch",
               rel:"Religion/Ethik", musik:"Musik", anderes:"Anderes"};

  function lang(iso){
    var t = String(iso||"").split("-");
    if (t.length !== 3) return String(iso||"");
    var d = new Date(+t[0], +t[1]-1, +t[2]);
    return TAGE[d.getDay()] + ", " + (+t[2]) + ". " + MONATE[+t[1]-1] + " " + t[0];
  }
  function tageBis(iso){
    var t = String(iso||"").split("-");
    if (t.length !== 3) return null;
    var d = new Date(+t[0], +t[1]-1, +t[2]);
    var h = new Date(); h.setHours(0,0,0,0);
    return Math.round((d - h) / 86400000);
  }
  function esc(t){
    return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  /* Probe eintragen oder Note zurueck (15.10.2026): derselbe Dialog wie auf
     der Startseite, mit noten:true. Der Knopf wird EINMAL gebaut und nach
     jedem Malen in #peSlot gehaengt - sonst verloere er seinen Klick. */
  var peKnopf = document.createElement("button");
  peKnopf.id = "probeEintragen";
  try {
    LWProbeneintrag.start({ kind: "paul", knopf: peKnopf, karte: document.getElementById("probenkarte"),
      noten: true, nachNote: function(){ laden(); } });
  } catch(e){}

  function laden(){
  fetch("/api/noten?eigene=1&kind=paul", {credentials:"same-origin"})
    .then(function(r){ return r.json().then(function(j){ return {status:r.status, j:j}; }); })
    .then(function(a){
      if (a.status === 401){
        document.getElementById("inhalt").innerHTML =
          '<div class="karte"><h2>Melde dich bitte an</h2>' +
          '<p class="unter">Geh kurz zurück in deine Lernwelt.</p></div>';
        return;
      }
      if (!a.j || !a.j.ok){
        // Ehrlich bleiben: Nichts anzeigen heisst nicht "keine Noten".
        document.getElementById("inhalt").innerHTML =
          '<div class="karte"><h2>Das klappt gerade nicht</h2><p class="unter">' +
          esc((a.j && a.j.fehler) || "Probier es gleich nochmal.") + '</p></div>';
        return;
      }
      malen(a.j);
      try { LWProbenkarte.zeigen(document.getElementById("probenkarte"), a.j.termine, "paul"); } catch(e){}
    })
    .catch(function(){
      document.getElementById("inhalt").innerHTML =
        '<div class="karte"><h2>Das klappt gerade nicht</h2>' +
        '<p class="unter">Probier es gleich nochmal.</p></div>';
    });
  }
  laden();

  /* ---------- Zeugnisplaner (15.10.2026, Dennys Wahl A) ----------
   * Bayerische Regel fuers Uebertrittszeugnis: Schnitt aus Deutsch, Mathe und
   * HSU. Bis 2,33 Gymnasium, bis 2,66 Realschule, sonst Mittelschule (oder
   * Probeunterricht). Mit drei ganzen Noten heisst das: Summe 7 oder weniger
   * = Gymnasium, Summe 8 = Realschule. 7/3 ist 2,333 - die Grenze 2,33 meint
   * genau diesen Wert, deshalb wird nach der Summe entschieden und die Zahl
   * auf zwei Stellen ABGESCHNITTEN gezeigt (2,2,4 -> 2,66 -> Realschule).
   * Gerundet stuende dort 2,67 und es sahe aus, als reiche es nicht.
   * Nie Druck: jeder Satz sagt, was GEHT. */
  var ZP_FAECHER = [["deutsch","Deutsch"],["mathe","Mathe"],["hsu","HSU"]];
  var ZP_SCHLUESSEL = "paul-zeugnisplaner";   // Spielwahl, kein Geheimnis
  /* Die Wahl lebt im Speicher der Seite; localStorage ist nur die Bequemlichkeit
     fuers naechste Mal. Ist er gesperrt (privates Fenster), rechnet der Planer
     trotzdem - nur vergisst er die Wahl beim Neuladen. */
  var zpEigen = null;
  function zpGemerkt(){
    if (!zpEigen){
      zpEigen = {};
      try { var w = JSON.parse(localStorage.getItem(ZP_SCHLUESSEL) || "null"); if (w && typeof w === "object") zpEigen = w; }
      catch(e){}
    }
    return zpEigen;
  }
  function zpMerken(w){ zpEigen = w; try { localStorage.setItem(ZP_SCHLUESSEL, JSON.stringify(w)); } catch(e){} }
  function zpAusProben(noten){
    var aus = {};
    ZP_FAECHER.forEach(function(f){
      var z = noten.filter(function(n){ return n.fach === f[0] && typeof n.note === "number" && !n.offen; })
                   .map(function(n){ return n.note; });
      if (z.length){
        var m = Math.round(z.reduce(function(a,b){ return a+b; }, 0) / z.length);
        aus[f[0]] = Math.min(6, Math.max(1, m));
      }
    });
    return aus;
  }
  function zpKomma(summe){
    var x = Math.floor(summe / 3 * 100 + 1e-9) / 100;
    return x.toFixed(2).replace(".", ",");
  }
  function zpErgebnis(wahl){
    var fehlt = ZP_FAECHER.filter(function(f){ return !wahl[f[0]]; });
    if (fehlt.length){
      return { art: "", html: "Tipp in jedem Fach eine Note an – dann siehst du hier deinen Schnitt." +
        (fehlt.length < 3 ? " Es fehlt noch: " + fehlt.map(function(f){ return f[1]; }).join(", ") + "." : "") };
    }
    var summe = wahl.deutsch + wahl.mathe + wahl.hsu, satz, art;
    if (summe <= 6){ art = "gym"; satz = "🏛️ <b>Gymnasium</b> geht. Du hast sogar noch Luft."; }
    else if (summe === 7){ art = "gym"; satz = "🏛️ <b>Gymnasium</b> geht. Ganz knapp, aber es reicht."; }
    else if (summe === 8){ art = "real"; satz = "🏫 <b>Realschule</b> geht. Fürs Gymnasium fehlt 0,33 – das ist eine Note in einem Fach."; }
    else { art = "mittel"; satz = "🛠️ <b>Mittelschule</b> geht. Für Realschule und Gymnasium gibt es den Probeunterricht."; }
    return { art: art, schnitt: zpKomma(summe),
             html: 'Schnitt <span class="zp-zahl">' + zpKomma(summe) + "</span><br>" + satz };
  }
  /* ---------- Tage bis zum Uebertrittszeugnis (20.10.2026, Kapitel 126) ----------
   * Dennys Beschluss: NUR hier im Zeugnisplaner, ruhig, ganze Tage, kein Ticker.
   * Ausnahme von der Bauregel "kein Countdown" - deshalb ohne Druck: keine
   * Signalfarbe, kein Blinken, ab 30 Tagen ein ermutigender Satz.
   * Das Datum kommt aus der Einstellung UEBERTRITT_DATUM_PAUL (/api/zeugnis-termin).
   * Fehlt sie, bleibt die Zeile weg.
   * "Heute" ist der Kalendertag in Europe/Berlin (Tageswechsel um Mitternacht
   * deutscher Zeit, Kapitel 096). Gerechnet wird mit Kalendertagen ueber
   * Date.UTC - so verschluckt die Zeitumstellung keinen Tag.
   * Testhaken: window.__LW_HEUTE (Zeitpunkt, z. B. "2027-03-28T00:30:00+01:00")
   * setzt nur die Messung; live ist er nie gesetzt. */
  var zpTermin = null;
  function zpBerlinTag(jetzt){
    var t = {};
    new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Berlin", year: "numeric", month: "2-digit", day: "2-digit" })
      .formatToParts(jetzt).forEach(function(x){ t[x.type] = x.value; });
    return t.year + "-" + t.month + "-" + t.day;
  }
  function zpTageBis(terminIso, heuteIso){
    var a = String(heuteIso || "").split("-"), b = String(terminIso || "").split("-");
    if (a.length !== 3 || b.length !== 3) return null;
    var n = Math.round((Date.UTC(+b[0], +b[1]-1, +b[2]) - Date.UTC(+a[0], +a[1]-1, +a[2])) / 86400000);
    return isNaN(n) ? null : n;
  }
  /* Reine Funktion: Termin + Zeitpunkt -> {tage, text, mut} oder null (nichts zeigen). */
  function zpTageText(terminIso, jetzt){
    if (!terminIso) return null;
    var n = zpTageBis(terminIso, zpBerlinTag(jetzt));
    if (n === null || n < 0) return null;
    if (n === 0) return { tage: 0, text: "Heute gibt’s dein Übertrittszeugnis – viel Glück!", mut: "" };
    return { tage: n, text: "Noch " + n + (n === 1 ? " Tag" : " Tage") + " bis zum Übertrittszeugnis",
             mut: n <= 30 ? "Du hast schon viel geübt – weiter so!" : "" };
  }
  window.LWZeugnisTage = { text: zpTageText, berlinTag: zpBerlinTag };
  function zpJetzt(){
    return (typeof window.__LW_HEUTE !== "undefined" && window.__LW_HEUTE !== null) ? new Date(window.__LW_HEUTE) : new Date();
  }
  function zpTageHtml(){
    var t = zpTageText(zpTermin, zpJetzt());
    if (!t) return "";
    var zahl = t.tage > 0 ? t.text.replace(/^Noch (\d+ Tage?)/, "Noch <b>$1</b>") : "<b>" + esc(t.text) + "</b>";
    return '<p class="zp-tage" id="zpTage">📅 ' + zahl +
           (t.mut ? '<span class="zp-mut">' + esc(t.mut) + "</span>" : "") + "</p>";
  }
  function zpFussText(){
    return "Gerechnet aus Deutsch, Mathe und HSU im Übertrittszeugnis" +
           (zpTermin ? " (" + lang(zpTermin) + ")" : "") + ". Die Zeugnisnote gibt deine Lehrerin.";
  }
  fetch("/api/zeugnis-termin?kind=paul", { credentials: "same-origin" })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (!j || !j.ok || !/^\d{4}-\d{2}-\d{2}$/.test(String(j.datum || ""))) return;
      zpTermin = j.datum;
      var karte = document.getElementById("zeugnisplaner");
      if (!karte) return;            // malen() kommt noch und nimmt zpTermin mit
      var alt = document.getElementById("zpTage"), neu = zpTageHtml();
      if (alt) alt.parentNode.removeChild(alt);
      var fuss = karte.querySelector(".zp-fuss");
      if (fuss){
        fuss.textContent = zpFussText();
        if (neu) fuss.insertAdjacentHTML("beforebegin", neu);
      }
    })
    .catch(function(){});

  function zpHtml(noten){
    var aus = zpAusProben(noten), eigen = zpGemerkt(), h = "";
    h += '<div class="karte zp-karte" id="zeugnisplaner"><h2>🔮 Zeugnisplaner</h2>' +
         '<p class="unter">Tipp an, welche Note du im Übertrittszeugnis haben könntest.</p>';
    var wahl = {};
    ZP_FAECHER.forEach(function(f){
      var k = f[0], w = eigen[k] || aus[k] || 0, vonProben = !eigen[k] && !!aus[k];
      wahl[k] = w;
      h += '<div class="zp-zeile" data-zp="' + k + '"><span class="zp-fach">' + f[1] + '</span><div class="zp-stufen" role="group" aria-label="' + f[1] + '">';
      for (var n = 1; n <= 6; n++){
        h += '<button type="button" data-note="' + n + '" aria-pressed="' + (w === n) + '"' + (w === n ? ' class="an"' : "") + ">" + n + "</button>";
      }
      h += "</div>";
      if (vonProben) h += '<div class="zp-aus" data-zp-aus="' + k + '">aus deinen Proben</div>';
      else if (aus[k] && eigen[k] && eigen[k] !== aus[k])
        h += '<div class="zp-aus">aus deinen Proben wäre es eine ' + aus[k] + ' <button type="button" data-zp-zurueck="' + k + '">nehmen</button></div>';
      h += "</div>";
    });
    var e = zpErgebnis(wahl);
    h += '<div class="zp-erg' + (e.art ? " " + e.art : "") + '" id="zpErgebnis" aria-live="polite">' + e.html + "</div>";
    h += zpTageHtml();
    h += '<p class="zp-fuss">' + esc(zpFussText()) + '</p>';
    h += "</div>";
    return h;
  }
  function zpBinden(noten){
    var karte = document.getElementById("zeugnisplaner");
    if (!karte) return;
    function neu(){
      var alt = karte; var tmp = document.createElement("div"); tmp.innerHTML = zpHtml(noten);
      alt.parentNode.replaceChild(tmp.firstChild, alt); zpBinden(noten);
    }
    Array.prototype.forEach.call(karte.querySelectorAll(".zp-zeile[data-zp] .zp-stufen button"), function(b){
      b.addEventListener("click", function(){
        var k = b.closest(".zp-zeile").getAttribute("data-zp");
        var w = zpGemerkt(); w[k] = +b.getAttribute("data-note"); zpMerken(w); neu();
      });
    });
    Array.prototype.forEach.call(karte.querySelectorAll("[data-zp-zurueck]"), function(b){
      b.addEventListener("click", function(){
        var w = zpGemerkt(); delete w[b.getAttribute("data-zp-zurueck")]; zpMerken(w); neu();
      });
    });
  }

  function malen(d){
    var p = d.proben, noten = d.noten || [], h = "";

    if (p){
      var g = noten.length, ziel = p.gesamt;
      h += '<div class="karte"><h2>Dein Schuljahr</h2>' +
           '<p class="unter">So viele Proben schreibst du in der 4. Klasse.</p>' +
           '<div class="gross">' + g + " von " + ziel + "</div>" +
           '<div class="balken"><i style="width:' + Math.min(100, Math.round(g/ziel*100)) + '%"></i></div>' +
           '<p class="unter">' + (ziel - g > 0
             ? "Noch " + (ziel - g) + (ziel - g === 1 ? " Probe" : " Proben") + " bis zum Sommer."
             : "Alle geschrieben!") + '</p>';

      h += '<div class="fliste">';
      Object.keys(p.faecher).forEach(function(f){
        // Die Zahl stand frueher direkt da; jetzt kann auch {anzahl, bereiche}
        // kommen. Beides lesen, damit ein alter Server nichts kaputt macht.
        var eintrag = p.faecher[f];
        var soll = (eintrag && typeof eintrag === "object") ? eintrag.anzahl : eintrag;
        var bereiche = (eintrag && typeof eintrag === "object" && eintrag.bereiche) || [];
        /* Seit 24.09.2026 kommt zusaetzlich, was in DIESEM Schuljahr wirklich
           drankommt - aus den Folien des Elternabends. Ein alter Server liefert
           es nicht; dann bleibt einfach alles wie vorher. */
        var themen   = (eintrag && typeof eintrag === "object" && eintrag.themen)   || [];
        var ziel     = (eintrag && typeof eintrag === "object" && eintrag.ziel)     || "";
        var aufklappbar = bereiche.length || themen.length;
        var gemacht = noten.filter(function(n){ return n.fach === f; }).length;
        h += '<button class="fzeile" type="button" data-fach="' + esc(f) + '"' +
             ' aria-expanded="false" aria-controls="was-' + esc(f) + '">' +
             "<b>" + esc(NAMEN[f] || f) + "</b>" +
             '<div class="bar"><i style="width:' + Math.min(100, Math.round(gemacht/soll*100)) + '%"></i></div>' +
             "<span>" + gemacht + " von " + soll + "</span>" +
             (aufklappbar ? '<span class="pfeil">›</span>' : "") + "</button>";
        if (aufklappbar){
          h += '<div class="fach-inhalt verborgen" id="was-' + esc(f) + '">';
          if (ziel){
            h += '<div class="ziel">Ziel: ' + esc(ziel) + "</div>";
          }
          if (themen.length){
            h += '<div class="kopf">Das kommt dieses Jahr dran</div><ul>' +
                 themen.map(function(b){ return "<li>" + esc(b) + "</li>"; }).join("") +
                 "</ul>";
          }
          if (bereiche.length){
            h += '<div class="kopf">Worin du benotet wirst</div><ul>' +
                 bereiche.map(function(b){ return "<li>" + esc(b) + "</li>"; }).join("") +
                 "</ul>";
          }
          h += "</div>";
        }
      });
      h += "</div></div>";

      var zh = '<div class="karte"><h2>Deine Zeugnisse</h2>';
      if (p.keinZwischenzeugnis){
        zh += '<p class="unter">In der 4. Klasse gibt es <b>kein Zwischenzeugnis</b> – dafür drei Rückmeldungen.</p>';
      }
      zh += '<ul class="termine">';
      p.zeugnisse.forEach(function(z){
        var t = tageBis(z.datum);
        zh += "<li><b>" + esc(z.was) + "</b><span" + (t !== null && t >= 0 && t < 30 ? ' class="bald"' : "") + ">" +
             lang(z.datum) + (t !== null && t >= 0 ? " · in " + t + (t === 1 ? " Tag" : " Tagen") : "") +
             "</span></li>";
      });
      zh += "</ul></div>";
    }

    /* Die eigenen Noten - nackt, ohne Auswertung. Denny am 20.09.2026:
       "sie müssen nicht unbedingt sehen, wo die Defizite waren." */
    h += '<div class="karte"><h2>Deine Noten</h2>';
    if (!noten.length){
      h += '<p class="unter">Hier steht deine erste Note, sobald du eine Probe zurückbekommst.</p>';
    } else {
      h += '<div class="noten">';
      noten.forEach(function(n){
        var offen = n.offen && (n.note === undefined || n.note === null);
        h += '<div class="note">' + (offen ? '<div class="z offen">Note kommt noch</div>' : '<div class="z">' + esc(n.note) + "</div>") +
             '<div class="was"><b>' + esc(NAMEN[n.fach] || n.fach || "") + "</b>" +
             "<span>" + esc(n.was || "") + (n.was && n.datum ? " · " : "") +
             (n.datum ? lang(n.datum) : "") + "</span></div></div>";
      });
      h += "</div>";
    }
    h += '<div id="peSlot"></div>';
    h += "</div>";

    if (p) h += zpHtml(noten);
    if (typeof zh === "string") h += zh;

    h += '<div class="merk">Eine Probe wird immer <b>eine Woche vorher</b> angekündigt – ' +
         'über den Schulmanager und in deinem Hausaufgabenheft.</div>';

    document.getElementById("inhalt").innerHTML = h;
    var slot = document.getElementById("peSlot");
    if (slot) slot.appendChild(peKnopf);
    zpBinden(noten);

    /* Ein Tipp auf ein Fach zeigt, was darin gefragt wird. Immer nur EINES
     * offen - sonst steht Paul vor einer Wand aus Text und sieht die Balken
     * nicht mehr, wegen derer er die Seite aufgemacht hat. */
    Array.prototype.forEach.call(document.querySelectorAll(".fzeile[data-fach]"), function(knopf){
      var was = document.getElementById("was-" + knopf.getAttribute("data-fach"));
      if (!was) return;
      knopf.addEventListener("click", function(){
        var auf = was.classList.contains("verborgen");
        Array.prototype.forEach.call(document.querySelectorAll(".fach-inhalt"), function(x){
          x.classList.add("verborgen");
        });
        Array.prototype.forEach.call(document.querySelectorAll(".fzeile[data-fach]"), function(x){
          x.classList.remove("offen"); x.setAttribute("aria-expanded", "false");
        });
        if (auf){
          was.classList.remove("verborgen");
          knopf.classList.add("offen");
          knopf.setAttribute("aria-expanded", "true");
        }
      });
    });
  }
})();
</script>
</body>
</html>
