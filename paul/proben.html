<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meine Proben</title>
<!--
  Denny am 23.09.2026: "Paul hat derzeit noch nichts zu seinen Noten, und
  somit hat er auch keine Informationen, wie viele Prüfungen er schreiben
  muss. Das sollten wir auf jeden Fall bei ihm auch noch mit einbauen. Das
  interessiert ihn natürlich."

  WAS HIER NICHT STEHT: eine Defizit-Auswertung. Denny am 20.09.2026 zum
  Noten-Manager: "sie müssen nicht unbedingt sehen, wo die Defizite waren."
  Also Zahlen, Termine und die eigenen Noten - kein "hier bist du schwach",
  kein Durchschnitt in Rot, keine Rangliste.

  Zahlen aus der Elterninformation der Grundschule Seeackerstraße (Scan in
  unterlagen/, Januar 2026): 18 schriftliche Leistungsnachweise, drei
  Rückmeldungen statt eines Zwischenzeugnisses.

  Keine Lernzeit: Nachschauen ist kein Lernen - lernstand.js bleibt draußen.
-->
<link rel="stylesheet" href="/beruehrung.css">
<!-- Eine Wahl fuer alle Seiten: siehe /thema.css. Muss VOR dem ersten
     Zeichnen laufen, sonst blitzt die falsche Farbe auf. -->
<script>(function(){try{ if(localStorage.getItem("hub-theme")!=="light") document.documentElement.setAttribute("data-theme","dark"); }catch(e){ document.documentElement.setAttribute("data-theme","dark"); }})();</script>
<link rel="stylesheet" href="/thema.css">
<style>
  :root{
    --bg:#eef1f7; --karte:#fff; --ink:#1b1c22; --muted:#6b7280; --line:#e4e7f0;
    --paul:#4f46e5; --gut:#12b76a;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    --rund:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  }
  html[data-theme="dark"]{--bg:#14151c;--karte:#1e2029;--ink:#eef1f8;--muted:#a0a6bd;--line:#2e3140}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--font);
       padding:18px 16px 70px;-webkit-text-size-adjust:100%}
  .huelle{max-width:640px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .zurueck{background:var(--karte);border-radius:999px;padding:9px 15px;text-decoration:none;
           color:var(--ink);font-weight:600;font-size:15.5px;min-height:44px;display:flex;align-items:center}
  h1{font:800 26px/1.2 var(--rund);margin:0}
  .karte{background:var(--karte);border-radius:22px;padding:20px;
         box-shadow:0 1px 2px rgba(20,22,40,.05),0 10px 28px rgba(20,22,40,.07)}
  .karte+.karte{margin-top:14px}
  h2{font:800 20px var(--rund);margin:0 0 4px}
  .unter{color:var(--muted);font-size:15px;margin:0}

  .balken{height:14px;border-radius:999px;background:var(--vertief);overflow:hidden;margin:14px 0 8px}
  .balken i{display:block;height:100%;background:linear-gradient(90deg,#7c5cff,#22c1c3)}
  .gross{font:800 30px/1.15 var(--rund);margin:2px 0 0}

  /* Ein Fach ist ein Knopf, kein Balken zum Ansehen.
   * Denny am 23.09.2026: "Paul sollte hier auf die Faecher klicken koennen.
   * Sprich, die Reiter muessen ein bisschen groesser werden, damit er auch
   * sieht, was dann in den Faechern gefragt wird."
   * Deshalb 56 px hoch statt 11 - das Mindestmass fuer einen Finger sind 44. */
  .verborgen{display:none!important}
  .fliste{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .fzeile{display:flex;align-items:center;gap:11px;width:100%;min-height:56px;
          border:1.5px solid var(--line);background:var(--feld);border-radius:16px;
          padding:11px 14px;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
  .fzeile:hover{border-color:var(--paul)}
  .fzeile.offen{border-color:var(--paul);background:var(--akzent-hell)}
  .fzeile b{flex:0 0 96px;font:700 15.5px var(--rund)}
  .fzeile .bar{flex:1;height:11px;border-radius:999px;background:var(--vertief);overflow:hidden}
  .fzeile .bar i{display:block;height:100%;background:var(--paul)}
  .fzeile span{flex:0 0 auto;font-size:14.5px;color:var(--muted);white-space:nowrap}
  .fzeile .pfeil{flex:0 0 auto;font-size:14px;color:var(--muted);transition:transform .18s}
  .fzeile.offen .pfeil{transform:rotate(90deg)}
  /* Die Inhalte stehen direkt unter ihrem Fach, eingerueckt wie eine Antwort. */
  .fach-inhalt{margin:-2px 0 4px;padding:13px 15px;border-radius:14px;
               background:var(--vertief);font-size:15.5px;line-height:1.5}
  .fach-inhalt .kopf{font:700 14.5px var(--rund);color:var(--muted);margin-bottom:7px}
  .fach-inhalt ul{margin:0;padding-left:20px}
  .fach-inhalt li{margin:5px 0}

  ul.termine{list-style:none;margin:12px 0 0;padding:0}
  ul.termine li{display:flex;gap:12px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line)}
  ul.termine li:first-child{border-top:none}
  ul.termine b{flex:1;font:700 16px var(--rund)}
  ul.termine span{color:var(--muted);font-size:15px;white-space:nowrap}
  ul.termine .bald{color:var(--paul);font-weight:700}

  .noten{display:flex;flex-direction:column;gap:9px;margin-top:12px}
  .note{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:14px;background:var(--feld)}
  .note .z{flex:0 0 38px;height:38px;border-radius:12px;background:var(--paul);color:var(--akzent-auf,#fff);
           font:800 19px/38px var(--rund);text-align:center}
  .note .was{flex:1;min-width:0}
  .note .was b{display:block;font:700 15.5px var(--rund)}
  .note .was span{font-size:13.5px;color:var(--muted)}
  .merk{margin-top:14px;border-radius:14px;background:var(--akzent-hell);border:1.5px solid #c7d2fe;
        padding:13px 15px;font-size:15.5px}
  html[data-theme="dark"] .balken,html[data-theme="dark"] .fzeile .bar{background:#262a38}
  html[data-theme="dark"] .note{background:#232634}
  html[data-theme="dark"] .merk{background:#1b1f38;border-color:#33407a}
</style>
</head>
<body>
<div class="huelle">
  <header>
    <a class="zurueck" href="/paul/">‹ Lernwelt</a>
    <h1>📋 Meine Proben</h1>
  </header>
  <div id="inhalt"><div class="karte"><p class="unter">Einen Moment …</p></div></div>
</div>

<script>
(function(){
  "use strict";
  var MONATE = ["Januar","Februar","März","April","Mai","Juni","Juli",
                "August","September","Oktober","November","Dezember"];
  var TAGE = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
  var NAMEN = {mathe:"Mathe", deutsch:"Deutsch", hsu:"HSU", englisch:"Englisch",
               rel:"Religion/Ethik", musik:"Musik", anderes:"Anderes"};

  function lang(iso){
    var t = String(iso||"").split("-");
    if (t.length !== 3) return String(iso||"");
    var d = new Date(+t[0], +t[1]-1, +t[2]);
    return TAGE[d.getDay()] + ", " + (+t[2]) + ". " + MONATE[+t[1]-1] + " " + t[0];
  }
  function tageBis(iso){
    var t = String(iso||"").split("-");
    if (t.length !== 3) return null;
    var d = new Date(+t[0], +t[1]-1, +t[2]);
    var h = new Date(); h.setHours(0,0,0,0);
    return Math.round((d - h) / 86400000);
  }
  function esc(t){
    return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  fetch("/api/noten?eigene=1&kind=paul", {credentials:"same-origin"})
    .then(function(r){ return r.json().then(function(j){ return {status:r.status, j:j}; }); })
    .then(function(a){
      if (a.status === 401){
        document.getElementById("inhalt").innerHTML =
          '<div class="karte"><h2>Melde dich bitte an</h2>' +
          '<p class="unter">Geh kurz zurück in deine Lernwelt.</p></div>';
        return;
      }
      if (!a.j || !a.j.ok){
        // Ehrlich bleiben: Nichts anzeigen heisst nicht "keine Noten".
        document.getElementById("inhalt").innerHTML =
          '<div class="karte"><h2>Das klappt gerade nicht</h2><p class="unter">' +
          esc((a.j && a.j.fehler) || "Probier es gleich nochmal.") + '</p></div>';
        return;
      }
      malen(a.j);
    })
    .catch(function(){
      document.getElementById("inhalt").innerHTML =
        '<div class="karte"><h2>Das klappt gerade nicht</h2>' +
        '<p class="unter">Probier es gleich nochmal.</p></div>';
    });

  function malen(d){
    var p = d.proben, noten = d.noten || [], h = "";

    if (p){
      var g = noten.length, ziel = p.gesamt;
      h += '<div class="karte"><h2>Dein Schuljahr</h2>' +
           '<p class="unter">So viele Proben schreibst du in der 4. Klasse.</p>' +
           '<div class="gross">' + g + " von " + ziel + "</div>" +
           '<div class="balken"><i style="width:' + Math.min(100, Math.round(g/ziel*100)) + '%"></i></div>' +
           '<p class="unter">' + (ziel - g > 0
             ? "Noch " + (ziel - g) + (ziel - g === 1 ? " Probe" : " Proben") + " bis zum Sommer."
             : "Alle geschrieben!") + '</p>';

      h += '<div class="fliste">';
      Object.keys(p.faecher).forEach(function(f){
        // Die Zahl stand frueher direkt da; jetzt kann auch {anzahl, bereiche}
        // kommen. Beides lesen, damit ein alter Server nichts kaputt macht.
        var eintrag = p.faecher[f];
        var soll = (eintrag && typeof eintrag === "object") ? eintrag.anzahl : eintrag;
        var bereiche = (eintrag && typeof eintrag === "object" && eintrag.bereiche) || [];
        var gemacht = noten.filter(function(n){ return n.fach === f; }).length;
        h += '<button class="fzeile" type="button" data-fach="' + esc(f) + '"' +
             ' aria-expanded="false" aria-controls="was-' + esc(f) + '">' +
             "<b>" + esc(NAMEN[f] || f) + "</b>" +
             '<div class="bar"><i style="width:' + Math.min(100, Math.round(gemacht/soll*100)) + '%"></i></div>' +
             "<span>" + gemacht + " von " + soll + "</span>" +
             (bereiche.length ? '<span class="pfeil">›</span>' : "") + "</button>";
        if (bereiche.length){
          h += '<div class="fach-inhalt verborgen" id="was-' + esc(f) + '">' +
               '<div class="kopf">Das wird in ' + esc(NAMEN[f] || f) + ' gefragt</div><ul>' +
               bereiche.map(function(b){ return "<li>" + esc(b) + "</li>"; }).join("") +
               "</ul></div>";
        }
      });
      h += "</div></div>";

      h += '<div class="karte"><h2>Deine Zeugnisse</h2>';
      if (p.keinZwischenzeugnis){
        h += '<p class="unter">In der 4. Klasse gibt es <b>kein Zwischenzeugnis</b> – dafür drei Rückmeldungen.</p>';
      }
      h += '<ul class="termine">';
      p.zeugnisse.forEach(function(z){
        var t = tageBis(z.datum);
        h += "<li><b>" + esc(z.was) + "</b><span" + (t !== null && t >= 0 && t < 30 ? ' class="bald"' : "") + ">" +
             lang(z.datum) + (t !== null && t >= 0 ? " · in " + t + (t === 1 ? " Tag" : " Tagen") : "") +
             "</span></li>";
      });
      h += "</ul></div>";
    }

    /* Die eigenen Noten - nackt, ohne Auswertung. Denny am 20.09.2026:
       "sie müssen nicht unbedingt sehen, wo die Defizite waren." */
    h += '<div class="karte"><h2>Deine Noten</h2>';
    if (!noten.length){
      h += '<p class="unter">Hier steht deine erste Note, sobald du eine Probe zurückbekommst.</p>';
    } else {
      h += '<div class="noten">';
      noten.forEach(function(n){
        h += '<div class="note"><div class="z">' + esc(n.note) + "</div>" +
             '<div class="was"><b>' + esc(NAMEN[n.fach] || n.fach || "") + "</b>" +
             "<span>" + esc(n.was || "") + (n.was && n.datum ? " · " : "") +
             (n.datum ? lang(n.datum) : "") + "</span></div></div>";
      });
      h += "</div>";
    }
    h += "</div>";

    h += '<div class="merk">Eine Probe wird immer <b>eine Woche vorher</b> angekündigt – ' +
         'über den Schulmanager und in deinem Hausaufgabenheft.</div>';

    document.getElementById("inhalt").innerHTML = h;

    /* Ein Tipp auf ein Fach zeigt, was darin gefragt wird. Immer nur EINES
     * offen - sonst steht Paul vor einer Wand aus Text und sieht die Balken
     * nicht mehr, wegen derer er die Seite aufgemacht hat. */
    Array.prototype.forEach.call(document.querySelectorAll(".fzeile[data-fach]"), function(knopf){
      var was = document.getElementById("was-" + knopf.getAttribute("data-fach"));
      if (!was) return;
      knopf.addEventListener("click", function(){
        var auf = was.classList.contains("verborgen");
        Array.prototype.forEach.call(document.querySelectorAll(".fach-inhalt"), function(x){
          x.classList.add("verborgen");
        });
        Array.prototype.forEach.call(document.querySelectorAll(".fzeile[data-fach]"), function(x){
          x.classList.remove("offen"); x.setAttribute("aria-expanded", "false");
        });
        if (auf){
          was.classList.remove("verborgen");
          knopf.classList.add("offen");
          knopf.setAttribute("aria-expanded", "true");
        }
      });
    });
  }
})();
</script>
</body>
</html>
