<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Blätter abschließen</title>
<!--
  Schalter "aktuell", Regel F (04.11.2026, Kapitel 164 im Entwurf, nur Paul).
  Nach einer Probe schliesst Denny die Blaetter ab, die zur Probe gehoerten. Offene Blaetter uebt Paul
  dichter (Leiter 1/3/1/2/3/5 Tage). Diese Seite enthaelt keine Daten; sie liest und schreibt nur ueber
  /api/aktuell-abschluss (Elternausweis). Geschrieben wird erst nach "Abschluss speichern" in der Vorschau.
-->
<link rel="stylesheet" href="/beruehrung.css?v=8a84e32c">
<style>
  :root{ --bg:#f4f6f9; --karte:#fff; --ink:#161821; --muted:#5f6675; --line:#e5e8ef;
    --gut:#12804a; --mittel:#b45309; --schlecht:#b42318; --paul:#4f46e5;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;padding:22px 16px 60px}
  .huelle{max-width:1000px;margin:0 auto}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:24px;margin:0}
  .zurueck,.knopf{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 15px;border:1.5px solid var(--line);background:#fff;
    border-radius:11px;color:var(--ink);text-decoration:none;font-weight:600;font-size:16px;cursor:pointer}
  .knopf.haupt{background:var(--paul);border-color:var(--paul);color:#fff}
  .knopf:disabled{opacity:.5;cursor:default}
  .karte{background:var(--karte);border-radius:16px;padding:18px 20px;margin-bottom:14px;box-shadow:0 4px 14px rgba(20,30,60,.06)}
  .karte h2{font-size:20px;margin:0 0 4px}
  .unter{color:var(--muted);margin:0 0 12px}
  .feld{display:flex;flex-direction:column;gap:4px;margin:0 0 12px;max-width:560px}
  .feld label{font-weight:600}
  select,input{min-height:44px;font-size:16px;padding:6px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
  .rollen{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;min-width:640px}
  td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:14px}
  .klein{color:var(--muted);font-size:14px}
  .marke{display:inline-block;border-radius:8px;padding:1px 8px;font-size:13px;font-weight:600;white-space:nowrap}
  .m-offen{background:#e7f6ee;color:var(--gut)}
  .m-zu{background:#eef0f4;color:var(--muted)}
  .m-unsicher{background:#fff4e5;color:var(--mittel)}
  .hinweis{border-left:4px solid var(--mittel);padding:8px 12px;background:#fffaf0;border-radius:8px;margin:10px 0}
  .fehler{color:var(--schlecht);font-weight:600}
  .reihe{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
</style>
</head>
<body>
<div class="huelle">
  <header>
    <a class="zurueck" href="/eltern/">← Elternbereich</a>
    <h1>Blätter abschließen</h1>
  </header>
  <div id="inhalt"><div class="karte"><p class="unter">Lade …</p></div></div>
</div>
<script>
(function(){
  "use strict";
  var FACH = { mathe: "Mathe", deutsch: "Deutsch", hsu: "HSU", englisch: "Englisch" };
  var VON = { blatt: "vom Blatt", kind: "von Paul", upload: "Tag des Hochladens" };
  var API = "/api/aktuell-abschluss";
  var daten = null, vorschau = null;
  function esc(t){ var d=document.createElement("div"); d.textContent=t==null?"":String(t); return d.innerHTML; }
  function $(id){ return document.getElementById(id); }
  function dt(iso){ var p=String(iso||"").split("-"); if(p.length!==3) return "–";
    var t=new Date(+p[0],+p[1]-1,+p[2]); return t.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"}); }
  function hol(url, opt){
    return fetch(url, Object.assign({ credentials: "same-origin", cache: "no-store" }, opt || {}))
      .then(function(r){ return r.json().then(function(j){ return { s: r.status, j: j }; }, function(){ return { s: r.status, j: null }; }); });
  }
  function titel(b){ return esc(b.titel) + (b.gleicherTitel ? ' <span class="klein">(' + esc(b.gleicherTitel) + ')</span>' : ""); }
  function datumZelle(b){
    return esc(dt(b.datum)) + '<br><span class="klein">' + esc(VON[b.von] || "–") + '</span>' +
      (b.unsicher ? ' <span class="marke m-unsicher">unsicher</span>' : "");
  }

  function laden(){
    hol(API + "?kind=paul").then(function(a){
      if (a.s === 401){ $("inhalt").innerHTML = '<div class="karte"><h2>Bitte zuerst anmelden</h2><p class="unter">Melde dich im <a href="/eltern/">Elternbereich</a> an und öffne diese Seite dann noch einmal.</p></div>'; return; }
      if (!a.j || !a.j.ok){ $("inhalt").innerHTML = '<div class="karte"><h2>Gerade nicht lesbar</h2><p class="unter">' + esc(a.j && a.j.fehler) + '</p></div>'; return; }
      daten = a.j; vorschau = null; zeichnen();
    });
  }

  function zeichnen(){
    var f = Object.keys(daten.faecher).sort();
    var h = "";
    if (daten.warnung) h += '<div class="hinweis">⚠️ ' + esc(daten.warnung) + '</div>';
    if (daten.schalter !== "neu")
      h += '<div class="hinweis">Der Schalter „aktuell“ ist noch aus. Abschlüsse lassen sich schon setzen, wirken für Paul aber erst nach dem Einschalten.</div>';
    h += '<div class="karte"><h2>Neuer Abschluss</h2>' +
      '<p class="unter">Fach, Probendatum und das letzte Blatt der Probe wählen. Danach zeigt die Seite, welche Blätter geschlossen würden. Gespeichert wird erst nach deiner Bestätigung. Neuere Blätter bleiben offen, auch wenn sie am selben Tag hochgeladen wurden.</p>' +
      '<div class="feld"><label for="fach">Fach</label><select id="fach">' +
      f.map(function(x){ return '<option value="' + esc(x) + '">' + esc(FACH[x] || x) + '</option>'; }).join("") + '</select></div>' +
      '<div class="feld"><label for="probe">Probendatum</label><input type="date" id="probe"></div>' +
      '<div class="feld"><label for="letztes">Letztes Blatt der Probe</label><select id="letztes"></select></div>' +
      '<div class="feld"><label for="thema">Nur Blätter mit diesem Thema (wahlweise)</label><input type="text" id="thema" maxlength="80" placeholder="z. B. Fürth"></div>' +
      '<div class="reihe"><button class="knopf" id="zeigen">Vorschau zeigen</button></div>' +
      '<div id="vorschau"></div></div>';
    h += '<div class="karte"><h2>Gesetzte Abschlüsse</h2>' + abschluesse() + '</div>';
    h += '<div class="karte"><h2>Alle Blätter</h2><p class="unter">Neueste zuerst. „offen“ übt Paul dichter.</p>' + alleBlaetter(f) + '</div>';
    $("inhalt").innerHTML = h;
    $("fach").addEventListener("change", fuellLetztes);
    $("zeigen").addEventListener("click", zeigeVorschau);
    fuellLetztes();
    Array.prototype.forEach.call(document.querySelectorAll("[data-weg]"), function(k){
      k.addEventListener("click", function(){ zuruecknehmen(k.getAttribute("data-weg")); });
    });
  }

  function fuellLetztes(){
    var l = daten.faecher[$("fach").value] || [];
    $("letztes").innerHTML = l.filter(function(b){ return !b.geschlossen; }).map(function(b){
      return '<option value="' + esc(b.id) + '">' + esc(dt(b.datum)) + " · " + esc(b.titel) + (b.gleicherTitel ? " (" + esc(b.gleicherTitel) + ")" : "") + " · " + esc(b.id) + '</option>';
    }).join("");
    $("vorschau").innerHTML = ""; vorschau = null;
  }

  function zeigeVorschau(){
    var fach = $("fach").value, letztes = $("letztes").value, thema = $("thema").value.trim();
    if (!letztes){ $("vorschau").innerHTML = '<p class="fehler">Bitte das letzte Blatt wählen.</p>'; return; }
    hol(API + "?kind=paul&fach=" + encodeURIComponent(fach) + "&letztes=" + encodeURIComponent(letztes) + (thema ? "&thema=" + encodeURIComponent(thema) : ""))
      .then(function(a){
        if (!a.j || !a.j.ok){ $("vorschau").innerHTML = '<p class="fehler">' + esc(a.j && a.j.fehler) + '</p>'; return; }
        vorschau = { fach: fach, letztes: letztes, thema: thema, liste: a.j.liste };
        zeichneVorschau();
      });
  }

  function zeichneVorschau(){
    var l = vorschau.liste;
    var h = '<h3>Diese ' + l.length + ' Blätter würden geschlossen</h3>';
    if (!l.length){ $("vorschau").innerHTML = h + '<p class="unter">Keine offenen Blätter bis zu diesem Blatt.</p>'; return; }
    h += '<div class="rollen"><table><tr><th>Blatt</th><th>Schuldatum</th><th>Thema</th><th>Kennung</th></tr>' +
      l.map(function(b){ return '<tr><td>' + titel(b) + '</td><td>' + datumZelle(b) + '</td><td>' + esc(b.thema) + '</td><td class="klein">' + esc(b.id) + '</td></tr>'; }).join("") +
      '</table></div><div class="reihe"><button class="knopf haupt" id="speichern">Abschluss speichern</button></div><p id="meldung"></p>';
    $("vorschau").innerHTML = h;
    $("speichern").addEventListener("click", speichern);
  }

  function speichern(){
    var probe = $("probe").value;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(probe)){ $("meldung").innerHTML = '<span class="fehler">Bitte das Probendatum eintragen.</span>'; return; }
    $("speichern").disabled = true;
    hol(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({
      kind: "paul", fach: vorschau.fach, probe: probe, letztes: vorschau.letztes, thema: vorschau.thema,
      bestaetigt: vorschau.liste.map(function(b){ return b.id; }) }) })
      .then(function(a){
        if (a.s === 409 && a.j && a.j.liste){ vorschau.liste = a.j.liste; zeichneVorschau();
          $("meldung").innerHTML = '<span class="fehler">' + esc(a.j.fehler) + '</span>'; return; }
        if (!a.j || !a.j.ok){ $("speichern").disabled = false; $("meldung").innerHTML = '<span class="fehler">' + esc(a.j && a.j.fehler) + '</span>'; return; }
        laden();
      });
  }

  function zuruecknehmen(gesetzt){
    if (!window.confirm("Diesen Abschluss zurücknehmen? Die Blätter sind danach wieder offen.")) return;
    hol(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ kind: "paul", aktion: "zuruecknehmen", gesetzt: gesetzt }) })
      .then(function(a){
        if (!a.j || !a.j.ok) { window.alert((a.j && a.j.fehler) || "Zurücknehmen hat nicht geklappt."); return; }
        laden();
      });
  }

  function abschluesse(){
    var l = daten.abschluesse || [];
    if (!l.length) return '<p class="unter">Noch keiner. Bis dahin gilt: offen ist, was seit der letzten Probe des Fachs datiert ist.</p>';
    return '<div class="rollen"><table><tr><th>Fach</th><th>Probe</th><th>Blätter</th><th>Thema</th><th></th></tr>' +
      l.slice().reverse().map(function(a){
        return '<tr><td>' + esc(FACH[a.fach] || a.fach) + '</td><td>' + esc(dt(a.probe)) + '</td><td>' + a.ids.length + '</td><td>' + esc(a.thema || "–") +
          '</td><td><button class="knopf" data-weg="' + esc(a.gesetzt) + '">Zurücknehmen</button></td></tr>';
      }).join("") + '</table></div>';
  }

  function alleBlaetter(f){
    return f.map(function(x){
      var l = daten.faecher[x];
      return '<h3>' + esc(FACH[x] || x) + ' <span class="klein">(' + l.filter(function(b){ return b.offen; }).length + ' offen von ' + l.length + ')</span></h3>' +
        '<div class="rollen"><table><tr><th>Blatt</th><th>Schuldatum</th><th>Stand</th><th>Kennung</th></tr>' +
        l.map(function(b){ return '<tr><td>' + titel(b) + '</td><td>' + datumZelle(b) + '</td><td>' +
          (b.offen ? '<span class="marke m-offen">offen</span>' : '<span class="marke m-zu">' + (b.geschlossen ? "abgeschlossen" : "älter als die Probe") + '</span>') +
          '</td><td class="klein">' + esc(b.id) + '</td></tr>'; }).join("") + '</table></div>';
    }).join("");
  }

  laden();
})();
</script>
</body>
</html>
