<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Blätter abschließen</title>
<!--
  Schalter "aktuell", Regel F (04.11.2026, Kapitel 164 im Entwurf, nur Paul).
  Nachbesserung 2 (Beschluss 04.11.2026, 12:55 Uhr): Nach einer Probe stuft Denny JEDES Blatt des Fachs ein:
  "abgefragt" (abgeschlossen), "nicht abgefragt" (offen), "unsicher" (offen, ein Satz Begruendung). Nur
  "abgefragt" schliesst, kein Datum. Vorschlaege kommen aus functions/api/_aktuell-vorschlag.js. Diese Seite
  enthaelt keine Daten; sie liest und schreibt nur ueber /api/aktuell-abschluss (Elternausweis). Geschrieben
  wird erst nach "Ganze Liste bestaetigen".
  Nachbesserung 3 (Auftrag 208, 04.11.2026): vierte Stufe "probenzeitraum" (Probenzeitraum, nicht abgefragt,
  schliesst), bestaetigte Proben (Mathe 19.10.2026) gelten ohne Speichern und stehen ohne Zuruecknehmen-Knopf
  unter "Gesetzte Abschluesse"; Grundlagen tragen eine Marke mit Halbsatz.
-->
<link rel="stylesheet" href="/beruehrung.css?v=8a84e32c">
<style>
  :root{ --bg:#f4f6f9; --karte:#fff; --ink:#161821; --muted:#5f6675; --line:#e5e8ef;
    --gut:#12804a; --mittel:#b45309; --schlecht:#b42318; --paul:#4f46e5;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;padding:22px 16px 60px}
  .huelle{max-width:1000px;margin:0 auto}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:24px;margin:0}
  .zurueck,.knopf{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 15px;border:1.5px solid var(--line);background:#fff;
    border-radius:11px;color:var(--ink);text-decoration:none;font-weight:600;font-size:16px;cursor:pointer}
  .knopf.haupt{background:var(--paul);border-color:var(--paul);color:#fff}
  .knopf:disabled{opacity:.5;cursor:default}
  .karte{background:var(--karte);border-radius:16px;padding:18px 20px;margin-bottom:14px;box-shadow:0 4px 14px rgba(20,30,60,.06)}
  .karte h2{font-size:20px;margin:0 0 4px}
  .unter{color:var(--muted);margin:0 0 12px}
  .feld{display:flex;flex-direction:column;gap:4px;margin:0 0 12px;max-width:560px}
  .feld label{font-weight:600}
  select,input{min-height:44px;font-size:16px;padding:6px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
  .rollen{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;min-width:640px}
  td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:14px}
  .klein{color:var(--muted);font-size:14px}
  .marke{display:inline-block;border-radius:8px;padding:1px 8px;font-size:13px;font-weight:600;white-space:nowrap}
  .m-offen{background:#e7f6ee;color:var(--gut)}
  .m-zu{background:#eef0f4;color:var(--muted)}
  .m-unsicher{background:#fff4e5;color:var(--mittel)}
  .m-grund{background:#eef0ff;color:var(--paul)}
  .stufe select{min-width:150px}
  .begr input{min-width:220px}
  .hinweis{border-left:4px solid var(--mittel);padding:8px 12px;background:#fffaf0;border-radius:8px;margin:10px 0}
  .fehler{color:var(--schlecht);font-weight:600}
  .reihe{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
</style>
</head>
<body>
<div class="huelle">
  <header>
    <a class="zurueck" href="/eltern/">← Elternbereich</a>
    <h1>Blätter abschließen</h1>
  </header>
  <div id="inhalt"><div class="karte"><p class="unter">Lade …</p></div></div>
</div>
<script>
(function(){
  "use strict";
  var FACH = { mathe: "Mathe", deutsch: "Deutsch", hsu: "HSU", englisch: "Englisch" };
  var VON = { blatt: "vom Blatt", kind: "von Paul", upload: "Tag des Hochladens" };
  var API = "/api/aktuell-abschluss";
  var daten = null, vorschau = null;
  function esc(t){ var d=document.createElement("div"); d.textContent=t==null?"":String(t); return d.innerHTML; }
  function $(id){ return document.getElementById(id); }
  function dt(iso){ var p=String(iso||"").split("-"); if(p.length!==3) return "–";
    var t=new Date(+p[0],+p[1]-1,+p[2]); return t.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"}); }
  function hol(url, opt){
    return fetch(url, Object.assign({ credentials: "same-origin", cache: "no-store" }, opt || {}))
      .then(function(r){ return r.json().then(function(j){ return { s: r.status, j: j }; }, function(){ return { s: r.status, j: null }; }); });
  }
  function titel(b){ return esc(b.titel) + (b.gleicherTitel ? ' <span class="klein">(' + esc(b.gleicherTitel) + ')</span>' : ""); }
  function datumZelle(b){
    return esc(dt(b.datum)) + '<br><span class="klein">' + esc(VON[b.von] || "–") + '</span>' +
      (b.unsicher ? ' <span class="marke m-unsicher">unsicher</span>' : "");
  }

  function laden(){
    hol(API + "?kind=paul").then(function(a){
      if (a.s === 401){ $("inhalt").innerHTML = '<div class="karte"><h2>Bitte zuerst anmelden</h2><p class="unter">Melde dich im <a href="/eltern/">Elternbereich</a> an und öffne diese Seite dann noch einmal.</p></div>'; return; }
      if (!a.j || !a.j.ok){ $("inhalt").innerHTML = '<div class="karte"><h2>Gerade nicht lesbar</h2><p class="unter">' + esc(a.j && a.j.fehler) + '</p></div>'; return; }
      daten = a.j; vorschau = null; zeichnen();
    });
  }

  var STUFEN = ["abgefragt", "probenzeitraum", "nicht abgefragt", "unsicher"];
  var LESBAR = { "abgefragt": "abgefragt", "probenzeitraum": "Probenzeitraum, nicht abgefragt", "nicht abgefragt": "nicht abgefragt", "unsicher": "unsicher" };
  var SCHLIESST = { "abgefragt": 1, "probenzeitraum": 1 };
  function zaehlText(z){ return z["abgefragt"] + " abgefragt · " + z["probenzeitraum"] + " Probenzeitraum, nicht abgefragt · " + z["nicht abgefragt"] + " nicht abgefragt · " + z["unsicher"] + " unsicher"; }
  function leer(){ return { "abgefragt": 0, "probenzeitraum": 0, "nicht abgefragt": 0, "unsicher": 0 }; }
  function bestText(b){ return b && b.von ? "bestätigt (" + b.von + "), gilt ohne erneutes Speichern" : "bestätigt, gilt ohne erneutes Speichern"; }
  var QUELLE = { vorschlag: "Vorschlag geprüft", datum: "nur nach Datum" };

  function zeichnen(){
    var f = Object.keys(daten.faecher).sort();
    var h = "";
    if (daten.warnung) h += '<div class="hinweis">⚠️ ' + esc(daten.warnung) + '</div>';
    if (daten.schalter !== "neu")
      h += '<div class="hinweis">Der Schalter „aktuell“ ist noch aus. Abschlüsse lassen sich schon setzen, wirken für Paul aber erst nach dem Einschalten.</div>';
    var pr = daten.proben || [];
    h += '<div class="karte"><h2>Probe einstufen</h2>' +
      '<p class="unter">Probe wählen. Danach steht jedes Blatt des Fachs da, mit einer vorgeschlagenen Stufe. „abgefragt“ und „Probenzeitraum, nicht abgefragt“ schließen ein Blatt ab; „nicht abgefragt“ und „unsicher“ bleiben offen. Das Datum ist nur ein Vorschlag. Gespeichert wird erst, wenn du die ganze Liste bestätigst.</p>' +
      '<div class="feld"><label for="probe">Probe</label><select id="probe">' +
      pr.map(function(p){ return '<option value="' + esc(p.schluessel) + '">' + esc(FACH[p.fach] || p.fach) + " · " + esc(p.probe) + " · " + esc(p.probeDatum ? dt(p.probeDatum) : "Datum offen") + (p.vorlaeufig ? " · vorläufig" : "") + (p.bestaetigt ? " · bestätigt" : "") + '</option>'; }).join("") +
      '<option value="">Andere Probe …</option></select></div>' +
      '<div id="andere" style="display:none"><div class="feld"><label for="fach">Fach</label><select id="fach">' +
      f.map(function(x){ return '<option value="' + esc(x) + '">' + esc(FACH[x] || x) + '</option>'; }).join("") + '</select></div>' +
      '<div class="feld"><label for="pname">Probe</label><input type="text" id="pname" maxlength="120" placeholder="z. B. 2. Probe Mathematik"></div>' +
      '<div class="feld"><label for="pdatum">Probendatum</label><input type="date" id="pdatum"></div></div>' +
      '<div class="reihe"><button class="knopf" id="zeigen">Liste zeigen</button></div>' +
      '<div id="vorschau"></div></div>';
    h += '<div class="karte"><h2>Gesetzte Abschlüsse</h2>' + abschluesse() + '</div>';
    h += '<div class="karte"><h2>Alle Blätter</h2><p class="unter">Neueste zuerst. „offen“ übt Paul dichter.</p>' + alleBlaetter(f) + '</div>';
    $("inhalt").innerHTML = h;
    $("probe").addEventListener("change", function(){ $("andere").style.display = $("probe").value ? "none" : "block"; $("vorschau").innerHTML = ""; vorschau = null; });
    $("andere").style.display = $("probe").value ? "none" : "block";
    $("zeigen").addEventListener("click", zeigeVorschau);
    Array.prototype.forEach.call(document.querySelectorAll("[data-weg]"), function(k){
      k.addEventListener("click", function(){ zuruecknehmen(k.getAttribute("data-weg")); });
    });
  }

  function zeigeVorschau(){
    var schl = $("probe").value, url;
    if (schl) url = API + "?kind=paul&probe=" + encodeURIComponent(schl);
    else {
      if (!/^\d{4}-\d{2}-\d{2}$/.test($("pdatum").value)){ $("vorschau").innerHTML = '<p class="fehler">Bitte das Probendatum eintragen.</p>'; return; }
      url = API + "?kind=paul&fach=" + encodeURIComponent($("fach").value) + "&probeDatum=" + encodeURIComponent($("pdatum").value);
    }
    hol(url).then(function(a){
      if (!a.j || !a.j.ok){ $("vorschau").innerHTML = '<p class="fehler">' + esc(a.j && a.j.fehler) + '</p>'; return; }
      vorschau = { fach: a.j.fach, probe: schl ? a.j.probe : $("pname").value.trim(), probeDatum: a.j.probeDatum,
                   vorlaeufig: !!a.j.vorlaeufig, hinweis: a.j.hinweis || "", bestaetigt: a.j.bestaetigt || null, liste: a.j.liste };
      zeichneVorschau();
    });
  }

  function zaehlStufen(){
    var z = leer();
    vorschau.liste.forEach(function(b){ z[b.stufe] = (z[b.stufe] || 0) + 1; });
    return zaehlText(z);
  }

  function zeichneVorschau(){
    var l = vorschau.liste;
    var h = '<h3>' + esc(FACH[vorschau.fach] || vorschau.fach) + ': ' + l.length + ' Blätter</h3>';
    if (vorschau.vorlaeufig) h += '<div class="hinweis">⚠️ Vorläufig: ' + esc(vorschau.hinweis || "Das Probenfoto fehlt noch. Die Stufen sind nur aus Titel und Thema geschätzt.") + '</div>';
    if (vorschau.bestaetigt) h += '<div class="hinweis">✅ ' + esc(bestText(vorschau.bestaetigt)) + '. Ändern geht hier trotzdem: eine neu bestätigte Liste gilt dann vorrangig.</div>';
    h += '<p class="unter" id="zaehl">' + esc(zaehlStufen()) + '</p>';
    h += '<div class="rollen"><table><tr><th>Blatt</th><th>Schuldatum</th><th>Stufe</th><th>Begründung</th></tr>' +
      l.map(function(b, i){
        return '<tr><td>' + titel(b) + (b.grundlage ? '<br><span class="marke m-grund">Grundlage</span> <span class="klein">' + esc(b.grundlage) + '</span>' : "") +
          (b.widerspruch ? '<br><span class="klein">⚠️ Datum passt nicht zum Inhalt: ' + esc(b.widerspruch) + '</span>' : "") +
          (b.bisher ? '<br><span class="klein">bisher: ' + esc(b.bisher) + '</span>' : "") + '<br><span class="klein">' + esc(b.id) + '</span></td><td>' + datumZelle(b) +
          '</td><td class="stufe"><select data-i="' + i + '">' + STUFEN.map(function(s){ return '<option value="' + esc(s) + '"' + (s === b.stufe ? " selected" : "") + '>' + esc(LESBAR[s]) + '</option>'; }).join("") +
          '</select><br><span class="klein">' + esc(QUELLE[b.quelle] || "") + '</span></td><td class="begr"><input type="text" maxlength="300" data-b="' + i + '" value="' + esc(b.begruendung) + '"></td></tr>';
      }).join("") +
      '</table></div><div class="reihe"><button class="knopf haupt" id="speichern">Ganze Liste bestätigen</button></div><p id="meldung"></p>';
    $("vorschau").innerHTML = h;
    Array.prototype.forEach.call(document.querySelectorAll("[data-i]"), function(s){
      s.addEventListener("change", function(){ l[+s.getAttribute("data-i")].stufe = s.value; $("zaehl").textContent = zaehlStufen(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-b]"), function(t){
      t.addEventListener("input", function(){ l[+t.getAttribute("data-b")].begruendung = t.value; });
    });
    $("speichern").addEventListener("click", speichern);
  }

  function speichern(){
    var stufen = {}, begr = {}, leer = [];
    vorschau.liste.forEach(function(b){
      stufen[b.id] = b.stufe;
      if (b.begruendung && b.begruendung.trim()) begr[b.id] = b.begruendung.trim();
      if (b.stufe === "unsicher" && !(b.begruendung || "").trim()) leer.push(b.titel);
    });
    if (leer.length){ $("meldung").innerHTML = '<span class="fehler">Bei „unsicher“ fehlt die Begründung: ' + esc(leer.join(", ")) + '</span>'; return; }
    var frage = "Diese Liste speichern? " + zaehlStufen() + ". „abgefragt“ und „Probenzeitraum, nicht abgefragt“ werden abgeschlossen.";
    if (vorschau.vorlaeufig) frage = "⚠️ Das Probenfoto fehlt noch, die Stufen sind vorläufig. " + frage;
    if (!window.confirm(frage)) return;
    $("speichern").disabled = true;
    hol(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({
      kind: "paul", fach: vorschau.fach, probe: vorschau.probe, probeDatum: vorschau.probeDatum, stufen: stufen, begruendungen: begr }) })
      .then(function(a){
        if (a.s === 409 && a.j && a.j.liste){ vorschau.liste = a.j.liste; zeichneVorschau();
          $("meldung").innerHTML = '<span class="fehler">' + esc(a.j.fehler) + '</span>'; return; }
        if (!a.j || !a.j.ok){ $("speichern").disabled = false; $("meldung").innerHTML = '<span class="fehler">' + esc(a.j && a.j.fehler) + '</span>'; return; }
        laden();
      });
  }

  function zuruecknehmen(gesetzt){
    if (!window.confirm("Diesen Abschluss zurücknehmen? Die Blätter sind danach wieder offen.")) return;
    hol(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ kind: "paul", aktion: "zuruecknehmen", gesetzt: gesetzt }) })
      .then(function(a){
        if (!a.j || !a.j.ok) { window.alert((a.j && a.j.fehler) || "Zurücknehmen hat nicht geklappt."); return; }
        laden();
      });
  }

  function abschluesse(){
    var l = daten.abschluesse || [], bs = daten.basis || [];
    if (!l.length && !bs.length) return '<p class="unter">Noch keiner. Bis dahin ist jedes Blatt offen.</p>';
    function zeile(a, knopf){
      var z = leer();
      Object.keys(a.stufen || {}).forEach(function(id){ z[a.stufen[id]] = (z[a.stufen[id]] || 0) + 1; });
      (a.ids || []).forEach(function(){ z["abgefragt"]++; });
      return '<tr><td>' + esc(FACH[a.fach] || a.fach) + '</td><td>' + esc(a.probe || "–") + '</td><td>' + esc(dt(a.probeDatum || a.probe)) + '</td><td>' +
        z["abgefragt"] + ' abgefragt<br>' + z["probenzeitraum"] + ' Probenzeitraum, nicht abgefragt<br>' + z["nicht abgefragt"] + ' nicht abgefragt<br>' + z["unsicher"] + ' unsicher' +
        '</td><td>' + knopf + '</td></tr>';
    }
    return '<div class="rollen"><table><tr><th>Fach</th><th>Probe</th><th>Probendatum</th><th>Stufen</th><th></th></tr>' +
      l.slice().reverse().map(function(a){ return zeile(a, '<button class="knopf" data-weg="' + esc(a.gesetzt) + '">Zurücknehmen</button>'); }).join("") +
      bs.map(function(a){ return zeile(a, '<span class="klein">' + esc(bestText(a.bestaetigt)) + '</span>'); }).join("") + '</table></div>';
  }

  function alleBlaetter(f){
    return f.map(function(x){
      var l = daten.faecher[x];
      return '<h3>' + esc(FACH[x] || x) + ' <span class="klein">(' + l.filter(function(b){ return b.offen; }).length + ' offen von ' + l.length + ')</span></h3>' +
        '<div class="rollen"><table><tr><th>Blatt</th><th>Schuldatum</th><th>Stand</th><th>Kennung</th></tr>' +
        l.map(function(b){ return '<tr><td>' + titel(b) + (b.grundlage ? '<br><span class="marke m-grund">Grundlage</span> <span class="klein">' + esc(b.grundlage) + '</span>' : "") + '</td><td>' + datumZelle(b) + '</td><td>' +
          (b.offen ? '<span class="marke m-offen">offen' + (b.markiert ? " (" + esc(b.stufeLesbar || "eingestuft") + ")" : "") + '</span>' : '<span class="marke m-zu">' + esc(b.stufeLesbar || "abgefragt") + '</span>') +
          '</td><td class="klein">' + esc(b.id) + '</td></tr>'; }).join("") + '</table></div>';
    }).join("");
  }

  laden();
})();
</script>
</body>
</html>
