<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernstand</title>
<link rel="stylesheet" href="/beruehrung.css">
<style>
  :root{
    --bg:#f4f6f9; --karte:#fff; --ink:#161821; --muted:#6b7280; --line:#e5e8ef;
    --gut:#12a35f; --mittel:#e8a13a; --schlecht:#e05252; --akzent:#475569;
    --paul:#4f46e5; --leon:#10b981; --helena:#e0457b;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --rund:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
       font-size:15px;line-height:1.5;padding:22px 16px 60px}
  .huelle{max-width:940px;margin:0 auto}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  h1{font-family:var(--rund);font-size:26px;margin:0;letter-spacing:-.01em}
  .stand{color:var(--muted);font-size:13.5px}
  /* Die Reiter teilen sich die Zeile. Vorher waren es drei schmale Knoepfe am
     linken Rand - Denny am 21.09.2026: "ein bisschen groesser, sodass man sie
     gut anklicken kann." */
  /* Drei Vorschauen unter den Reitern: was JEDES Kind heute gespielt hat.
     Denny am 21.09.2026, nachdem "War Paul da? 15 min" und "Heute: Noch nichts
     gespielt" nebeneinander standen: "Du zeigst mir aber an zwei Stellen an,
     dass er heute nicht gespielt hat. Stimmt, nun?" - Beide Zahlen waren
     richtig und meinten Verschiedenes. Diese Karte sagt beides in einem Satz. */
  /* Der Zeitstrahl mit Lernanteil (Denny, 21.09.2026, Variante 1 von drei).
     "da" und "weg" sind raus - er wollte sie ausdruecklich nicht: Der Balken
     zeigt die Spanne ohnehin, und "da" war gerade die Zahl, die in die Irre
     fuehrt. Bei Paul und Helena stammte sie an dem Tag von Dennys eigenem
     Besuch, nicht von den Kindern.
     Heller Balken = Spanne am Geraet. Kraeftiger Teil darin = echte Lernzeit
     aus den Runden. Orange = da gewesen, aber nichts beendet. */
  .strahlzeile{padding:13px 0;border-top:1px solid var(--linie,#e4e7f0)}
  .strahlzeile:first-of-type{border-top:0}
  .strahlkopf{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .strahlkopf .wann{font-size:13px;color:var(--grau,#71768a);min-width:74px}
  .strahlkopf .gelernt{color:#2563eb;font-weight:700;font-size:13.5px}
  .strahlkopf .nixda{color:#b45309;font-weight:700;font-size:13.5px}
  .strahlkopf .geraet{margin-left:auto;font-size:12px;color:var(--grau,#71768a);
    background:#f1f3f8;border-radius:999px;padding:3px 10px;white-space:nowrap}
  .strahl{position:relative;height:24px;background:#eef1f7;border-radius:7px;overflow:hidden}
  .strahl .spanne{position:absolute;top:0;bottom:0;background:#dbe3f0}
  .strahl .lernteil{position:absolute;top:0;bottom:0;background:#2563eb;opacity:.9}
  .strahl .nixteil{position:absolute;top:0;bottom:0;background:#f59e0b;opacity:.55}
  .strahlmarken{display:flex;justify-content:space-between;font-size:11.5px;
    color:var(--grau,#71768a);margin-top:3px}
  .strahltat{margin-top:8px;font-size:13px;line-height:1.7;color:var(--grau,#71768a)}
  .strahltat b{color:var(--ink,#1b1c22);font-weight:600}
  .strahltat .erg{color:#2563eb;font-weight:700}

  .vorschauen{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
              gap:12px;margin-bottom:20px}
  .vor{background:var(--karte,#fff);border:1px solid var(--linie,#e4e7f0);border-radius:14px;
       padding:14px 16px;min-width:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
  .vor:hover{border-color:var(--akzent)}
  .vor h3{margin:0 0 2px;font-size:16px;display:flex;align-items:baseline;gap:8px}
  .vor .zeile{font-size:13.5px;color:var(--grau,#71768a);margin:0 0 8px;line-height:1.45}
  .vor .zeile b{color:var(--ink);font-weight:700}
  .vor .runde{display:flex;gap:8px;align-items:baseline;font-size:13px;
              padding:4px 0;border-top:1px solid var(--linie,#eef0f5);min-width:0}
  .vor .runde .uhr{color:var(--grau,#71768a);white-space:nowrap;font-variant-numeric:tabular-nums}
  .vor .runde .was{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vor .runde .erg{white-space:nowrap;font-weight:700}
  .vor .mehr{font-size:12.5px;color:var(--grau,#71768a);padding-top:6px}
  /* Der wichtige Fall: da gewesen, aber nichts abgeschlossen. */
  .vor.nurda{border-left:4px solid #f59e0b}
  .vor.garnicht{opacity:.72}

  .reiter{display:flex;gap:10px;margin-bottom:20px}
  .reiter button{
    flex:1 1 0;min-width:0;min-height:52px;
    border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:10px 12px;
    font-family:var(--rund);font-size:17px;font-weight:700;color:var(--muted);cursor:pointer;
  }
  .reiter button.an{border-color:var(--akzent);color:var(--ink);background:#eef1f6}
  .karte{background:var(--karte);border:1px solid var(--line);border-radius:16px;
         padding:18px 20px;margin-bottom:16px}
  .karte h2{font-family:var(--rund);font-size:17px;margin:0 0 4px}
  .karte .unter{color:var(--muted);font-size:13.5px;margin:0 0 14px}
  .knopf-link{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;
              border:1.5px solid var(--line);background:#fff;border-radius:11px;
              text-decoration:none;color:var(--ink);font:600 15px/1 var(--rund)}
  .karte table.termine{width:100%;border-collapse:collapse}
  .karte table.termine td{padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
  .karte table.termine tr:last-child td{border-bottom:none}
  .karte table.termine td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}

  /* Anwesenheitsband (19.09.2026): eine Spur aus 96 Viertelstunden je Tag.
     Die Stuecke duerfen beliebig schmal werden - sie sind reine Anzeige und
     kein Tippziel, das 44 px braeuchte. Die Zeile selbst darf nicht seitlich
     herauslaufen, darum minmax(0,1fr) statt 1fr: Eine Grid-Spalte ist sonst so
     breit wie ihr breitester Inhalt, und genau daran ist Pauls Spieleliste
     schon einmal aus dem Rand gelaufen. */
  .heute-karte h2{margin-bottom:10px}
  .heute-zeile{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:8px 0;
    border-top:1px solid var(--line);font-size:14.5px}
  .heute-zeile:first-of-type{border-top:none}
  .heute-zeile b{font-family:var(--rund);min-width:64px}
  .heute-zeile.war-da span{color:#15803d;font-weight:600}
  .heute-zeile.war-nicht span{color:var(--muted)}
  .heute-zeile .luecke{color:#b45309;font-weight:600;font-size:13px}
  .bandliste{display:flex;flex-direction:column;gap:5px;margin-top:4px}
  .tagzeile{display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:8px}
  .tagname{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .tagzeit{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .tagwerte{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .tagwerte b{font-family:var(--rund);font-size:15px}
  .tagje{display:block;color:var(--muted);font-size:12px;margin-top:1px}
  .tagje .probe{margin:0 3px 0 9px}
  .tagje .probe:first-child{margin-left:0}
  .tagspanne{grid-column:2/-1;margin:1px 0 9px 70px;color:var(--muted);font-size:12px;
             font-variant-numeric:tabular-nums}
  .band{display:flex;gap:1px;min-width:0;height:13px;background:#f1f4f8;
        border-radius:4px;overflow:hidden;padding:2px}
  .band .stueck{flex:1 1 0;min-width:0;border-radius:1px;background:transparent}
  .band .stueck.lern{background:#2563eb}
  .band .stueck.duell{background:#f59e0b}
  .band .stueck.beides{background:#12a35f}
  .probe{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px}
  .probe.lern{background:#2563eb}
  .probe.duell{background:#f59e0b}
  .probe.beides{background:#12a35f}
  .fussliste{margin:8px 0 0;padding-left:17px;color:var(--muted);font-size:12.5px;line-height:1.5}
  .fussliste li{margin-bottom:2px}
  .fussliste b{color:var(--ink);font-weight:600}
  @media (max-width:430px){
    .tagzeile{grid-template-columns:52px minmax(0,1fr)}
    .tagzeit{grid-column:2;justify-self:end}
    .tagwerte{grid-column:1/-1;text-align:left;margin-top:2px}
    .tagje{display:inline;margin-left:8px}
    .tagspanne{margin-left:0}
  }
  .zahlen{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
  .zahl{background:#f8fafc;border:1px solid var(--line);border-radius:13px;padding:13px 14px}
  .zahl .gross{font-family:var(--rund);font-size:24px;font-weight:800;line-height:1.1}
  .zahl .klein{color:var(--muted);font-size:12.5px;margin-top:3px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:12.5px;
     text-transform:uppercase;letter-spacing:.04em;padding:0 8px 8px;border-bottom:1px solid var(--line)}
  td{padding:9px 8px;border-bottom:1px solid #f1f3f7;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .balken{height:7px;background:#eef1f6;border-radius:99px;overflow:hidden;min-width:70px}
  .balken i{display:block;height:100%;border-radius:99px}
  .q{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
  .gut{color:var(--gut)} .mittel{color:var(--mittel)} .schlecht{color:var(--schlecht)}
  .b-gut{background:var(--gut)} .b-mittel{background:var(--mittel)} .b-schlecht{background:var(--schlecht)}
  .hinweis{background:#fff8ec;border:1px solid #f5e2bf;border-radius:13px;padding:14px 16px;
           font-size:14.5px;line-height:1.55}
  .hinweis b{color:#8a5a10}

  /* --- Tag, Woche, Jahreszeit --- */
  .zeitraeume{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px;}
  .zr{border:1px solid var(--line); border-radius:12px; padding:13px 15px; background:var(--bg);}
  .zr h3{margin:0 0 9px; font-size:15px; font-weight:700;}
  .zr h3 .kw{color:var(--muted); font-weight:600; font-size:12.5px;}
  .zr-zeile{display:flex; justify-content:space-between; gap:10px; padding:3px 0; font-size:13.5px;}
  .zr-zeile span{color:var(--muted);}
  .zr-davor{margin-top:9px; padding-top:8px; border-top:1px solid var(--line);
    color:var(--muted); font-size:12.5px;}

  /* --- Wortschatz --- */
  .vorrat{margin:0 0 14px;}
  .vorrat:last-child{margin-bottom:0;}
  .vorrat-kopf{display:flex; justify-content:space-between; gap:10px; font-size:13.5px; margin-bottom:6px;}
  .vorrat-kopf span{color:var(--muted);}
  .balken{height:9px; background:var(--bg); border:1px solid var(--line);
    border-radius:999px; overflow:hidden;}
  .balken i{display:block; height:100%; background:var(--gut); border-radius:999px;}

  /* --- Zuletzt gespielt --- */
  .nebenzeile{color:var(--muted); font-size:12px; margin-top:2px;}
  .marke{display:inline-block; margin-left:7px; padding:1px 7px; border-radius:999px;
    background:var(--bg); border:1px solid var(--line);
    color:var(--muted); font-size:11.5px; font-weight:600; vertical-align:middle;}

  .leer{color:var(--muted);font-size:14px;padding:6px 0}
  .muster{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;
          background:#f5f7fa;border-radius:7px;padding:2px 7px}
  .verlauf{display:flex;align-items:flex-end;gap:7px;height:110px;margin-top:6px}
  .verlauf .w{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:26px}
  .verlauf .saeule{width:100%;background:var(--leon);border-radius:5px 5px 0 0;min-height:3px}
  .verlauf .wert{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .verlauf .datum{font-size:10.5px;color:var(--muted);white-space:nowrap}
  .anmeldung{max-width:380px;margin:60px auto;text-align:center}
  .anmeldung input{width:100%;max-width:210px;margin:18px auto 0;display:block;text-align:center;
    font-family:var(--rund);font-size:30px;letter-spacing:.2em;padding:14px 12px;
    border:2px solid var(--line);border-radius:14px;background:#fff}
  .anmeldung button{width:100%;margin-top:12px;border:none;border-radius:14px;padding:15px;
    background:var(--akzent);color:#fff;font-family:var(--rund);font-size:17px;font-weight:700;cursor:pointer}
  .fehler{color:var(--schlecht);font-size:14px;min-height:20px;margin-top:10px}
  .meldung{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:11px;background:#fff}
  .meldung.problem{border-left:4px solid var(--schlecht)}
  .meldung.wunsch{border-left:4px solid #6366f1}
  .meldung .kopf{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px}
  .meldung .wer{font-family:var(--rund);font-weight:700}
  .meldung .wann{color:var(--muted);font-size:12.5px}
  .meldung .wo{color:var(--muted);font-size:12.5px;margin-left:auto}
  .meldung .was{font-size:15px;line-height:1.55;white-space:pre-line}
  /* Screenshots vom iPad sind hoch und schmal - ohne Deckel füllt einer die
     ganze Seite. Angetippt geht er in voller Größe auf. */
  .meldung img{max-width:100%;max-height:260px;width:auto;object-fit:contain;
               border-radius:10px;border:1px solid var(--line);margin-top:10px;
               display:block;cursor:zoom-in;background:#f8fafc}
  .meldung img.gross{max-height:none}
  .meldung .lupe{font-size:12px;color:var(--muted);margin-top:5px}
  .meldung{position:relative}
  /* Das X sitzt oben rechts in jeder Meldung. */
  .meldung .weg{position:absolute;top:9px;right:9px;width:32px;height:32px;
                border:none;background:transparent;color:#b6bec6;border-radius:9px;
                font-size:19px;line-height:1;cursor:pointer;padding:0;
                display:grid;place-items:center;transition:background .12s,color .12s}
  .meldung .weg:hover{background:#ffe9e9;color:var(--schlecht)}
  .meldung .kopf{padding-right:36px}
  /* Kurz Zeit zum Zurücknehmen, falls man danebentippt. */
  .rueckgaengig{display:flex;align-items:center;gap:12px;background:#eef1f6;
                border:1px solid var(--line);border-radius:13px;padding:11px 14px;margin-bottom:11px;
                font-size:14px;color:var(--muted)}
  .rueckgaengig button{margin-left:auto;border:none;background:var(--akzent);color:#fff;
                       border-radius:9px;padding:7px 13px;font-size:13.5px;cursor:pointer}
  .verborgen{display:none !important}
  @media(max-width:560px){ td,th{padding-left:4px;padding-right:4px} .balken{display:none} }
  /* Noten (21.09.2026). Denny: "Beim Lernstand sollen auch bitte noch der
     aktuelle Notenschluessel der Faecher zu sehen sein." Variante C aus den
     drei Entwuerfen: Tabelle mit farbigen Chips. */
  .ntab{width:100%;border-collapse:collapse}
  .ntab th{text-align:left;font:700 11.5px/1.3 var(--rund);color:var(--muted);
           text-transform:uppercase;letter-spacing:.04em;padding:0 8px 8px}
  .ntab td{padding:11px 8px;border-top:1px solid var(--line);vertical-align:middle}
  .ntab .z{text-align:right;white-space:nowrap}
  .ntab .kl{color:var(--muted);font-size:13px}
  .chip{display:inline-block;min-width:26px;padding:3px 7px;border-radius:8px;
        color:#fff;font:800 13px/1.35 var(--rund);text-align:center;margin:2px 3px 2px 0}
  .chip em{font-style:normal;font-size:9.5px;opacity:.85;margin-left:1px}
  .chip.unsicher{box-shadow:inset 0 0 0 2px #fff, 0 0 0 2px #e05252}
  .nschnitt{font-family:var(--rund);font-size:19px;font-weight:800}
  .ntoepfe{display:block;color:var(--muted);font-size:11.5px;font-weight:600;margin-top:1px}
  .nhoch{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .nhoch button{min-height:44px;border:1.5px solid var(--line);background:#fff;border-radius:11px;
                padding:0 15px;font:600 14.5px/1 var(--rund);color:var(--ink);cursor:pointer}
  .nhoch button.haupt{background:var(--akzent);border-color:var(--akzent);color:#fff}
  .nvorschlag{border:1px solid #f0dca8;background:#fff8e6;border-radius:12px;padding:12px 14px;margin-top:12px}
  .nvorschlag ul{margin:8px 0 10px;padding-left:18px;font-size:14px}
  .nzeile{display:flex;align-items:center;justify-content:space-between;gap:12px;
          padding:9px 0;border-top:1px solid var(--line);font-size:14px}
  .nzeile button{min-height:44px;padding:0 14px;border:1.5px solid var(--line);background:#fff;
                 border-radius:10px;font:600 14px/1 var(--rund);color:#b91c1c;cursor:pointer}
  .nvorschlag li{margin-bottom:3px}
</style>
</head>
<body>
<div class="huelle">

  <div id="sicht-anmelden" class="anmeldung verborgen">
    <h1>Lernstand</h1>
    <p class="stand">Hier siehst du, wie es Paul und Leon beim Lernen geht.</p>
    <input id="code" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="Code">
    <div class="fehler" id="codefehler"></div>
    <button id="anmelden">Ansehen</button>
  </div>

  <div id="sicht-daten" class="verborgen">
    <header>
      <h1>Lernstand</h1>
      <span class="stand" id="stand"></span>
    </header>
    <!-- Reihenfolge: erst die drei Reiter, dann "Wer war heute da?". Die Karte
         zeigt ALLE drei Kinder und haengt nicht am gewaehlten Reiter - sie
         bleibt deshalb stehen, egal wen man antippt. Denny am 21.09.2026,
         zweiter Anlauf: "Das wuerde ich gerne unter den drei Buttons schon
         gerne noch sehen." -->
    <div class="reiter" id="reiter"></div>
    <div id="vorschauen"></div>
    <div id="heute"></div>
    <div id="inhalt"></div>
    <!-- Die Meldungen der Kinder stehen UNTER der Auswertung. Oben schoben 18
         Einträge alles andere aus dem Bild - Denny am 21.09.2026 mit Screenshot:
         "Das soll bitte nach unten." -->
    <div id="meldungen"></div>
  </div>

</div>
<script>
(function(){
  "use strict";
  function $(id){ return document.getElementById(id); }
  function esc(t){ var d=document.createElement("div"); d.textContent=(t==null?"":String(t)); return d.innerHTML; }

  var DATEN = null, KIND = null, GEHOLT_UM = null;
  var FARBEN = {paul:"var(--paul)", leon:"var(--leon)", helena:"var(--helena)"};

  function stufe(q){ return q >= 85 ? "gut" : q >= 65 ? "mittel" : "schlecht"; }

  function zeige(welche){
    $("sicht-anmelden").classList.toggle("verborgen", welche !== "anmelden");
    $("sicht-daten").classList.toggle("verborgen", welche !== "daten");
  }

  function laden(){
    fetch("/api/statistik", {credentials:"same-origin"})
      .then(function(r){ return r.json().then(function(j){ return {status:r.status, j:j}; }); })
      .then(function(a){
        if (a.status === 401){ zeige("anmelden"); $("code").focus(); return; }
        if (!a.j || !a.j.ok){ zeige("anmelden"); $("codefehler").textContent = (a.j&&a.j.fehler)||"Das ging nicht."; return; }
        DATEN = a.j.kinder || {};
        GEHOLT_UM = new Date();
        zeige("daten");
        meldungenLaden();
        anwesenheitLaden();
        notenLaden();
        reiterMalen();
        vorschauenMalen();
        heuteMalen();
      })
      .catch(function(){ zeige("anmelden"); });
  }

  function anmelden(){
    var code = $("code").value.trim();
    if (!code){ $("codefehler").textContent = "Bitte den Code eingeben."; return; }
    $("anmelden").disabled = true; $("codefehler").textContent = "";
    fetch("/api/code-pruefen?kind=eltern", {
      method:"POST", credentials:"same-origin", headers:{"content-type":"application/json"},
      body: JSON.stringify({code: code, kind: "eltern"})
    })
    .then(function(r){ return r.json(); })
    .then(function(j){
      $("anmelden").disabled = false;
      if (j && j.ok){ $("code").value=""; laden(); return; }
      $("code").value=""; $("code").focus();
      $("codefehler").textContent = (j && j.fehler) || "Das hat nicht geklappt.";
    })
    .catch(function(){ $("anmelden").disabled=false; $("codefehler").textContent="Server nicht erreichbar."; });
  }
  $("anmelden").addEventListener("click", anmelden);
  $("code").addEventListener("keydown", function(e){ if(e.key==="Enter") anmelden(); });

  // Was die Kinder selbst gemeldet haben. Steht ganz oben - eine Meldung
  // von Paul ist wertvoller als jede Statistik: Er sieht Dinge, die im
  // Code nicht auffallen.
  function meldungenLaden(){
    fetch("/api/melden", {credentials:"same-origin"})
      .then(function(r){ return r.json(); })
      .then(function(j){ if (j && j.ok){ ALLE_MELDUNGEN = j.meldungen || []; meldungenMalen(); } })
      .catch(function(){});
  }

  /* Je Reiter nur das eine Kind. Denny am 21.09.2026: "getrennt haben in den
     Reitern ... Paul: seine Informationen, Leon: seine Informationen, Helena:
     ihre Informationen." Vorher standen alle Meldungen gemischt in einer Liste -
     bei 18 Eintraegen von Helena fand man Pauls drei nicht mehr. Einzige
     Ausnahme bleibt "Wer war heute da?" ganz oben: Die Karte soll ausdruecklich
     alle drei auf einen Blick zeigen. */
  var ALLE_MELDUNGEN = [];

  function meldungenMalen(){
    var kasten = $("meldungen");
    if (!KIND){ kasten.innerHTML = ""; return; }
    var liste = ALLE_MELDUNGEN.filter(function(m){ return m.kind === KIND; });
    if (!liste.length){ kasten.innerHTML = ""; return; }
    var wer = esc(kindName(KIND));
    var h = '<div class="karte"><h2>Gemeldet von ' + wer + ' (' + liste.length + ')</h2>' +
            '<p class="unter">Direkt aus dem Spiel geschickt.</p><div id="meldeliste"></div></div>';
    kasten.innerHTML = h;
    var ziel = $("meldeliste");
    liste.forEach(function(m){
      var d = document.createElement("div");
      d.className = "meldung " + (m.art === "wunsch" ? "wunsch" : "problem");
      d.innerHTML =
        '<div class="kopf">' +
          '<span class="wer">' + (m.art === "wunsch" ? "\u2728 " : "\u{1F41B} ") + esc(kindName(m.kind)) + '</span>' +
          '<span class="wann">' + esc(wann(m.zeit)) + '</span>' +
          '<span class="wo">' + esc(m.titel || m.wo || "") + (m.geraet ? " \u00B7 " + esc(m.geraet) : "") + '</span>' +
        '</div>' +
        '<div class="was"></div>' +
        (m.hatBild ? '<img data-bild="' + esc(m.id) + '" alt="Bild zur Meldung">' +
                     '<div class="lupe">Bild antippen zum Vergrößern</div>' : '') +
        '<button class="weg" data-weg="' + esc(m.id) + '" title="Wegräumen" aria-label="Meldung wegräumen">✕</button>';
      d.querySelector(".was").textContent = m.text || "(nur ein Bild)";
      ziel.appendChild(d);

      if (m.hatBild){
        fetch("/api/melden?bild=" + encodeURIComponent(m.id), {credentials:"same-origin"})
          .then(function(r){ return r.json(); })
          .then(function(j){ if (j && j.ok && j.bild){ var i = d.querySelector("img"); if (i) i.src = j.bild; } })
          .catch(function(){});
      }
      var bild = d.querySelector("img");
      if (bild) bild.addEventListener("click", function(){ bild.classList.toggle("gross"); });

      d.querySelector(".weg").addEventListener("click", function(){
        wegraeumen(d, m);
      });
    });
  }

  // Erst ausblenden, dann nach kurzer Frist wirklich löschen - wer daneben
  // tippt, holt die Meldung samt Bild zurück.
  var offeneLoeschungen = {};
  function wegraeumen(karte, m){
    karte.style.display = "none";
    var leiste = document.createElement("div");
    leiste.className = "rueckgaengig";
    leiste.innerHTML = '<span></span><button type="button">Rückgängig</button>';
    leiste.querySelector("span").textContent = "Meldung von " + kindName(m.kind) + " weggeräumt.";
    karte.parentNode.insertBefore(leiste, karte);

    var timer = setTimeout(function(){
      delete offeneLoeschungen[m.id];
      leiste.remove();
      fetch("/api/melden?id=" + encodeURIComponent(m.id), {method:"DELETE", credentials:"same-origin"})
        .then(function(){ meldungenLaden(); }).catch(function(){});
    }, 7000);
    offeneLoeschungen[m.id] = timer;

    leiste.querySelector("button").addEventListener("click", function(){
      clearTimeout(timer);
      delete offeneLoeschungen[m.id];
      leiste.remove();
      karte.style.display = "";
    });
  }

  function kindName(k){ return k ? k.charAt(0).toUpperCase()+k.slice(1) : "Jemand"; }

  function reiterMalen(){
    /* Jedes Kind bekommt einen Reiter - auch eines ohne Runden.
       Bis zum 19.09.2026 stand hier ein Filter auf .runden, und damit war ein
       Kind ohne Runden ueberhaupt nicht anklickbar, solange ein anderes welche
       hatte. Genau Helenas Lage an dem Tag: Denny fragte "War Helena nicht ein
       einziges Mal da?" - und haette im Elternbereich nicht einmal auf sie
       klicken koennen, um nachzusehen. Ein Kind verschwinden zu lassen, weil
       es nichts gespielt hat, verbirgt ausgerechnet die Auskunft, die dann
       gebraucht wird. */
    var namen = Object.keys(DATEN);
    var kasten = $("reiter"); kasten.innerHTML = "";
    namen.forEach(function(k){
      var b = document.createElement("button");
      b.textContent = k.charAt(0).toUpperCase()+k.slice(1) +
                      (DATEN[k] && DATEN[k].runden ? " (" + DATEN[k].runden + ")" : "");
      b.addEventListener("click", function(){ KIND = k; reiterMalen(); vorschauenMalen(); heuteMalen(); malen(); meldungenMalen(); });
      if (k === KIND) b.classList.add("an");
      kasten.appendChild(b);
    });
    /* KEINE Vorauswahl. Denny am 21.09.2026: "Ich moechte aber, dass weder
       Paul, Leon noch Helena ... direkt angezeigt werden, sondern erst, wenn
       ich es anklicke." Oben steht ohnehin, wer heute da war - das reicht als
       Einstieg. */
    /* Ohne Auswahl bleibt es leer. Eine Karte "Wen moechtest du ansehen?" stand
       hier bis zum 21.09.2026 - Denny: "Dies kann ersatzlos gestrichen werden."
       Die drei Reiter darueber sagen von selbst, was zu tun ist. */
    if (!KIND){
      $("inhalt").innerHTML = "";
      $("meldungen").innerHTML = "";
    }
  }

  /* ---------- War das Kind überhaupt da? ----------
     Denny am 19.09.2026: "War Helena nicht ein einziges Mal da - kannst Du das
     sicher sagen?" Konnte ich nicht. Die Lernrunden haben drei Lücken: Besuche
     unter 30 Sekunden werden verworfen, das Quizduell zählt bewusst nicht mit,
     und Helenas Trainer schickt Runden vom Handy erst später nach.

     Diese Karte beantwortet deshalb nur die eine Frage - war jemand da - und
     sagt ausdrücklich NICHT, dass gelernt wurde. Dagesessen ist nicht gelernt. */
  var ANWESEND = null, ANWESEND_FEHLER = null;

  /* Ein Ausfall darf NICHT verschluckt werden.
     Die erste Fassung fing jeden Fehler still ab - die Karte verschwand dann
     spurlos, und übrig blieb genau das Bild vom 19.09.2026: "Noch nichts
     gespielt" und sonst nichts. Wer dann fragt "war sie da?", bekommt wieder
     keine Antwort und merkt nicht einmal, dass er keine bekommen hat
     (Prüfrunde 01). */
  /* Kommt die Seite nach laengerer Zeit wieder in den Blick, sind die Zahlen
     womoeglich Stunden alt. Dann neu holen - aber nur, wenn wirklich Zeit
     vergangen ist, damit kein Tabwechsel eine Abfragewelle ausloest. */
  var LAEUFT = false;
  document.addEventListener("visibilitychange", function(){
    if (document.hidden || !GEHOLT_UM || LAEUFT) return;
    if (Date.now() - GEHOLT_UM.getTime() < 300000) return;   // unter 5 Minuten: lassen
    /* Ein Riegel gegen mehrfaches Laden: Ohne ihn kann jedes Hin- und
       Herschalten eine weitere Abfrage anstossen, und ein Netzaussetzer
       waehrenddessen wirft auf die Anmeldemaske zurueck (Pruefrunde 05). */
    LAEUFT = true;
    try { laden(); } finally { setTimeout(function(){ LAEUFT = false; }, 3000); }
  });

  /* "Wer war heute da?" gehoert zu ALLEN Kindern und darf deshalb nicht in
     malen() stehen - das steigt seit dem 21.09.2026 sofort aus, wenn noch kein
     Reiter angetippt wurde. Genau so war die Karte beim Start unsichtbar, und
     die Messung hat es nicht gesehen, weil sie vorher immer einen Reiter
     anklickt (Denny: "Wer war heute da? Ist noch nicht zu sehen"). */
  /* ---------- Die drei Vorschauen ----------
     Was hat jedes Kind HEUTE gespielt, und wie ist es ausgegangen?

     Der Anlass war ein scheinbarer Widerspruch (Denny, 21.09.2026): Das
     Anwesenheitsband sagte "Paul heute da: 16:15-16:30, 15 Minuten", die
     Statistik sagte "Noch nichts gespielt". Beides stimmte - die eine Zahl
     kommt aus dem Puls, die andere aus abgeschlossenen Runden. Eine Runde
     wird erst gemeldet, wenn sie mindestens 30 aktive Sekunden hatte UND die
     Seite verlassen oder in den Hintergrund geschickt wurde (lernstand.js,
     senden()). Wer eine Seite offen liegen lässt, ist anwesend, ohne dass je
     eine Runde ankommt.

     Darum nennt diese Karte beides nebeneinander und sagt den Unterschied
     dazu, statt "nichts gespielt" zu behaupten. */
  function heuteRunden(kind){
    var d = DATEN && DATEN[kind];
    if (!d || !d.letzte) return [];
    var heute = (ANWESEND && ANWESEND.heute) || new Date().toLocaleDateString("sv-SE");
    return d.letzte.filter(function(r){
      // Der Zeitstempel steht in UTC - verglichen wird der ORTSTAG, sonst
      // fallen die Abendrunden auf den nächsten Tag.
      var t = new Date(r.zeit);
      return !isNaN(t) && t.toLocaleDateString("sv-SE") === heute;
    });
  }

  function anwesendHeute(kind){
    if (!ANWESEND || !ANWESEND.kinder) return null;
    var a = ANWESEND.kinder[kind];
    if (!a) return null;
    var t = (a.tage || []).filter(function(x){ return x.tag === ANWESEND.heute; })[0];
    return t || null;
  }

  function vorschauKarte(kind){
    var name = kind.charAt(0).toUpperCase() + kind.slice(1);
    var d = (DATEN && DATEN[kind]) || {};
    var tag = (d.zeitraeume && d.zeitraeume.tag) || {};
    var runden = heuteRunden(kind);
    var da = anwesendHeute(kind);
    var klasse = "vor", zeile, liste = "";

    if (runden.length || tag.runden){
      var quote = tag.aufgaben ? tag.quote + " % richtig" : "ohne Aufgaben";
      zeile = "<b>" + (tag.minuten || 0) + " min</b> gelernt \u00B7 " +
              (tag.aufgaben || 0) + " Aufgaben \u00B7 " + esc(quote);
      liste = runden.slice(0, 3).map(function(r){
        var t = new Date(r.zeit);
        var uhr = isNaN(t) ? "" : String(t.getHours()).padStart(2,"0") + ":" +
                                  String(t.getMinutes()).padStart(2,"0");
        var erg = r.aufgaben ? (r.richtig + "/" + r.aufgaben) : "\u2013";
        return '<div class="runde"><span class="uhr">' + uhr + '</span>' +
               '<span class="was">' + esc(r.titel || r.thema || "Runde") + '</span>' +
               '<span class="erg">' + erg + '</span></div>';
      }).join("");
      if (runden.length > 3)
        liste += '<div class="mehr">und ' + (runden.length - 3) + ' weitere</div>';
    } else if (da){
      // Der wichtige Fall - und der Grund fuer diese Karte.
      klasse += " nurda";
      // anwesendMinuten() haengt "min" schon an - ein zweites waere doppelt.
      zeile = "<b>" + anwesendMinuten(da.viertelstunden) + " da</b> (" +
              esc(da.von) + "\u2013" + esc(da.bis) + "), aber keine Runde beendet";
      liste = '<div class="mehr">Eine Runde z\u00E4hlt erst ab einer halben Minute ' +
              'und wird beim Verlassen der Seite gemeldet.</div>';
    } else {
      klasse += " garnicht";
      zeile = "heute noch nicht da";
      if (ANWESEND_FEHLER) zeile = "<b>unsicher</b> \u2013 der Speicher hat nicht geantwortet";
      else if (da === null && ANWESEND && ANWESEND.kinder && ANWESEND.kinder[kind] &&
               ANWESEND.kinder[kind].unsicher)
        zeile = "<b>unsicher</b> \u2013 der Speicher hat nicht vollst\u00E4ndig geantwortet";
    }
    return '<button class="' + klasse + '" data-kind="' + esc(kind) + '">' +
           "<h3>" + esc(name) + "</h3>" +
           '<p class="zeile">' + zeile + "</p>" + liste + "</button>";
  }

  function vorschauenMalen(){
    var kasten = $("vorschauen");
    if (!kasten) return;
    if (!DATEN){ kasten.innerHTML = ""; return; }
    // Ist ein Kind gewaehlt, steht nur dessen Vorschau da - darunter folgt
    // ohnehin sein eigenes Anwesenheitsband ("War Paul da?").
    var welche = KIND ? [KIND] : ["paul","leon","helena"];
    kasten.innerHTML = '<div class="vorschauen">' +
      welche.filter(function(k){ return DATEN[k] || (ANWESEND && ANWESEND.kinder && ANWESEND.kinder[k]); })
            .map(vorschauKarte).join("") + "</div>";
    Array.prototype.forEach.call(kasten.querySelectorAll(".vor"), function(b){
      b.addEventListener("click", function(){
        KIND = b.getAttribute("data-kind");
        reiterMalen(); vorschauenMalen(); heuteMalen(); malen(); meldungenMalen();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
  }

  function heuteMalen(){
    var kasten = $("heute");
    if (!kasten) return;
    /* Nur solange kein Kind gewaehlt ist. Denny am 21.09.2026: "Wenn ich bei
       den Kindern drin bin, brauche ich es natuerlich nicht mehr, weil ich es
       schon auf der Startseite hatte." Beim Kind steht ohnehin sein eigenes
       Anwesenheitsband. */
    kasten.innerHTML = KIND ? "" : anwesenheitUeberblick();
  }

  function anwesenheitLaden(){
    ANWESEND_FEHLER = null;
    fetch("/api/anwesend?tage=14", {credentials:"same-origin"})
      .then(function(r){
        return r.json().catch(function(){ return null; }).then(function(j){
          if (r.status === 401) throw new Error("Die Anmeldung reicht dafür nicht.");
          if (!j || !j.ok) throw new Error((j && j.fehler) || "Der Server hat nicht geantwortet.");
          return j;
        });
      })
      .then(function(j){ ANWESEND = j; })
      .catch(function(e){ ANWESEND_FEHLER = e.message || "Das ging nicht."; })
      .then(function(){
        if ($("sicht-daten").classList.contains("verborgen")) return;
        vorschauenMalen();
        heuteMalen();
        malen();
      });
  }

  function tagName(iso){
    var d = new Date(iso + "T12:00:00");
    if (isNaN(d)) return iso;
    var heute = ANWESEND && ANWESEND.heute;
    if (iso === heute) return "heute";
    return ["So","Mo","Di","Mi","Do","Fr","Sa"][d.getDay()] + " " +
           String(d.getDate()).padStart(2,"0") + "." + String(d.getMonth()+1).padStart(2,"0") + ".";
  }

  // 96 Viertelstunden als schmale Spur. Zwei Farben, damit man sieht, was
  // Lernwelt war und was Quizduell - das Duell taucht sonst nirgends auf.
  function bandMalen(tag){
    var s = "";
    for (var i = 0; i < 96; i++){
      /* Drei Zustaende statt zwei: War jemand in derselben Viertelstunde in
         beidem, hiess das Stueck bisher "duell" - und die Minuten sahen aus,
         als muessten sie sich addieren. Paul war am 20.09.2026 195 Minuten in
         der Lernwelt und 75 im Quizduell, zusammen aber 210: in 60 Minuten war
         er in beidem. Genau das zeigt die dritte Farbe. */
      var imDuell = tag.duell.indexOf(i) >= 0;
      var imLern = tag.lernwelt.indexOf(i) >= 0;
      var art = (imDuell && imLern) ? " beides" : (imDuell ? " duell" : (imLern ? " lern" : ""));
      s += '<i class="stueck' + art + '"></i>';
    }
    return '<div class="band" aria-hidden="true">' + s + '</div>';
  }

  /* Minuten statt Viertelstunden. Denny am 21.09.2026: "sodass man sehen
     wuerde, wie viel Zeit derjenige in der Lernwelt verbracht hat ... Ich
     glaube, Minutenangaben wuerden reichen." Eine Viertelstunde, in der
     mindestens ein Puls ankam, zaehlt als 15 Minuten Anwesenheit - das ist
     weiterhin KEINE Lernzeit. */
  /* NICHT "minuten" nennen: Diese Datei hat weiter unten schon ein minuten(m),
     das Minuten formatiert ("3 h 30 min") und zur Lernzeit gehoert. Die
     spaetere Deklaration gewinnt - am 21.09.2026 stand deshalb "6 min" am
     Band statt "90 min". Heute der dritte Namensdoppelgaenger an einem Tag. */
  function anwesendMinuten(bloecke){ return bloecke * 15 + " min"; }

  /* Alle drei Kinder auf einen Blick, ueber den Reitern.
     Dennys freigegebener Wortlaut: "Im Elternbereich eine Zeile 'zuletzt
     gesehen' JE KIND … damit beantwortet sich 'war Helena heute da?' in zwei
     Sekunden." Die Karte weiter unten zeigt immer nur das gewaehlte Kind - man
     haette also erst auf Helenas Reiter tippen muessen, um ihre Antwort zu
     sehen. Die zwei Sekunden gab es damit nur im Terminal (Pruefrunde 04). */
  function anwesenheitUeberblick(){
    /* Bei einem Ausfall darf der Überblick nicht spurlos verschwinden - das
       war der schwerste Fund aus Runde 01, hier stand er wieder drin
       (Prüfrunde 05). */
    if (ANWESEND_FEHLER)
      return '<div class="karte heute-karte"><h2>Wer war heute da?</h2>' +
        '<p class="unter"><b>Das lässt sich gerade nicht sagen.</b> ' + esc(ANWESEND_FEHLER) +
        '<br>Das heißt <b>nicht</b>, dass niemand da war.</p></div>';
    if (!ANWESEND) return "";
    var reihen = Object.keys(ANWESEND.kinder || {}).map(function(k){
      var a = ANWESEND.kinder[k] || {};
      var heute = (a.tage || []).filter(function(t){ return t.tag === ANWESEND.heute; })[0];
      var text, klasse;
      if (heute){
        klasse = "war-da";
        text = heute.von + "\u2013" + heute.bis + " \u00B7 " + heute.viertelstunden +
               " Viertelstunde" + (heute.viertelstunden === 1 ? "" : "n") +
               // Wie in der Karte darunter: eine Spanne mit Lücken darf nicht
               // wie durchgehende Zeit aussehen (Prüfrunde 05).
               (heute.amStueck === false ? " \u00B7 mit Pausen" : "") +
               (heute.nurDuell ? " \u00B7 nur Quizduell" : "");
      } else if (a.zuletzt){
        klasse = "war-nicht";
        text = "heute noch nicht \u00B7 zuletzt " + tagName(a.zuletzt.tag) + ", " + a.zuletzt.uhrzeit + " Uhr";
      } else {
        klasse = "war-nicht";
        text = "keine Spur in den letzten 14 Tagen";
      }
      return '<div class="heute-zeile ' + klasse + '"><b>' + esc(k.charAt(0).toUpperCase() + k.slice(1)) +
             '</b><span>' + esc(text) + '</span>' +
             (a.unsicher ? '<span class="luecke">Speicher hat nicht geantwortet</span>' : '') + '</div>';
    }).join("");
    return '<div class="karte heute-karte"><h2>Wer war heute da?</h2>' + reihen +
           '<p class="unter" style="margin:10px 0 0">Das ist <b>keine Lernzeit</b> \u2013 nur, ob jemand da war.</p></div>';
  }

  /* ---------- Der Zeitstrahl eines Tages ----------
     6 bis 22 Uhr. Was ausserhalb liegt, wird an den Rand gedrueckt - lieber
     abgeschnitten als den ganzen Tag zusammenstauchen, damit die ueblichen
     Stunden lesbar bleiben. */
  var STRAHL_VON = 6 * 60, STRAHL_BIS = 22 * 60;

  function inMinuten(hhmm){
    var t = String(hhmm || "").split(":");
    return (Number(t[0]) || 0) * 60 + (Number(t[1]) || 0);
  }
  function anteil(hhmm){
    var m = inMinuten(hhmm);
    return Math.max(0, Math.min(100, (m - STRAHL_VON) / (STRAHL_BIS - STRAHL_VON) * 100));
  }

  /* Was lief in dieser Viertelstunde? Kommt seit dem 21.09.2026 vom Puls mit
     (t.wo). Fehlt es - alte Tage, Quizduell, Ausfall -, steht hier nichts;
     erfunden wird nichts. */
  function tatZeilen(t, runden){
    var raus = [];
    if (runden && runden.length){
      runden.slice(0, 4).forEach(function(r){
        var d = new Date(r.zeit);
        var uhr = isNaN(d) ? "" : ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2);
        raus.push(uhr + " · <b>" + esc(r.titel || r.thema || "Runde") + "</b>" +
                  (r.aufgaben ? ' <span class="erg">' + r.richtig + "/" + r.aufgaben + "</span>" : ""));
      });
    }
    if (!raus.length && t.wo && Object.keys(t.wo).length){
      // Keine Runde, aber der Puls weiss, welche Seite offen war.
      var bloecke = Object.keys(t.wo).map(Number).sort(function(x,y){ return x-y; });
      var gesehen = {};
      bloecke.forEach(function(b){
        var s = (t.wo[String(b)] || {}).seite;
        if (!s || gesehen[s]) return;
        gesehen[s] = 1;
        if (raus.length < 3) raus.push(blockZeit(b) + " · <b>" + esc(seiteName(s)) + "</b>");
      });
    }
    if (!raus.length)
      return '<div class="strahltat">Keine Runde beendet – entweder nur geschaut, ' +
             'oder die Seite blieb offen liegen.</div>';
    return '<div class="strahltat">' + raus.join("<br>") + "</div>";
  }

  function blockZeit(b){
    var m = b * 15;
    return Math.floor(m / 60) + ":" + ("0" + (m % 60)).slice(-2);
  }

  /* Aus "klasse7-englisch-holiday-report" wird "Englisch: Holiday Report".
     Der Dateiname ist stabil und kurz - lesbar machen ist Sache der Anzeige. */
  function seiteName(s){
    var t = String(s || "").replace(/^klasse\d+-/, "");
    var fach = t.match(/^(deutsch|englisch|franzoesisch|mathe|mathematik|hsu)-/);
    if (fach) t = t.slice(fach[0].length);
    t = t.replace(/-/g, " ");
    t = t.charAt(0).toUpperCase() + t.slice(1);
    if (!fach) return t;
    var f = fach[1].replace("franzoesisch", "Französisch").replace("mathematik", "Mathe");
    return f.charAt(0).toUpperCase() + f.slice(1) + ": " + t;
  }

  /* Welches Gerät war das? Steht bei der jüngsten Viertelstunde des Tages -
     und beantwortet die Frage, ob überhaupt das Kind davorsaß. */
  function geraetVonTag(t){
    if (!t.wo) return "";
    var bloecke = Object.keys(t.wo).map(Number).sort(function(x,y){ return y-x; });
    for (var i = 0; i < bloecke.length; i++){
      var g = (t.wo[String(bloecke[i])] || {}).geraet;
      if (g) return g;
    }
    return "";
  }

  function strahlZeile(t, runden){
    var duell = (t.duell || []).length;
    var links = anteil(t.von), rechts = anteil(t.bis);
    var breite = Math.max(1.2, rechts - links);
    var s = (DATEN && DATEN[KIND]) || {};
    // Lernzeit nur für HEUTE aus der Tagesstatistik - für ältere Tage gibt es
    // sie nicht je Tag, dann bleibt der Balken hell.
    var istHeute = ANWESEND && t.tag === ANWESEND.heute;
    var gelernt = istHeute ? (((s.zeitraeume || {}).tag || {}).minuten || 0) : 0;
    var runden2 = istHeute ? runden : [];
    var spanneMin = Math.max(1, inMinuten(t.bis) - inMinuten(t.von));
    var lernBreite = Math.max(1.0, Math.min(breite, gelernt / spanneMin * breite));
    var art = gelernt ? "lernteil" : "nixteil";

    var kopf = '<div class="strahlkopf"><b>' + esc(tagName(t.tag)) + "</b>" +
      '<span class="wann">' + esc(t.von) + "–" + esc(t.bis) + "</span>" +
      (istHeute
        ? (gelernt
            ? '<span class="gelernt">' + gelernt + " min gelernt" +
              (((s.zeitraeume || {}).tag || {}).runden
                ? " · " + ((s.zeitraeume || {}).tag || {}).runden + " Runden" : "") + "</span>"
            : '<span class="nixda">nichts beendet</span>')
        : "") +
      /* Das Quizduell taucht sonst nirgends auf - Denny wollte es am
         21.09.2026 ausdruecklich sichtbar haben ("wie viel Zeit derjenige in
         der Lernwelt verbracht hat"). Die Minuten selbst sind raus ("ohne da"),
         der Hinweis bleibt: Ohne ihn saehe ein reiner Quizabend aus wie ein
         Tag ohne jede Aktivitaet. */
      (duell ? '<span class="wann">davon Quizduell ' + anwesendMinuten(duell) + "</span>" : "") +
      (geraetVonTag(t) ? '<span class="geraet">' + esc(geraetVonTag(t)) + "</span>" : "") +
      "</div>";

    return '<div class="strahlzeile">' + kopf +
      '<div class="strahl"><span class="spanne" style="left:' + links.toFixed(1) +
      "%;width:" + breite.toFixed(1) + '%"></span>' +
      (istHeute ? '<span class="' + art + '" style="left:' + links.toFixed(1) +
        "%;width:" + (gelernt ? lernBreite : breite).toFixed(1) + '%"></span>' : "") +
      "</div>" +
      '<div class="strahlmarken"><span>6</span><span>10</span><span>14</span>' +
      "<span>18</span><span>22 Uhr</span></div>" +
      (istHeute ? tatZeilen(t, runden2) : "") + "</div>";
  }

  function anwesenheitKarte(){
    // Der Ausfall bekommt eine eigene Karte. Lieber "ich weiß es nicht" als
    // eine Lücke, die wie "war nicht da" aussieht.
    if (ANWESEND_FEHLER){
      return '<div class="karte"><h2>War ' + esc(kindName(KIND)) + ' da?</h2>' +
        '<p class="unter"><b>Das lässt sich gerade nicht sagen.</b> ' + esc(ANWESEND_FEHLER) +
        '<br>Das heißt <b>nicht</b>, dass niemand da war – nur, dass die Auskunft nicht kam.</p></div>';
    }
    if (!ANWESEND) return "";
    var a = (ANWESEND.kinder || {})[KIND] || {};
    var tage = a.tage || [];
    var heute = tage.filter(function(t){ return t.tag === ANWESEND.heute; })[0];

    // Hat der Speicher für einzelne Tage nicht geantwortet, darf aus "nichts
    // gefunden" kein "war nicht da" werden.
    var luecke = a.unsicher ?
      '<p class="unter" style="color:#b45309"><b>Achtung:</b> Für mindestens einen Tag hat der Speicher nicht geantwortet. ' +
      'Was hier fehlt, muss nicht bedeuten, dass niemand da war.</p>' : '';

    var kopf;
    if (heute){
      kopf = '<p class="unter"><b>Heute da:</b> ' + esc(heute.von) + ' bis ' + esc(heute.bis) +
             ' · ' + heute.viertelstunden + ' Viertelstunde' + (heute.viertelstunden === 1 ? '' : 'n') +
             (heute.amStueck === false ? ' · mit Pausen dazwischen' : '') +
             (heute.nurDuell ? ' · nur Quizduell' : '') + '</p>';
    } else if (a.zuletzt){
      kopf = '<p class="unter"><b>Heute noch nicht da.</b> Zuletzt ' +
             esc(tagName(a.zuletzt.tag)) + ' um ' + esc(a.zuletzt.uhrzeit) + ' Uhr.</p>';
    } else {
      kopf = '<p class="unter"><b>In den letzten 14 Tagen nicht da.</b> Aufgezeichnet wird das erst seit dem 19.09.2026 – davor gab es kein Protokoll.</p>';
    }

    var runden = heuteRunden(KIND);
    var zeilen = tage.map(function(t){ return strahlZeile(t, runden); }).join("");

    return '<div class="karte"><h2>War ' + esc(kindName(KIND)) + ' da?</h2>' + kopf + luecke +
      (zeilen ? '<div class="bandliste">' + zeilen + '</div>' : '') +
      '<p class="unter" style="margin-top:10px">' +
      '<i class="probe lern"></i> Lernwelt &nbsp; <i class="probe duell"></i> Quizduell' +
      ' &nbsp; <i class="probe beides"></i> beides</p>' +
      /* Kurze Stichpunkte statt Fliesstext. Denny am 21.09.2026: "Kuerze das ab
         in kurzen Stichpunkten. Ich glaube, lange Saetze sind hier einfach nur
         unnoetig." Jede Zusicherung bleibt drin - nur ohne Nebensaetze. */
      '<ul class="fussliste">' +
      '<li><b>Fette Zahl</b> = Zeit des Tages, jede Viertelstunde nur einmal</li>' +
      '<li><b>Uhrzeiten</b> = erster und letzter Moment, nicht durchgehend</li>' +
      '<li><b>Keine Lernzeit</b> – nur, ob jemand da war</li>' +
      '<li><b>Quizduell</b> – erkannt am Spitznamen; wer sich anders nennt, fehlt hier</li>' +
      '</ul></div>';
  }

  /* Was die Schule fuer dieses Kind angekuendigt hat. Denny am 21.09.2026 zum
     Schreiben der Viertklasslehrkraefte: "Ich moechte, dass dieser Bereich
     definitiv in den Elternbereich kommt, damit wir Bescheid wissen, was auf
     uns zukommt." Die Karte haengt NICHT am Spielen - sie steht auch bei einem
     Kind ohne Runden. */
  function schulinfoKarte(){
    /* Jedes Kind bekommt, was seine Schule angekuendigt hat. Bis zum
       21.09.2026 gab es die Karte nur bei Paul - Helenas Festlegungen lagen
       seit einem Tag da und kamen im Elternbereich nie an. Denny: "Warum gibt
       es das bei Helena nicht, wenn du die Informationen eigentlich seit
       gestern hast?" */
    if (KIND === "helena"){
      var tage = Math.round((new Date(2026, 9, 1) - new Date(new Date().toDateString())) / 86400000);
      return '<div class="karte"><h2>Schulaufgaben und Leistungstests – 7. Klasse</h2>' +
        '<p class="unter">Festlegungen ihrer Schule. In allen vier Fächern mehr als zwei ' +
        'Schulaufgaben – damit zählen große zu kleinen Nachweisen 2:1.</p>' +
        '<table class="termine" style="margin-bottom:12px">' +
        '<tr><td><b>Deutsch</b></td><td>3 Schulaufgaben</td></tr>' +
        '<tr><td><b>Englisch</b></td><td>3 + 1 Projekt-Schulaufgabe</td></tr>' +
        '<tr><td><b>Mathematik</b></td><td>4 Schulaufgaben</td></tr>' +
        '<tr><td><b>Französisch</b></td><td>3 + 1 mündliche</td></tr>' +
        '</table>' +
        '<p class="unter" style="margin:0 0 12px"><b>Nächster Leistungstest:</b> BET 7 in Englisch am ' +
        'Donnerstag, 01.10.2026' + (tage > 0 ? ' – in ' + tage + ' Tag' + (tage === 1 ? '' : 'en') : '') +
        '. Verpflichtend, doppelt gewichteter kleiner Leistungsnachweis.</p>' +
        '<a class="knopf-link" href="/eltern/pruefungen-helena.html">Alle Termine ansehen</a></div>';
    }
    if (KIND === "leon"){
      return '<div class="karte"><h2>Noten</h2>' +
        '<p class="unter" style="margin:0">Leon bekommt <b>erst im zweiten Halbjahr</b> Noten. ' +
        'Bis dahin steht hier nichts – das ist kein Fehler.</p></div>';
    }
    if (KIND !== "paul") return "";
    return '<div class="karte"><h2>Probearbeiten und Benotung – 4. Klasse</h2>' +
      '<p class="unter">Elterninformation der Grundschule. Kein Zwischenzeugnis, ' +
      'dafür drei Termine – und 18 schriftliche Leistungsnachweise.</p>' +
      '<table class="termine" style="margin-bottom:12px">' +
      '<tr><td><b>Zwischeninformation</b></td><td>Freitag, 22.01.2027</td></tr>' +
      '<tr><td><b>Übertrittszeugnis</b></td><td>Montag, 03.05.2027</td></tr>' +
      '<tr><td><b>Jahreszeugnis</b></td><td>Freitag, 30.07.2027</td></tr>' +
      '</table>' +
      '<a class="knopf-link" href="/eltern/probearbeiten.html">Alle Regeln ansehen</a></div>';
  }

  /* ---------- Noten ---------- */
  var NOTEN = null, NOTEN_FEHLER = null;

  function notenLaden(){
    NOTEN_FEHLER = null;
    return fetch("/api/noten", {credentials:"same-origin"})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j || !j.ok) throw new Error((j && j.fehler) || "Das ging nicht.");
        NOTEN = j.kinder || {};
      })
      .catch(function(e){ NOTEN_FEHLER = e.message || "Das ging nicht."; })
      .then(function(){ if (KIND && !$("sicht-daten").classList.contains("verborgen")) malen(); });
  }

  function notenfarbe(n){
    return n <= 2 ? "#12a35f" : (n <= 3 ? "#e8a13a" : (n <= 4 ? "#ea7317" : "#e05252"));
  }
  function komma(x){ return (Math.round(x * 100) / 100).toFixed(2).replace(".", ","); }
  function kurzDatum(iso){ var t = String(iso).split("-"); return t.length === 3 ? t[2] + "." + t[1] + "." : ""; }

  function notenKarte(){
    if (NOTEN_FEHLER){
      return '<div class="karte"><h2>Noten</h2><p class="unter"><b>Die Noten kann ich gerade nicht laden.</b> ' +
             esc(NOTEN_FEHLER) + '<br>Das heißt <b>nicht</b>, dass keine da sind.</p></div>';
    }
    if (!NOTEN) return "";
    var d = NOTEN[KIND] || {};
    if (d.kaputt){
      return '<div class="karte"><h2>Noten</h2><p class="unter"><b>Der Speicher hat nicht geantwortet.</b> ' +
             'Was hier fehlt, muss nicht bedeuten, dass keine Noten da sind.</p></div>';
    }
    var faecher = d.faecher || [];
    var kopf = '<div class="karte"><h2>Noten</h2>';

    if (!faecher.length){
      kopf += '<p class="unter">Noch keine Noten eingetragen. Sie kommen von selbst, sobald ' +
              esc(kindName(KIND)) + ' eine zurückgegebene Probe im Hausaufgaben-Heft fotografiert – ' +
              'oder du trägst einen Notenstand hier ein.</p>';
      return kopf + notenHochladen() + '</div>';
    }

    var zeilen = faecher.map(function(f){
      var chips = f.noten.map(function(n){
        var t = (n.note !== undefined && n.note !== null) ? String(n.note).replace(".", ",") : (n.punkte || "?");
        /* Ein <span>, kein Knopf: Ein Tippziel muss 44 px hoch sein (WCAG 2.5.8),
           und auf 26 px will niemand eine Note loeschen. Geaendert wird ueber
           "Noten bearbeiten" darunter - dort ist jede Zeile gross genug. */
        return '<span class="chip' + (n.sicher === false ? ' unsicher' : '') + '"' +
               ' style="background:' + (typeof n.note === "number" ? notenfarbe(n.note) : "#6b7280") + '"' +
               ' title="' + esc(n.anlass + " · " + kurzDatum(n.datum) + (n.sicher === false ? " · unsicher gelesen" : "")) + '">' +
               esc(t) + (n.gewicht === 2 ? '<em>×2</em>' : '') + (n.art === "gross" ? '<em>SA</em>' : '') + '</span>';
      }).join("");
      var toepfe = "";
      if (f.verhaeltnis) toepfe = '<span class="ntoepfe">groß ' + komma(f.gross) + ' · klein ' + komma(f.klein) + ' · ' + f.verhaeltnis + '</span>';
      /* Wie viele Schulaufgaben schon geschrieben sind. Damit sieht man, dass
         der BET NICHT dazuzaehlt - Denny am 21.09.2026: "Nicht, dass diese
         auch mit hinzugefuegt wird." */
      if (f.soll){
        var geschrieben = f.noten.filter(function(n){ return n.art === "gross"; }).length;
        toepfe += '<span class="ntoepfe">' + geschrieben + ' von ' + f.soll + ' Schulaufgaben</span>';
      }
      return '<tr><td><b>' + esc(f.fach.charAt(0).toUpperCase() + f.fach.slice(1)) + '</b></td>' +
             '<td>' + chips + '</td>' +
             '<td class="z"><span class="nschnitt" style="color:' +
             (typeof f.schnitt === "number" ? notenfarbe(f.schnitt) : "#6b7280") + '">' +
             (typeof f.schnitt === "number" ? komma(f.schnitt) : "–") + '</span>' + toepfe + '</td></tr>';
    }).join("");

    var regel = (d.regel && d.regel.schulaufgaben)
      ? '<li><b>SA</b> = Schulaufgabe. Sie zählt als eigener Topf gegen alle kleinen Nachweise (GSO Art. 28: bei zwei Schulaufgaben 1:1, bei mehr 2:1)</li>'
      : '<li>Jede Probe zählt <b>einfach</b> – so steht es im Schreiben der Schule</li>';

    return kopf +
      '<table class="ntab"><tr><th>Fach</th><th>Noten</th><th class="z">Schnitt</th></tr>' + zeilen + '</table>' +
      '<ul class="fussliste">' +
      '<li><b>Zahl im Kästchen</b> = Note, <b>×2</b> = doppelt gewichtet</li>' +
      regel +
      '<li><b>Roter Rand</b> = unsicher gelesen, bitte nachsehen</li>' +
      '<li><b>BET, BMT und BDT</b> sind kleine Nachweise – der BET zählt doppelt, ' +
      'erhöht aber nicht die Zahl der Schulaufgaben</li>' +
      '<li><b>Ändern</b> geht unten über „Noten bearbeiten"</li>' +
      '</ul>' + notenHochladen() + '</div>';
  }

  function notenHochladen(){
    return '<div class="nhoch">' +
      '<button class="haupt" id="n-blatt">📄 Notenstand hochladen</button>' +
      '<button id="n-neu">✏️ Note von Hand eintragen</button>' +
      '<button id="n-bearbeiten">🗂 Noten bearbeiten</button>' +
      '</div><div id="n-arbeit"></div>' +
      '<input type="file" id="n-datei" accept="image/*,application/pdf" style="display:none">';
  }

  /* Alles, was man mit Noten tun kann. Die Karte wird per innerHTML neu
     gebaut - deshalb EIN Zuhoerer auf dem Behaelter statt vieler auf Knoepfen,
     die es gleich nicht mehr gibt. */
  document.addEventListener("click", function(ev){
    var t = ev.target;
    var weg = t.closest && t.closest("[data-weg]");
    if (weg) return noteLoeschen(weg.getAttribute("data-weg"));
    if (t.id === "n-bearbeiten") return notenBearbeiten();
    if (t.id === "n-blatt"){ var f = $("n-datei"); if (f) f.click(); return; }
    if (t.id === "n-neu") return noteVonHand();
  });

  var NOTEN_ARBEIT = false;

  function notenMelde(html){
    var k = $("n-arbeit");
    if (k) k.innerHTML = html;
  }

  function noteLoeschen(id){
    if (!window.confirm("Diese Note wirklich löschen?")) return;
    fetch("/api/noten?kind=" + encodeURIComponent(KIND) + "&id=" + encodeURIComponent(id),
          { method: "DELETE", credentials: "same-origin" })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j || !j.ok) throw new Error((j && j.fehler) || "Das ging nicht.");
        return notenLaden();
      })
      .catch(function(e){ notenMelde('<p class="unter" style="color:#b91c1c">' + esc(e.message) + '</p>'); });
  }

  /* Alle Noten des Kindes zum Durchsehen - jede Zeile mit einem Loeschknopf,
     der mit dem Finger zu treffen ist. */
  function notenBearbeiten(){
    var d = (NOTEN || {})[KIND] || {};
    var alle = [];
    (d.faecher || []).forEach(function(f){ f.noten.forEach(function(n){ alle.push(n); }); });
    if (!alle.length) return notenMelde('<p class="unter">Es sind noch keine Noten da.</p>');
    alle.sort(function(a, b){ return a.datum < b.datum ? 1 : -1; });
    var zeilen = alle.map(function(n){
      var wert = (n.note !== undefined && n.note !== null) ? String(n.note).replace(".", ",") : (n.punkte || "?");
      return '<div class="nzeile"><span><b>' + esc(wert) + '</b> · ' +
             esc(n.fach.charAt(0).toUpperCase() + n.fach.slice(1)) + ' · ' + esc(n.anlass) +
             ' · ' + esc(kurzDatum(n.datum)) +
             (n.art === "gross" ? ' · Schulaufgabe' : '') + (n.gewicht === 2 ? ' · doppelt' : '') +
             (n.sicher === false ? ' · unsicher gelesen' : '') + '</span>' +
             '<button data-weg="' + esc(n.id) + '">Löschen</button></div>';
    }).join("");
    notenMelde('<div class="nvorschlag" style="background:#fff;border-color:var(--line)">' +
      '<b>Alle Noten von ' + esc(kindName(KIND)) + '</b>' + zeilen +
      '<div class="nhoch" style="margin-top:10px"><button id="n-verwerfen">Fertig</button></div></div>');
  }

  function noteVonHand(){
    var fach = window.prompt("Fach? (zum Beispiel: mathematik)");
    if (!fach) return;
    var note = window.prompt("Note? (1 bis 6, halbe gehen – oder leer lassen und nur Punkte angeben)");
    var punkte = note ? "" : (window.prompt("Punkte? (zum Beispiel 18/20)") || "");
    var anlass = window.prompt("Anlass? (zum Beispiel: Schulaufgabe 1)") || "Leistungsnachweis";
    var datum = window.prompt("Datum? (JJJJ-MM-TT, leer = heute)") || "";
    var gross = /schulaufgabe|klausur/i.test(anlass);
    noteSenden({ fach: fach, note: note, punkte: punkte, anlass: anlass, datum: datum,
                 art: gross ? "gross" : "klein", quelle: "eltern" });
  }

  function noteSenden(note){
    return fetch("/api/noten", { method: "POST", credentials: "same-origin",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ kind: KIND, note: note }) })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j || !j.ok) throw new Error((j && j.fehler) || "Das ging nicht.");
        return notenLaden();
      })
      .catch(function(e){ notenMelde('<p class="unter" style="color:#b91c1c">' + esc(e.message) + '</p>'); });
  }

  /* Ein Notenstand von der Schule. Denny am 21.09.2026: "Helena bekommt jeden
     Monat einen Notendurchschnitt mitgeteilt. Den kann ich dir dann auch
     entsprechend hochladen." Gelesen wird von Claude - gespeichert wird erst
     nach Dennys Klick. Ein falsch gelesener Notenstand waere schlimmer als
     gar keiner. */
  document.addEventListener("change", function(ev){
    if (ev.target.id !== "n-datei") return;
    var datei = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!datei || NOTEN_ARBEIT) return;
    if (datei.size > 4 * 1024 * 1024)
      return notenMelde('<p class="unter" style="color:#b91c1c">Das Blatt ist zu groß (höchstens 4 MB).</p>');

    NOTEN_ARBEIT = true;
    notenMelde('<p class="unter">Ich lese das Blatt … das dauert einen Moment.</p>');
    var leser = new FileReader();
    leser.onload = function(){
      fetch("/api/noten", { method: "POST", credentials: "same-origin",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ kind: KIND, blatt: leser.result }) })
        .then(function(r){ return r.json(); })
        .then(function(j){
          NOTEN_ARBEIT = false;
          if (!j || !j.ok) throw new Error((j && j.fehler) || "Das ging nicht.");
          vorschlaegeZeigen(j.vorschlaege || []);
        })
        .catch(function(e){
          NOTEN_ARBEIT = false;
          notenMelde('<p class="unter" style="color:#b91c1c">' + esc(e.message) + '</p>');
        });
    };
    leser.onerror = function(){ NOTEN_ARBEIT = false; notenMelde('<p class="unter" style="color:#b91c1c">Die Datei konnte ich nicht lesen.</p>'); };
    leser.readAsDataURL(datei);
  });

  var VORSCHLAEGE = [];
  function vorschlaegeZeigen(liste){
    VORSCHLAEGE = liste;
    if (!liste.length){
      notenMelde('<p class="unter">Auf dem Blatt habe ich keine Note gefunden. Nichts gespeichert.</p>');
      return;
    }
    var unsicher = liste.filter(function(n){ return n.sicher === false; }).length;
    var zeilen = liste.map(function(n){
      return '<li>' + esc(n.fach) + ': <b>' + esc(n.note !== undefined ? String(n.note).replace(".", ",") : (n.punkte || "?")) + '</b>' +
             ' · ' + esc(n.anlass) + ' · ' + esc(kurzDatum(n.datum)) +
             (n.art === "gross" ? ' · Schulaufgabe' : '') +
             (n.gewicht === 2 ? ' · doppelt' : '') +
             (n.sicher === false ? ' · <b style="color:#b91c1c">unsicher gelesen</b>' : '') + '</li>';
    }).join("");
    notenMelde('<div class="nvorschlag"><b>Gefunden: ' + liste.length + ' Note' + (liste.length === 1 ? '' : 'n') + '</b>' +
      (unsicher ? ' – davon ' + unsicher + ' unsicher gelesen. Bitte vor dem Übernehmen prüfen.' : '') +
      '<ul>' + zeilen + '</ul>' +
      '<div class="nhoch" style="margin-top:0">' +
      '<button class="haupt" id="n-uebernehmen">Alle übernehmen</button>' +
      '<button id="n-verwerfen">Verwerfen</button></div>' +
      '<p class="unter" style="margin:10px 0 0">Gespeichert ist noch nichts.</p></div>');
  }

  document.addEventListener("click", function(ev){
    if (ev.target.id === "n-verwerfen"){ VORSCHLAEGE = []; notenMelde(""); return; }
    if (ev.target.id !== "n-uebernehmen") return;
    ev.target.disabled = true;
    var offen = VORSCHLAEGE.slice();
    (function weiter(){
      if (!offen.length){
        VORSCHLAEGE = [];
        return notenLaden().then(function(){ notenMelde('<p class="unter">Übernommen.</p>'); });
      }
      noteSenden(offen.shift()).then(weiter);
    })();
  });

  function malen(){
    if (!KIND) return;
    var d = DATEN[KIND] || {};
    var h = "";
    /* Der Zeitpunkt des ABRUFS, nicht die aktuelle Uhr. Geholt wird genau
       einmal beim Laden; die Zeile wurde aber bei jedem Reiterklick auf "jetzt"
       gesetzt. Wer um 21 Uhr auf Helenas Reiter tippt, las dann "heute noch
       nicht da, Stand 21:00" - obwohl die Daten von 19 Uhr waren und sie um
       19:30 noch da war (Pruefrunde 04). */
    $("stand").textContent = "Stand: " + (GEHOLT_UM || new Date()).toLocaleString("de-DE", {dateStyle:"medium", timeStyle:"short"});

    if (!d.runden){
      // Die Anwesenheit MUSS auch hier stehen. Genau bei einem Kind ohne
      // Runden ist die Frage "war es überhaupt da?" am wichtigsten - stünde die
      // Karte erst weiter unten, wäre sie ausgerechnet dann unsichtbar.
      $("inhalt").innerHTML = anwesenheitKarte() + notenKarte() + schulinfoKarte() +
        '<div class="karte"><h2>Noch nichts gespielt</h2>' +
        '<p class="unter">Sobald ' + esc(KIND) + ' eine Runde beendet, steht hier die Auswertung.</p></div>';
      return;
    }
    h += anwesenheitKarte() + notenKarte() + schulinfoKarte();

    /* Überblick */
    h += '<div class="karte"><h2>Überblick</h2><p class="unter">Alles, was aufgezeichnet ist.</p><div class="zahlen">' +
      kachel(d.quote + " %", "richtig gelöst", stufe(d.quote)) +
      kachel(d.aufgaben, "Aufgaben in " + d.runden + " Runden") +
      kachel(minuten(d.minuten), "Zeit insgesamt") +
      kachel(d.aufgaben ? Math.round(d.minuten*60/d.aufgaben) + " s" : "–", "je Aufgabe") +
      '</div></div>';

    /* Tag, Woche, Jahreszeit - Dennys Wunsch vom 07.09.2026.
       Eine Zahl allein sagt wenig. "8 Minuten" wird erst zur Aussage, wenn
       daneben steht, wie viel es im Zeitraum davor war. */
    if (d.zeitraeume){
      h += '<div class="karte"><h2>Tag, Woche und Jahreszeit</h2>' +
           '<p class="unter">Wie viel gelernt, wie viele Spiele, wie viel Zeit – und wie es davor war.</p>' +
           '<div class="zeitraeume">';
      ["tag","woche","jahreszeit"].forEach(function(k){
        var z = d.zeitraeume[k]; if (!z) return;
        h += zeitraum(z);
      });
      h += '</div></div>';
    }

    /* Wortschatz: wie viel vom Vorrat ist überhaupt angefasst? */
    if ((d.wortschatz||[]).length){
      h += '<div class="karte"><h2>Wortschatz</h2>' +
           '<p class="unter">Wie viele verschiedene Wörter schon drankamen. Mehr Wörter nachzulegen hilft erst, wenn der Vorrat wirklich knapp wird.</p>';
      d.wortschatz.forEach(function(w){
        h += '<div class="vorrat">' +
             '<div class="vorrat-kopf"><b>' + esc(fachName(w.fach)) + '</b>' +
             '<span>' + w.angefasst + ' von ' + w.vorrat + ' Wörtern · ' + w.anteil + ' %</span></div>' +
             '<div class="balken"><i style="width:' + Math.max(1, Math.min(100, w.anteil)) + '%"></i></div>' +
             '</div>';
      });
      h += '</div>';
    }

    /* Wie geübt wurde. Ohne das vergleicht die Seite Äpfel mit Birnen:
       Wiedererkennen und Abrufen stehen sonst gleichwertig nebeneinander. */
    if ((d.arten||[]).length){
      h += '<div class="karte"><h2>Wie geübt wird</h2>' +
           '<p class="unter">Eine niedrige Quote beim Eintippen ist mehr wert als eine hohe beim Ankreuzen – ' +
           'da muss das Wort wirklich abgerufen werden. Deshalb stehen die Arten hier getrennt.</p>' +
           '<table><thead><tr><th>Übungsart</th><th style="width:30%">Anteil richtig</th>' +
           '<th style="text-align:right">Aufgaben</th><th style="text-align:right">je Aufgabe</th></tr></thead><tbody>';
      d.arten.forEach(function(a){
        var st = stufe(a.quote);
        h += '<tr><td><b>' + esc(artName(a.art)) + '</b>' +
               '<div class="nebenzeile">' + esc(artErklaerung(a.art)) + '</div></td>' +
             '<td><div class="balken"><i class="b-' + st + '" style="width:' +
               Math.max(2, Math.min(100, a.quote||0)) + '%"></i></div>' +
               '<span class="q ' + st + '">' + (a.quote===null?"–":a.quote + " %") + '</span></td>' +
             '<td style="text-align:right;color:var(--muted)">' + a.aufgaben + '</td>' +
             '<td style="text-align:right;color:var(--muted)">' + (a.schnitt||0) + ' s</td></tr>';
      });
      h += '</tbody></table></div>';
    }

    /* Problemzonen - das Wichtigste zuerst */
    var schwach = (d.merkmale||[]).filter(function(m){ return m.aufgaben >= 3 && m.quote < 80; });
    h += '<div class="karte"><h2>Woran es hakt</h2>' +
         '<p class="unter">Nur Themen mit mindestens drei Versuchen. Das oberste zuerst üben.</p>';
    if (!schwach.length){
      h += '<div class="leer">Nichts Auffälliges – alles über 80 Prozent.</div>';
    } else {
      h += tabelle(schwach.slice(0,10));
    }
    h += '</div>';

    /* Wiederkehrende Fehler */
    if ((d.stolpersteine||[]).length){
      h += '<div class="karte"><h2>Immer derselbe Fehler</h2>' +
           '<p class="unter">Diese falsche Antwort kam mehrfach – das ist meist ein Denkfehler mit System, kein Verrutschen.</p><table><tbody>';
      d.stolpersteine.forEach(function(s){
        h += '<tr><td><b>' + esc(s.merkmal) + '</b></td>' +
             '<td><span class="muster">' + esc(s.muster) + '</span></td>' +
             '<td style="text-align:right;color:var(--muted)">' + s.wieOft + '×</td></tr>';
      });
      h += '</tbody></table></div>';
    }

    /* Was sitzt */
    var stark = (d.merkmale||[]).filter(function(m){ return m.aufgaben >= 3 && m.quote >= 80; });
    if (stark.length){
      h += '<div class="karte"><h2>Was sitzt</h2><p class="unter">Hier ist keine Übung nötig.</p>' +
           tabelle(stark.slice(0,8)) + '</div>';
    }

    /* Verlauf */
    if ((d.verlauf||[]).length > 1){
      h += '<div class="karte"><h2>Entwicklung</h2><p class="unter">Anteil richtiger Antworten je Woche.</p>' +
           verlauf(d.verlauf) + '</div>';
    }

    /* Themen */
    if ((d.themen||[]).length){
      h += '<div class="karte"><h2>Nach Thema</h2><p class="unter">Schwächstes zuerst.</p>' +
           tabelle(d.themen, true) + '</div>';
    }

    /* Womit gespielt wird - hilft bei Usability-Fragen */
    if ((d.geraete||[]).length){
      h += '<div class="karte"><h2>Womit gespielt wird</h2>' +
           '<p class="unter">Wo es hakt, hängt oft am Gerät. Deshalb wird es mitgeschrieben.</p>' +
           '<table><thead><tr><th>Gerät</th><th style="text-align:right">Runden</th>' +
           '<th style="text-align:right">Zeit</th></tr></thead><tbody>';
      d.geraete.forEach(function(g){
        h += '<tr><td>' + esc(g.name) + '</td>' +
             '<td style="text-align:right;color:var(--muted)">' + g.runden + '</td>' +
             '<td style="text-align:right;color:var(--muted)">' + minuten(g.minuten) + '</td></tr>';
      });
      h += '</tbody></table></div>';
    }

    /* Letzte Runden */
    h += '<div class="karte"><h2>Zuletzt gespielt</h2>' +
         '<p class="unter">Mit Tag, Kalenderwoche und Jahreszeit – damit man später noch weiß, wann das war.</p>' +
         '<table><thead><tr><th>Wann</th><th>Spiel</th>' +
         '<th style="text-align:right">Ergebnis</th><th style="text-align:right">Dauer</th></tr></thead><tbody>';
    (d.letzte||[]).forEach(function(r){
      var q = r.aufgaben ? Math.round(r.richtig/r.aufgaben*100) : 0;
      var bauen = (r.zeitart === "bauen");
      var zusatz = [];
      if (r.kw) zusatz.push("KW " + r.kw);
      if (r.jahreszeit) zusatz.push(r.jahreszeit);
      if (r.minutenPause) zusatz.push(r.minutenPause + " min Pause");
      h += '<tr><td style="white-space:nowrap">' +
             // "Mo, heute 08:17" ist doppelt gemoppelt - bei heute reicht heute.
             '<div>' + esc(istHeute(r.zeit) ? wann(r.zeit)
                            : (r.wochentag ? r.wochentag + ", " : "") + wann(r.zeit)) + '</div>' +
             '<div class="nebenzeile">' + esc(zusatz.join(" · ")) + '</div></td>' +
           '<td>' + esc(r.titel||"–") +
             (bauen ? '<span class="marke">gebaut</span>' : '') +
             (r.thema ? '<div class="nebenzeile">' + esc(r.thema) + '</div>' : '') + '</td>' +
           '<td style="text-align:right">' +
             (bauen || !r.aufgaben
               ? '<span style="color:var(--muted)">–</span>'
               : '<span class="q ' + stufe(q) + '">' + r.richtig + '/' + r.aufgaben + '</span>') +
             '</td>' +
           '<td style="text-align:right;color:var(--muted)">' + kurzZeit(r) + '</td></tr>';
    });
    h += '</tbody></table></div>';

    $("inhalt").innerHTML = h;
  }

  // Ein Zeitraum-Block: was gelernt, wie viele Spiele, wie viel Zeit -
  // und darunter der Vergleich zum Zeitraum davor.
  function zeitraum(z){
    var titel = z.titel + (z.kw ? ' <span class="kw">KW ' + z.kw + '</span>' : '');
    var inhalt;
    if (!z.runden && !z.minutenBauen){
      inhalt = '<div class="leer" style="margin:0">Noch nichts gespielt.</div>';
    } else {
      inhalt =
        '<div class="zr-zeile"><span>Gelernt</span><b>' +
          (z.aufgaben ? z.richtig + ' von ' + z.aufgaben + ' richtig' + (z.quote !== null ? ' · ' + z.quote + ' %' : '') : '–') +
        '</b></div>' +
        '<div class="zr-zeile"><span>Spiele</span><b>' + z.runden + '</b></div>' +
        '<div class="zr-zeile"><span>Lernzeit</span><b>' + minuten(z.minuten) + '</b></div>' +
        (z.minutenPause ? '<div class="zr-zeile"><span>davon Pause</span><b>' + minuten(z.minutenPause) + '</b></div>' : '') +
        (z.minutenBauen ? '<div class="zr-zeile"><span>Werkstatt gebaut</span><b>' + minuten(z.minutenBauen) + '</b></div>' : '') +
        (z.tageAktiv > 1 ? '<div class="zr-zeile"><span>Tage aktiv</span><b>' + z.tageAktiv + '</b></div>' : '');
    }
    return '<div class="zr"><h3>' + titel + '</h3>' + inhalt + vergleich(z) + '</div>';
  }

  // Besser oder schlechter als davor? Ohne Wertung formuliert - es geht um
  // die Richtung, nicht um eine Note.
  function vergleich(z){
    var v = z.davor; if (!v) return "";
    // Ohne Gegenstueck kein Vergleich: Ein Pfeil nach oben gegen eine Null
    // sieht nach Fortschritt aus, wo einfach nichts aufgezeichnet ist.
    if (!v.runden){
      if (!z.runden) return "";
      return '<div class="zr-davor">' + esc(z.davorTitel) + ': nichts aufgezeichnet</div>';
    }
    var teile = [pfeil(z.minuten, v.minuten) + " " + minuten(v.minuten),
                 pfeil(z.aufgaben, v.aufgaben) + " " + v.aufgaben + " Aufgaben"];
    return '<div class="zr-davor">' + esc(z.davorTitel) + ': ' + teile.join(" \u00B7 ") + '</div>';
  }
  function pfeil(jetzt, davor){
    if (jetzt > davor) return "\u2191";
    if (jetzt < davor) return "\u2193";
    return "\u2192";
  }

  function istHeute(iso){
    try { return new Date(iso).toDateString() === new Date().toDateString(); }
    catch(e){ return false; }
  }

  // Aus "vok-auswahl-4" wird "Ankreuzen (4 zur Wahl)" - die nackte Kennung
  // sagt einem Elternteil nichts.
  function artName(a){
    if (a.indexOf("vok-auswahl") === 0){
      var n = a.split("-")[2];
      return "Ankreuzen" + (n ? " (" + n + " zur Wahl)" : "");
    }
    return ({ "vok-tippen":"Eintippen", "vok-luecke":"Lückentext", "vok-hoeren":"Hören & schreiben",
              "vokabel":"Vokabeln", "spiel":"Im Spiel" })[a] || a;
  }
  function artErklaerung(a){
    if (a.indexOf("vok-auswahl") === 0) return "wiedererkennen – am leichtesten";
    return ({ "vok-tippen":"abrufen und schreiben – am wirksamsten",
              "vok-luecke":"im Satz ergänzen",
              "vok-hoeren":"hören und schreiben – am schwersten" })[a] || "";
  }

  function fachName(f){
    return ({englisch:"Englisch", franzoesisch:"Französisch", deutsch:"Deutsch",
             mathe:"Mathe", hsu:"HSU", musik:"Musik", religion:"Religion"})[f] || f;
  }

  // Unter einer Minute ist "0 min" irreführend - dann lieber Sekunden.
  function kurzZeit(r){
    if (r.minuten) return r.minuten + " min";
    if (r.sekunden) return r.sekunden + " s";
    return "–";
  }

  function kachel(gross, klein, klasse){
    return '<div class="zahl"><div class="gross ' + (klasse||"") + '">' + esc(gross) + '</div>' +
           '<div class="klein">' + esc(klein) + '</div></div>';
  }

  function tabelle(zeilen, istThema){
    var h = '<table><thead><tr><th>' + (istThema ? "Thema" : "Was geübt wird") +
            '</th><th style="width:34%">Anteil richtig</th>' +
            '<th style="text-align:right">Versuche</th></tr></thead><tbody>';
    zeilen.forEach(function(m){
      var s = stufe(m.quote);
      h += '<tr><td><b>' + esc(istThema ? (m.thema||m.name) : m.name) + '</b></td>' +
           '<td><div style="display:flex;align-items:center;gap:9px">' +
             '<span class="q ' + s + '">' + m.quote + ' %</span>' +
             '<span class="balken" style="flex:1"><i class="b-' + s + '" style="width:' + m.quote + '%"></i></span>' +
           '</div></td>' +
           '<td style="text-align:right;color:var(--muted)">' + m.richtig + '/' + m.aufgaben + '</td></tr>';
    });
    return h + '</tbody></table>';
  }

  function verlauf(wochen){
    var letzte = wochen.slice(-12);
    var h = '<div class="verlauf">';
    letzte.forEach(function(w){
      var q = w.quote == null ? 0 : w.quote;
      h += '<div class="w" title="' + esc(w.aufgaben + " Aufgaben, " + w.minuten + " min") + '">' +
             '<span class="wert">' + q + '%</span>' +
             '<div class="saeule" style="height:' + Math.max(3, q) + '%;background:' + (FARBEN[KIND]||"var(--akzent)") + '"></div>' +
             '<span class="datum">' + esc(kurzDatum(w.woche)) + '</span>' +
           '</div>';
    });
    return h + '</div>';
  }

  function minuten(m){
    if (!m) return "0 min";
    if (m < 60) return m + " min";
    return Math.floor(m/60) + " h " + (m%60) + " min";
  }
  function wann(iso){
    try {
      var d = new Date(iso), jetzt = new Date();
      if (d.toDateString() === jetzt.toDateString()) return "heute " + d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
      return d.toLocaleDateString("de-DE",{day:"numeric",month:"short"});
    } catch(e){ return "–"; }
  }
  function kurzDatum(iso){
    try { return new Date(iso).toLocaleDateString("de-DE",{day:"numeric",month:"numeric"}); } catch(e){ return "?"; }
  }

  laden();
})();
</script>
</body>
</html>
